<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유란시아서 신규 독자 과정 (10주) — 한국 유란시아서 독자 모임</title>
<meta name="description" content="유란시아 대학교 연구소(UUI) 신규 독자 과정 10주 교안 한글판">
<style>
  :root{
    --navy:#1b2450; --navy2:#2a3358; --gold:#e0a53c; --gold2:#f3cd7a;
    --ink:#1d2233; --muted:#6b7391; --line:#dfe3ee; --bg:#eef0f7; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
  img{max-width:100%}

  .rainbow{height:4px;background:linear-gradient(90deg,#e05a5a,#e0a53c,#e8d44d,#5cb87a,#4f9fd8,#7b6fd0,#b86fc0)}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:20px}
  .htitle{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;max-width:1400px;margin:0 auto}
  .htitle h1{margin:0;font-size:1.4rem;letter-spacing:-.02em}
  .htitle .sub{color:var(--gold2);font-size:.92rem}
  .home{margin-left:auto;border:1px solid rgba(255,255,255,.45);border-radius:999px;
        padding:6px 14px;font-size:.85rem;text-decoration:none;color:#fff;white-space:nowrap}

  .intro{max-width:1400px;margin:0 auto;padding:14px 20px 0;color:var(--muted);font-size:.92rem}

  .wrap{max-width:1400px;margin:0 auto;padding:14px 20px 40px;
        display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}

  nav.list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;
           position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  nav.list h2{margin:6px 8px 10px;font-size:.8rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .wk{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
      padding:10px 12px;border-radius:10px;font:inherit;color:inherit;margin-bottom:2px;
      border-left:3px solid transparent}
  .wk:hover{background:#eef1f9}
  .wk.on{background:var(--navy);color:#fff;border-left-color:var(--gold)}
  .wk .n{display:block;font-weight:700;font-size:.95rem}
  .wk .t{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
  .wk.on .t{color:var(--gold2)}

  main{min-width:0}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
       display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;
       position:sticky;top:12px;z-index:5}
  .bar .now{font-weight:700;min-width:0}
  .bar .now small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
  .btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#fff;
       border-radius:999px;padding:7px 14px;font-size:.86rem;color:var(--ink);white-space:nowrap;
       cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--navy)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2a05;font-weight:700}
  .btn[disabled]{opacity:.4;pointer-events:none}

  .pages{margin-top:14px;display:flex;flex-direction:column;gap:14px}
  .page{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
        box-shadow:0 1px 3px rgba(20,28,60,.06)}
  .page img{display:block;width:100%;height:auto;background:#f3f4f9}
  .pnum{padding:6px 12px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);text-align:right}

  .nextprev{display:flex;gap:8px;margin-top:16px}
  .nextprev .btn{flex:1;text-align:center}

  footer{max-width:1400px;margin:0 auto;padding:0 20px 36px;color:var(--muted);font-size:.85rem}

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;padding:10px 10px 30px;gap:10px}
    .htitle h1{font-size:1.15rem}
    .pages{gap:10px}
    .bar{border-radius:12px;top:0}
    .intro{font-size:.88rem;padding-top:10px}

    /* 폰에서는 주차 목록을 가로로 넘기는 알약 줄로 바꿔 교안이 바로 보이게 한다 */
    nav.list{position:sticky;top:0;z-index:6;max-height:none;padding:8px;
             display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
             border-radius:12px}
    nav.list h2{display:none}
    .wk{width:auto;flex:0 0 auto;margin:0;padding:8px 14px;border-left:0;
        border:1px solid var(--line);border-radius:999px;white-space:nowrap}
    .wk.on{border-color:var(--gold)}
    .wk .t{display:none}
    .wk .n{font-size:.9rem}
  }
</style>
</head>
<body>
<div class="rainbow"></div>
<header>
  <div class="htitle">
    <h1>유란시아서 신규 독자 과정</h1>
    <span class="sub">유란시아 대학교 연구소(UUI) 10주 과정 · 한글판</span>
    <a class="home" href="https://urantiareaders.com/">홈으로</a>
  </div>
</header>

<p class="intro">
  유란시아서를 처음 읽는 분들을 위한 10주 안내 과정입니다.
  주차를 고르면 교안이 아래로 죽 이어집니다. 내려받기 단추로 원본 PDF도 받으실 수 있습니다.
</p>

<div class="wrap">
  <nav class="list" id="list">
    <h2>10주 교안</h2>
  </nav>

  <main>
    <div class="bar">
      <div class="now" id="now"></div>
      <div class="btns">
        <a class="btn gold" id="dl" href="#" download>PDF 내려받기</a>
      </div>
    </div>

    <div class="pages" id="pages"></div>

    <div class="nextprev">
      <button class="btn" id="prev" type="button">← 이전 주차</button>
      <button class="btn" id="next" type="button">다음 주차 →</button>
    </div>
  </main>
</div>

<footer>
  한국 유란시아서 독자 모임 · 교안 출처: Urantia University Institute, New Reader Course (한글 번역판)
</footer>

<script>
/* 주차를 더하거나 제목을 고칠 때는 아래 한 줄씩만 손보면 됩니다.
   pages 는 그 주차의 쪽수(pages 폴더 안 w<N>-001.jpg ~ 이미지 개수)입니다.
   윗줄 끝의 쉼표를 빠뜨리지 않도록 주의하세요. */
var WEEKS = [
  {n:1,  pages:8,  pdf:"w1.pdf",  title:"영적 여정 나누기와 과정 개요"},
  {n:2,  pages:22, pdf:"w2.pdf",  title:"제1부 — 신학, 중앙 우주 구조와 고위 존재들"},
  {n:3,  pages:23, pdf:"w3.pdf",  title:"제2부 — 지역 우주 신학과 구조"},
  {n:4,  pages:29, pdf:"w4.pdf",  title:"제2부(계속) — 지역 우주와 거주 세계에서의 삶"},
  {n:5,  pages:25, pdf:"w5.pdf",  title:"제3부 — 유란시아의 기원과 초기 문명"},
  {n:6,  pages:27, pdf:"w6.pdf",  title:"제3부 — 아담과 이브, 가족, 진화 종교"},
  {n:7,  pages:24, pdf:"w7.pdf",  title:"제3부 — 종교, 고급 신학, 생각 조절자"},
  {n:8,  pages:27, pdf:"w8.pdf",  title:"제4부 — 예수의 생애: 증여와 공적 사역"},
  {n:9,  pages:27, pdf:"w9.pdf",  title:"제4부 — 마지막 주간, 부활과 출현"},
  {n:10, pages:16, pdf:"w10.pdf", title:"통합하고 앞으로 나아가기"}
];

var listEl  = document.getElementById('list');
var pagesEl = document.getElementById('pages');
var nowEl   = document.getElementById('now');
var dlEl    = document.getElementById('dl');
var prevEl  = document.getElementById('prev');
var nextEl  = document.getElementById('next');
var cur = 0;

function pad(n){ return n < 10 ? '00' + n : (n < 100 ? '0' + n : '' + n); }

WEEKS.forEach(function(w, i){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'wk';
  b.innerHTML = '<span class="n"></span><span class="t"></span>';
  b.querySelector('.n').textContent = w.n + '주차';
  b.querySelector('.t').textContent = w.title;
  b.addEventListener('click', function(){ show(i, true); });
  listEl.appendChild(b);
});
var btns = listEl.querySelectorAll('.wk');

function show(i, scroll){
  if(i < 0 || i >= WEEKS.length) return;
  cur = i;
  var w = WEEKS[i];

  for(var k = 0; k < btns.length; k++) btns[k].classList.toggle('on', k === i);

  nowEl.innerHTML = '<span></span><small></small>';
  nowEl.firstChild.textContent = w.n + '주차 (' + w.pages + '쪽)';
  nowEl.lastChild.textContent = w.title;

  dlEl.href = w.pdf;
  dlEl.setAttribute('download', '유란시아서 신규 독자 과정 ' + w.n + '주차.pdf');

  pagesEl.innerHTML = '';
  for(var p = 1; p <= w.pages; p++){
    var box = document.createElement('div');
    box.className = 'page';
    var img = document.createElement('img');
    img.src = 'pages/w' + w.n + '-' + pad(p) + '.jpg';
    img.alt = w.n + '주차 ' + p + '쪽';
    img.loading = (p <= 2) ? 'eager' : 'lazy';
    img.decoding = 'async';
    var cap = document.createElement('div');
    cap.className = 'pnum';
    cap.textContent = p + ' / ' + w.pages;
    box.appendChild(img);
    box.appendChild(cap);
    pagesEl.appendChild(box);
  }

  prevEl.disabled = (i === 0);
  nextEl.disabled = (i === WEEKS.length - 1);

  if(history.replaceState) history.replaceState(null, '', '#w' + w.n);
  if(scroll) window.scrollTo({top:0, behavior:'smooth'});
}

prevEl.addEventListener('click', function(){ show(cur - 1, true); });
nextEl.addEventListener('click', function(){ show(cur + 1, true); });

function fromHash(){
  var m = (location.hash || '').match(/^#w(\d+)$/);
  if(!m) return 0;
  for(var j = 0; j < WEEKS.length; j++){
    if(WEEKS[j].n === parseInt(m[1], 10)) return j;
  }
  return 0;
}
window.addEventListener('hashchange', function(){ show(fromHash(), false); });
show(fromHash(), false);
</script>
</body>
</html>

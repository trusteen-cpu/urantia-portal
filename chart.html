<style>
:root{--navy:#1f3f52;--teal:#2e7d7a;--gold:#a8801f;--ink:#20272c;--line:#dfe6ea;--bg:#f6f8f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.hero{position:relative;background:linear-gradient(160deg,#16303f 0%,#1f3f52 55%,#264a5c 100%);
 color:#fff;padding:34px 20px 30px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;max-width:1240px;margin:0 auto;text-align:center}
.hero h1{margin:0 0 6px;font-size:27px;letter-spacing:-.4px}
.hero p{margin:0;font-size:14px;color:#cfe0e8}
.hero .rule{width:74px;height:3px;background:#d8b45a;margin:13px auto 0;border-radius:2px}
.bar{position:sticky;top:0;z-index:20;background:rgba(246,248,249,.96);
 border-bottom:1px solid var(--line);padding:11px 20px}
.bar .in{max-width:1240px;margin:0 auto;display:flex;align-items:center}
#q{flex:1;min-width:0;padding:9px 13px;border:1px solid #c8d3d9;border-radius:22px;
 font-size:14px;font-family:inherit;background:#fff}
#q:focus{outline:none;border-color:var(--navy)}
#cnt{margin-left:12px;font-size:12.5px;color:#5d6b73;white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.sec{margin-bottom:30px}
.sh{display:flex;align-items:baseline;gap:9px;padding-bottom:8px;
 border-bottom:2px solid var(--navy);margin-bottom:15px;color:var(--navy)}
.sh b{font-size:17px}
.sh span{font-size:12.5px;color:#5d6b73}
.grid{display:flex;flex-wrap:wrap;gap:14px}
@supports(display:grid){.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}}
.c{margin:0;width:196px;background:#fff;border:1px solid #e4ebee;border-radius:8px;
 overflow:hidden;cursor:zoom-in;transition:box-shadow .12s,border-color .12s}
@supports(display:grid){.c{width:auto}}
.c:hover{border-color:var(--navy);box-shadow:0 3px 12px rgba(31,63,82,.14)}
.th{height:132px;display:flex;align-items:center;justify-content:center;
 background:#fbfcfd;border-bottom:1px solid #eef2f4;overflow:hidden}
.th img{max-width:100%;max-height:132px;display:block}
figcaption{padding:7px 9px 9px;font-size:12px;line-height:1.42}
.bd{display:inline-block;min-width:19px;margin-right:5px;padding:0 4px;border-radius:4px;
 background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;text-align:center;
 vertical-align:1px}
.tt{color:var(--ink)}
.foot{max-width:1240px;margin:0 auto;padding:0 20px 44px;font-size:12.5px;color:#68767e;text-align:center}
.foot a{color:var(--navy);border-bottom:1px solid #c2d0d7}
#top{position:fixed;right:17px;bottom:17px;display:none;width:41px;height:41px;border-radius:50%;
 background:var(--navy);color:#fff;border:0;font-size:17px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.22)}
#lb{position:fixed;inset:0;z-index:60;display:none;background:rgba(14,26,34,.94)}
#lb.on{display:flex;flex-direction:column}
#lb .hd{flex:none;display:flex;align-items:center;gap:12px;padding:11px 15px;color:#e8f0f4;font-size:13.5px}
#lb .hd .sp{margin-left:auto;display:flex;gap:8px}
#lb .hd button,#lb .hd a{background:rgba(255,255,255,.13);color:#fff;border:0;border-radius:16px;
 padding:5px 13px;font-size:12.5px;font-family:inherit;cursor:pointer}
#lb .bd2{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px 16px;min-height:0}
#lb img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
@media print{.hero,.bar,#top,.foot,#lb{display:none}.wrap{padding:0;max-width:none}}
</style>
</head>

<button id="top" title="맨 위로">↑</button>

<div id="lb">
  <div class="hd">
    <span id="lbt"></span>
    <span class="sp">
      <button id="pv">← 이전</button>
      <button id="nx">다음 →</button>
      <a id="op" href="#" target="_blank" rel="noopener">원본 크기 ↗</a>
      <button id="cl">닫기 ✕</button>

<script>
(function(){
  var c=document.getElementById('sky'),x=c.getContext('2d');
  function draw(){
    var r=c.parentNode.getBoundingClientRect();
    c.width=r.width;c.height=r.height;
    for(var i=0;i<130;i++){
      var a=Math.random()*.75+.12,s=Math.random()*1.5+.3;
      x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,s,0,6.3);
      x.fillStyle='rgba(255,255,255,'+a+')';x.fill();
    }
  }
  draw();window.addEventListener('resize',draw);
})();

var cards=[].slice.call(document.querySelectorAll('.c'));

(function(){
  var q=document.getElementById('q'),cnt=document.getElementById('cnt'),
      secs=[].slice.call(document.querySelectorAll('.sec'));
  function show(){
    var v=q.value.trim().toLowerCase(),n=0;
    cards.forEach(function(el){
      var hit=!v||el.getAttribute('data-k').indexOf(v)>=0;
      el.style.display=hit?'':'none';if(hit)n++;
    });
    secs.forEach(function(s){
      var any=[].slice.call(s.querySelectorAll('.c')).some(function(e){return e.style.display!=='none';});
      s.style.display=any?'':'none';
    });
    cnt.textContent=n+'장';
  }
  q.addEventListener('input',show);show();
})();

(function(){
  var lb=document.getElementById('lb'),img=document.getElementById('lbi'),
      ttl=document.getElementById('lbt'),op=document.getElementById('op'),cur=-1;
  function vis(){return cards.filter(function(e){return e.style.display!=='none';});}
  function open(el){
    var list=vis();cur=list.indexOf(el);
    img.src=el.getAttribute('data-src');
    ttl.textContent=el.getAttribute('data-t');
    op.href=el.getAttribute('data-src');
    lb.className='on';
  }
  function step(d){
    var list=vis();if(!list.length)return;
    cur=(cur+d+list.length)%list.length;open(list[cur]);
  }
  cards.forEach(function(el){el.onclick=function(){open(el);};});
  document.getElementById('cl').onclick=function(){lb.className='';img.src='';};
  document.getElementById('pv').onclick=function(e){e.stopPropagation();step(-1);};
  document.getElementById('nx').onclick=function(e){e.stopPropagation();step(1);};
  lb.onclick=function(e){if(e.target===lb||e.target.className==='bd2'){lb.className='';img.src='';}};
  document.addEventListener('keydown',function(e){
    if(lb.className!=='on')return;
    if(e.key==='Escape'){lb.className='';img.src='';}
    if(e.key==='ArrowLeft')step(-1);
    if(e.key==='ArrowRight')step(1);
  });
})();

(function(){
  var b=document.getElementById('top');
  window.addEventListener('scroll',function(){b.style.display=window.scrollY>500?'block':'none';});
  b.onclick=function(){window.scrollTo({top:0,behavior:'smooth'});};
})();
</script>

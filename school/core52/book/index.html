<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="/auth.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유란시아서 핵심</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--paper:#fffdf8;--ink:#23262d;--mute:#77716a;--navy:#17365D;--gold:#B7791F;--line:#e4dccb;--fs:17.5px}
html[data-dark="1"]{--bg:#12161e;--paper:#1a1f29;--ink:#dfe3ea;--mute:#98a0ad;--navy:#9cc0ea;--gold:#e9c46a;--line:#2b3240}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"맑은 고딕","Malgun Gothic",sans-serif}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 16px;min-height:54px;background:#17365D;color:#fff}
.top b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top button{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;cursor:pointer}
.top #tg{display:none}
.ur-home-btn.inline{font-size:13.5px!important;padding:8px 14px!important}
.lay{display:grid;grid-template-columns:310px 1fr}
aside{position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:10px 6px 40px}
aside h2{font-size:13px;color:var(--gold);margin:6px 12px 8px;letter-spacing:.04em}
.toc,.toc ul{list-style:none;margin:0;padding:0}
.toc>li>a{display:flex;gap:8px;padding:7px 10px;border-radius:7px;font-size:14px;line-height:1.45;color:inherit;text-decoration:none}
.toc>li>a i{font-style:normal;flex:0 0 30px;color:var(--gold);font-weight:700;font-size:12.5px;padding-top:1px}
.toc>li>a:hover{background:rgba(183,121,31,.1)}
.toc>li.cur>a{background:var(--navy);color:#fff}.toc>li.cur>a i{color:#ffd98a}
html[data-dark="1"] .toc>li.cur>a{background:#24466b}
.toc ul{display:none;margin:2px 0 8px 40px;border-left:2px solid var(--line)}
.toc li.cur ul{display:block}
.toc ul a{display:block;padding:4px 10px;font-size:13px;color:var(--mute);text-decoration:none;line-height:1.45}
.toc ul a:hover{color:var(--gold)}
main{min-width:0;padding:26px 34px 80px}
article{max-width:820px;margin:0 auto}
.kick{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.06em}
h1{font-family:"Noto Serif KR",serif;font-size:clamp(25px,3.6vw,34px);color:var(--navy);margin:6px 0 22px;line-height:1.35}
h3{font-family:"Noto Serif KR",serif;font-size:21px;color:var(--navy);margin:34px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--line);scroll-margin-top:70px}
h4{font-size:16px;color:var(--gold);margin:22px 0 6px}
p{font-family:"Noto Serif KR",serif;font-size:var(--fs);line-height:1.95;margin:0 0 12px;word-break:keep-all;text-align:justify}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
.nav a{color:var(--navy);text-decoration:none;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;max-width:48%}
.empty{color:var(--mute);padding:40px;text-align:center}
@media (max-width:860px){
  .top #tg{display:inline-block}
  .lay{display:block}
  aside{display:none;position:static;height:auto;max-height:72vh;border-right:0;border-bottom:1px solid var(--line)}
  body.toc aside{display:block}
  main{padding:18px 16px 60px}
}
html.embed .top,html.embed aside{display:none!important}
html.embed .lay{display:block}
html.embed .nav{display:none}
html.embed main{padding:22px 26px 60px}
@media print{.top,aside,.nav{display:none!important}.lay{display:block}main{padding:0}body{background:#fff}}
</style>
<script>if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<script src="/bible/ubref.js" data-src="data/ub.js"></script>
<script src="/home-button.js" data-into=".top" defer></script>
</head>
<body>
<div class="top">
  <b>유란시아서 핵심</b>
  <span class="sp"></span>
  <button id="tg">☰ 목차</button>
  <button id="fm" title="글자 작게">가−</button><button id="fp" title="글자 크게">가+</button>
  <button id="dk" title="밤 모드">◐</button>
  <button id="pr" title="인쇄">🖨</button>
</div>
<div class="lay">
  <aside><h2>목차 · 유란시아서 핵심 52강</h2><ul class="toc" id="toc"></ul></aside>
  <main><article id="art"><div class="empty">불러오는 중…</div></article></main>
</div>
<script>
var P=new URLSearchParams(location.search), N=+(P.get('c')||0), T=[], V=Math.floor(Date.now()/36e5);
function pad(n){return (n<10?'0':'')+n;}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function load(src){var s=document.createElement('script');s.src=src+'?v='+V;document.head.appendChild(s);}
var FS=17.5;
try{ if(localStorage.getItem('c52dark')==='1') document.documentElement.dataset.dark='1'; FS=+(localStorage.getItem('c52fs')||17.5); }catch(e){}
document.documentElement.style.setProperty('--fs',FS+'px');
window.TOC=function(t){
  T=t; if(!T.some(function(x){return x[0]===N;})) N=T[0][0];
  toc.innerHTML=T.map(function(x){
    return '<li data-n="'+x[0]+'"><a href="?c='+x[0]+'"><i>'+x[0]+'장</i><span>'+esc(x[1])+'</span></a>'
      +(x[2].length?'<ul>'+x[2].map(function(h,k){return '<li><a href="?c='+x[0]+'#h'+(k+1)+'">'+esc(h)+'</a></li>';}).join('')+'</ul>':'')+'</li>';
  }).join('');
  open(N,false);
};
function open(n,push){
  N=n; [].forEach.call(toc.children,function(li){li.classList.toggle('cur',+li.dataset.n===n);});
  var c=toc.querySelector('li.cur'); if(c&&c.scrollIntoView) c.scrollIntoView({block:'nearest'});
  if(push) history.pushState({n:n},'','?c='+n);
  load('data/ch'+pad(n)+'.js');
}
window.CH=function(c){
  if(c.n!==N) return;
  document.title='제'+c.n+'장 '+c.title+' · 유란시아서 핵심';
  var h=0, html='<div class="kick">유란시아서 핵심 · 제 '+c.n+' 장</div><h1>'+esc(c.title)+'</h1>';
  c.b.forEach(function(b){
    if(b[0]==='h'){h++; html+='<h3 id="h'+h+'">'+esc(b[1])+'</h3>';}
    else if(b[0]==='s') html+='<h4>'+esc(b[1])+'</h4>';
    else html+='<p>'+UBLINK(esc(b[1]))+'</p>';
  });
  var i=T.findIndex(function(x){return x[0]===c.n;}), pv=T[i-1], nx=T[i+1];
  html+='<div class="nav">'+(pv?'<a href="?c='+pv[0]+'">← 제'+pv[0]+'장 '+esc(pv[1])+'</a>':'<span></span>')
       +(nx?'<a href="?c='+nx[0]+'">제'+nx[0]+'장 '+esc(nx[1])+' →</a>':'')+'</div>';
  art.innerHTML=html;
  if(location.hash){var el=document.querySelector(location.hash); if(el){el.scrollIntoView(); return;}}
  window.scrollTo(0,0);
};
toc.addEventListener('click',function(e){
  var a=e.target.closest('a'); if(!a) return;
  var m=a.getAttribute('href').match(/c=(\d+)(#.*)?/); if(!m) return;
  e.preventDefault(); document.body.classList.remove('toc');
  var n=+m[1];
  if(n===N && m[2]){ history.replaceState({n:n},'','?c='+n+m[2]); var el=document.querySelector(m[2]); if(el) el.scrollIntoView({behavior:'smooth'}); return; }
  history.pushState({n:n},'','?c='+n+(m[2]||'')); open(n,false);
});
art.addEventListener('click',function(e){var a=e.target.closest('.nav a'); if(!a) return; e.preventDefault(); history.pushState(null,'',a.getAttribute('href')); open(+a.getAttribute('href').slice(3),false);});
window.addEventListener('popstate',function(){N=+(new URLSearchParams(location.search).get('c')||T[0][0]); open(N,false);});
tg.onclick=function(){document.body.classList.toggle('toc');};
function setFs(d){FS=Math.min(24,Math.max(14,FS+d)); document.documentElement.style.setProperty('--fs',FS+'px'); try{localStorage.setItem('c52fs',FS);}catch(e){}}
fm.onclick=function(){setFs(-1);}; fp.onclick=function(){setFs(1);};
dk.onclick=function(){var r=document.documentElement; if(r.dataset.dark==='1') delete r.dataset.dark; else r.dataset.dark='1'; try{localStorage.setItem('c52dark',r.dataset.dark?'1':'0');}catch(e){}};
pr.onclick=function(){window.print();};
load('data/toc.js');
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유란시아서 핵심 52강 · PPT 슬라이드</title>
<script>if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<style>
:root{--bg:#0f1726;--panel:#172238;--ink:#e9edf4;--mute:#9aa7bd;--gold:#e0b45a;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"맑은 고딕","Malgun Gothic",sans-serif}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:9px 16px;min-height:54px;background:#0b1220;border-bottom:1px solid var(--line)}
.top b{font-size:16px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top #tg{display:none}
.ur-home-btn.inline{font-size:13.5px!important;padding:8px 14px!important}
.btn{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.on{background:var(--gold);color:#1b1404;border-color:var(--gold)}
.lay{display:grid;grid-template-columns:290px 1fr}
aside{position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto;background:#121c2e;border-right:1px solid var(--line);padding:10px 6px 40px}
aside h2{font-size:13px;color:var(--gold);margin:6px 12px 8px}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:8px;padding:8px 10px;border-radius:7px;font-size:14px;line-height:1.45;color:var(--ink);text-decoration:none}
.toc a i{font-style:normal;flex:0 0 38px;color:var(--gold);font-size:12.5px;font-weight:700;padding-top:1px}
.toc a small{color:var(--mute);margin-left:auto;padding-left:6px;white-space:nowrap}
.toc a:hover{background:rgba(255,255,255,.06)}
.toc li.cur a{background:var(--gold);color:#1b1404}.toc li.cur a i,.toc li.cur a small{color:#1b1404}
main{min-width:0;padding:16px 22px 50px}
.ttl{font-size:clamp(19px,3vw,25px);margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.sub a{color:var(--gold)}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4);aspect-ratio:16/9;user-select:none;max-width:1100px}
.stage img{display:block;width:100%;height:100%;object-fit:contain}
.nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent;cursor:pointer;color:#fff;font-size:42px;opacity:0;transition:opacity .2s}
.nav:hover,.nav:focus-visible{opacity:.85;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.nav.r{right:0}.nav.r:hover,.nav.r:focus-visible{background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.nav.l{left:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;max-width:1100px}
.bar .cnt{font-weight:700;min-width:70px}
.bar .st{flex:1;min-width:180px;color:var(--mute);font-size:14px}
.notes{display:none;max-width:1100px;background:#fbf8f0;color:#24262b;border-radius:12px;padding:18px 22px;font-family:"Noto Serif KR",serif;font-size:17px;line-height:1.95;white-space:pre-wrap;word-break:keep-all}
.notes.on{display:block}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:14px;max-width:1100px}
.strip button{all:unset;cursor:pointer;border-radius:6px;overflow:hidden;border:2px solid transparent;position:relative;aspect-ratio:16/9;background:#000}
.strip button img{width:100%;height:100%;object-fit:cover;display:block}
.strip button i{position:absolute;left:4px;top:3px;font-style:normal;font-size:11px;background:rgba(0,0,0,.6);padding:0 5px;border-radius:4px}
.strip button.cur{border-color:var(--gold)}
.stage:fullscreen{border-radius:0;aspect-ratio:auto;max-width:none}
html.embed .top,html.embed aside{display:none!important}
html.embed .lay{display:block}
@media (max-width:860px){
  .top #tg{display:inline-block}
  .lay{display:block}
  aside{display:none;position:static;height:auto;max-height:70vh;border-right:0;border-bottom:1px solid var(--line)}
  body.toc aside{display:block}
  main{padding:14px 12px 40px}
}
</style>
<script src="/home-button.js" data-into=".top" defer></script>
</head>
<body>
<div class="top">
  <b>유란시아서 핵심 52강 · PPT 슬라이드</b>
  <span class="sp"></span>
  <button class="btn" id="tg">☰ 목차</button>
</div>
<div class="lay">
  <aside><h2>강 목록</h2><ul class="toc" id="toc"></ul></aside>
  <main>
    <h2 class="ttl" id="ttl"></h2>
    <p class="sub" id="sub"></p>
    <div class="stage" id="stage">
      <img id="img" alt="">
      <button class="nav l" id="prev" aria-label="이전 슬라이드">‹</button>
      <button class="nav r" id="next" aria-label="다음 슬라이드">›</button>
    </div>
    <div class="bar">
      <button class="btn" id="b1" aria-label="처음">⏮</button>
      <button class="btn" id="b2" aria-label="이전">◀</button>
      <span class="cnt" id="cnt"></span>
      <button class="btn" id="b3" aria-label="다음">▶</button>
      <span class="st" id="st"></span>
      <button class="btn" id="nt">📝 강의 원고</button>
      <button class="btn" id="fs">⛶ 전체 화면</button>
    </div>
    <div class="notes" id="notes"></div>
    <div class="strip" id="strip"></div>
  </main>
</div>
<script>
var P=new URLSearchParams(location.search), N=+(P.get('n')||0), L=null, I=0, TOCD=[], V=Math.floor(Date.now()/36e5);
var EMB=document.documentElement.classList.contains('embed');
function pad(n){return (n<10?'0':'')+n;}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function load(src){var s=document.createElement('script');s.src=src+'?v='+V;document.head.appendChild(s);}
window.TOC=function(t){
  TOCD=t.filter(function(x){return x[2]>0;});
  if(!TOCD.some(function(x){return x[0]===N;})) N=TOCD[0][0];
  toc.innerHTML=TOCD.map(function(x){return '<li data-n="'+x[0]+'"><a href="?n='+x[0]+'"><i>제'+x[0]+'강</i><span>'+esc(x[1])+'</span><small>'+x[2]+'장</small></a></li>';}).join('');
  pick(N);
};
function pick(n){
  N=n; [].forEach.call(toc.children,function(li){li.classList.toggle('cur',+li.dataset.n===n);});
  load('../data/'+pad(n)+'.js');
}
toc.addEventListener('click',function(e){var a=e.target.closest('a'); if(!a) return; e.preventDefault(); document.body.classList.remove('toc'); location.hash=''; pick(+a.getAttribute('href').slice(3)); window.scrollTo(0,0);});
window.LECTURE=function(d){
  if(d.n!==N) return;
  L=d; document.title='제'+d.n+'강 '+d.title+' · 슬라이드';
  ttl.textContent='제'+d.n+'강 '+d.title;
  var links=[], tgt=EMB?' target="_blank" rel="noopener"':'';
  if(d.interactive) links.push('<a href="'+d.interactive+'"'+tgt+'>🧭 인터렉티브 스터디</a>');
  if(d.audiobook) links.push('<a href="'+d.audiobook+'"'+tgt+'>🎧 오디오북</a>');
  sub.innerHTML='슬라이드 '+d.slides.length+'장'+(links.length?' · '+links.join(' · '):'');
  strip.innerHTML=d.slides.map(function(s,k){return '<button data-k="'+k+'" title="'+esc(s.t)+'"><img loading="lazy" src="'+pad(d.n)+'/'+pad(k+1)+'.jpg" alt=""><i>'+(k+1)+'</i></button>';}).join('');
  var h=+(location.hash.replace('#','')||1); go(Math.min(Math.max(h-1,0),d.slides.length-1));
};
function go(k){
  if(!L) return; I=(k+L.slides.length)%L.slides.length;
  img.src=pad(L.n)+'/'+pad(I+1)+'.jpg'; img.alt=L.slides[I].t||('슬라이드 '+(I+1));
  cnt.textContent=(I+1)+' / '+L.slides.length;
  st.textContent=L.slides[I].t||'';
  notes.textContent=L.slides[I].x||'(이 슬라이드에는 원고가 없습니다)';
  [].forEach.call(strip.children,function(b,j){b.classList.toggle('cur',j===I);});
  history.replaceState(null,'','?n='+L.n+(EMB?'&embed=1':'')+'#'+(I+1));
  var nx=new Image(); nx.src=pad(L.n)+'/'+pad((I+1)%L.slides.length+1)+'.jpg';
}
prev.onclick=b2.onclick=function(){go(I-1);};
next.onclick=b3.onclick=function(){go(I+1);};
b1.onclick=function(){go(0);};
strip.onclick=function(e){var b=e.target.closest('button[data-k]'); if(b){go(+b.dataset.k); stage.scrollIntoView({behavior:'smooth',block:'center'});}};
nt.onclick=function(){notes.classList.toggle('on'); nt.classList.toggle('on');};
fs.onclick=function(){ if(document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen&&stage.requestFullscreen(); };
tg.onclick=function(){document.body.classList.toggle('toc');};
document.addEventListener('keydown',function(e){
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(I+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(I-1);}
  else if(e.key==='Home') go(0);
});
var tx=null; stage.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
stage.addEventListener('touchend',function(e){ if(tx===null) return; var dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) go(I+(dx<0?1:-1)); tx=null; });
load('../data/toc.js');
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유란시아서 중요 목록 376</title>
<meta name="description" content="유란시아서 본문 안의 번호 목록 376개를 표와 해설로 정리했습니다. 왼쪽에서 목록을 누르면 바로 보입니다.">
<style>
:root{--navy:#17365D;--gold:#B7791F;--cream:#FAF8F3;--line:#E4DCCB;--ink:#2b2b2b;--dim:#7a7266}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);
 font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
 display:flex;flex-direction:column;overflow:hidden}
a{text-decoration:none;color:inherit}
header{background:linear-gradient(120deg,#0f2440,#17365D 60%,#1c4468);color:#fff;padding:11px 16px;
 display:flex;align-items:center;flex:none}
header h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em}
header .sub{font-size:11.5px;color:#c9dcef;margin-left:10px}
#burger{display:none;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;
 font-size:13px;padding:4px 9px;margin-right:10px;cursor:pointer}
main{flex:1;display:flex;min-height:0;position:relative}
nav{width:320px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.srch{padding:9px 10px;border-bottom:1px solid var(--line);flex:none}
#q{width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:16px;font-size:13px;outline:none}
#q:focus{border-color:var(--gold)}
.cnt{font-size:11px;color:var(--dim);margin:6px 4px 0}
.list{overflow-y:auto;padding:6px 0 24px;flex:1}
.grp h3{margin:12px 10px 5px;font-size:11.5px;color:var(--c);font-weight:700;border-left:4px solid var(--c);padding-left:7px}
.it{display:flex;padding:5px 10px 5px 12px;font-size:12.6px;line-height:1.45;align-items:baseline;cursor:pointer}
.it b{color:var(--c);min-width:30px;text-align:right;margin-right:8px;font-size:11.5px;flex:none}
.it span{color:#3d3d3d}
.it:hover{background:#f6f1e6}
.it.on{background:#eef3fa}.it.on span{color:var(--navy);font-weight:700}
.view{flex:1;min-width:0;overflow-y:auto}
article{max-width:820px;margin:0 auto;padding:30px 28px 70px}
.no{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--c,var(--gold))}
article h2{margin:6px 0 4px;font-size:24px;line-height:1.45;color:var(--navy);word-break:keep-all}
.ref{font-size:13px;color:var(--dim)}
.rule{height:2px;margin:14px 0 20px;background:linear-gradient(90deg,var(--gold),rgba(183,121,31,0))}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6}
th{background:var(--navy);color:#fff;font-size:13.5px;font-weight:700;text-align:left;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;word-break:keep-all}
tr:nth-child(even) td{background:#fbf8f1}
td.k{width:2.6em;text-align:center;color:var(--gold);font-weight:700;padding-right:4px}
td.nm{font-weight:700;color:#24324a}
.src{margin:8px 2px 0;text-align:right;font-size:12.5px;color:var(--dim)}
.desc{margin-top:22px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:16px 18px}
.desc h4{margin:0 0 6px;font-size:13px;color:var(--gold);letter-spacing:.1em}
.desc p{margin:0;font-size:16px;line-height:1.95;text-align:justify;word-break:keep-all}
.pn{display:flex;gap:10px;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.pn a{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--dim);line-height:1.45}
.pn a b{display:block;color:var(--navy);font-size:13.5px;margin-top:2px}
.pn a.nx{text-align:right}.pn a:hover{border-color:var(--gold)}.pn .gap{flex:1}
.msg{color:var(--dim);text-align:center;padding:60px 0}
@media (max-width:760px){
 #burger{display:block}
 nav{position:absolute;z-index:9;top:0;bottom:0;left:0;width:85%;max-width:340px;
  box-shadow:2px 0 14px rgba(0,0,0,.25);transform:translateX(-102%);transition:transform .2s}
 nav.open{transform:translateX(0)}
 header .sub{display:none}
 article{padding:22px 16px 60px}article h2{font-size:20px}
 table{font-size:14px}th,td{padding:8px 9px}.desc p{font-size:15.5px;text-align:left}
}
@media print{header,nav,.pn{display:none!important}body{overflow:visible;display:block}.view{overflow:visible}}
</style>
<script src="/home-button.js" data-top="40" defer></script>
</head>
<body>
<header>
 <button id="burger">☰ 목록</button>
 <h1>유란시아서 중요 목록 376</h1>
 <span class="sub">본문 안의 번호 목록을 표와 해설로 — 왼쪽에서 목록을 누르십시오</span>
</header>
<main>
 <nav id="nav">
  <div class="srch"><input id="q" type="search" placeholder="번호·제목·내용으로 찾기 (예: 일곱, 조절자)" autocomplete="off"><div class="cnt" id="cnt"></div></div>
  <div class="list" id="list"></div>
 </nav>
 <div class="view" id="view"><article id="art"><p class="msg">불러오는 중…</p></article></div>
</main>
<script>
// 목록 376개(data.json)를 부별로 왼쪽에 늘어놓고, 누르면 오른쪽에 표·출처·해설을 보여 준다
var PARTS = { 1: ['제1부  중앙 우주와 초우주', '#17365D'], 2: ['제2부  지역 우주', '#1F6D73'],
              3: ['제3부  유란시아의 역사', '#B7791F'], 4: ['제4부  예수의 생애와 가르침', '#9E3D35'] };
var list = document.getElementById('list'), art = document.getElementById('art'), view = document.getElementById('view'),
    q = document.getElementById('q'), cnt = document.getElementById('cnt'), nav = document.getElementById('nav'),
    D = [], BY = {}, items = [], grps = [];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function build() {
  var html = '', cur = 0;
  D.forEach(function (e) {
    if (e.part !== cur) { if (cur) html += '</div>'; cur = e.part; html += '<div class="grp" style="--c:' + PARTS[cur][1] + '"><h3>' + PARTS[cur][0] + '</h3>'; }
    html += '<a class="it" href="#' + e.n + '" data-n="' + e.n + '"><b>' + e.n + '</b><span>' + esc(e.t) + '</span></a>';
  });
  list.innerHTML = html + '</div>';
  items = [].slice.call(list.querySelectorAll('.it')); grps = [].slice.call(list.querySelectorAll('.grp'));
  cnt.textContent = '모두 ' + D.length + '개';
}
function show(n, keepNav) {
  var e = BY[n]; if (!e) return;
  items.forEach(function (i) { i.classList.toggle('on', +i.dataset.n === n); });
  var k = D.indexOf(e), pv = D[k - 1], nx = D[k + 1], c = PARTS[e.part][1];
  var numbered = e.cols[0] === '';
  var head = e.cols.map(function (h, i) { return '<th' + (i === 0 && numbered ? ' style="width:2.6em"' : '') + '>' + esc(h) + '</th>'; }).join('');
  var body = e.rows.map(function (r) {
    return '<tr>' + r.map(function (v, i) {
      var cls = numbered ? (i === 0 ? 'k' : i === 1 && r.length > 2 ? 'nm' : '') : (i === 0 && r.length > 1 ? 'nm' : '');
      return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(v) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  art.innerHTML = '<div class="no" style="--c:' + c + '">목록 ' + e.n + ' · ' + PARTS[e.part][0].replace(/\s+/g, ' ') + '</div>' +
    '<h2>' + esc(e.t) + '</h2><div class="ref">유란시아서 ' + esc(e.ref) + '</div><div class="rule"></div>' +
    '<div class="tw"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<p class="src">— 유란시아서 ' + esc(e.ref) + '</p>' +
    '<div class="desc"><h4>해설</h4><p>' + esc(e.d) + '</p></div>' +
    '<div class="pn">' + (pv ? '<a href="#' + pv.n + '" data-go="' + pv.n + '">← 이전 · 목록 ' + pv.n + '<b>' + esc(pv.t) + '</b></a>' : '<span class="gap"></span>') +
    (nx ? '<a class="nx" href="#' + nx.n + '" data-go="' + nx.n + '">목록 ' + nx.n + ' · 다음 →<b>' + esc(nx.t) + '</b></a>' : '<span class="gap"></span>') + '</div>';
  view.scrollTop = 0;
  var on = items.filter(function (i) { return +i.dataset.n === n; })[0];
  if (on && !keepNav) on.scrollIntoView({ block: 'nearest' });
  history.replaceState(null, '', '#' + n);
  if (window.innerWidth <= 760) nav.classList.remove('open');
}
list.addEventListener('click', function (ev) { var a = ev.target.closest('.it'); if (a) { ev.preventDefault(); show(+a.dataset.n); } });
art.addEventListener('click', function (ev) { var a = ev.target.closest('a[data-go]'); if (a) { ev.preventDefault(); show(+a.dataset.go); } });
q.addEventListener('input', function () {
  var v = q.value.trim().toLowerCase(), shown = 0;
  items.forEach(function (i) {
    var e = BY[+i.dataset.n];
    var hit = !v || String(e.n) === v || (e.t + ' ' + e.rows.join(' ') + ' ' + e.ref).toLowerCase().indexOf(v) > -1;
    i.style.display = hit ? '' : 'none'; if (hit) shown++;
  });
  grps.forEach(function (g) { g.style.display = [].some.call(g.querySelectorAll('.it'), function (i) { return i.style.display !== 'none'; }) ? '' : 'none'; });
  cnt.textContent = v ? '찾은 목록 ' + shown + '개' : '모두 ' + D.length + '개';
  var on = list.querySelector('.it.on'); if (!v && on) on.scrollIntoView({ block: 'center' });
});
document.getElementById('burger').addEventListener('click', function () { nav.classList.toggle('open'); });
fetch('data.json').then(function (r) { return r.json(); }).then(function (d) {
  D = d; d.forEach(function (e) { BY[e.n] = e; }); build();
  var h = parseInt((location.hash || '').replace(/\D/g, ''), 10);
  show(BY[h] ? h : 1, !BY[h]);
}).catch(function () { art.innerHTML = '<p class="msg">목록을 불러오지 못했습니다. 잠시 뒤에 다시 열어 주십시오.</p>'; });
</script>
</body>
</html>

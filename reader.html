<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유란시아서 디지털 리더</title>
<style>
:root{--navy:#17365D;--gold:#B7791F;--teal:#1F6D73;--ink:#20242e;--dim:#6b6f7d;
      --line:#e2ddd0;--cream:#faf8f3;--paper:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
     background:var(--cream);color:var(--ink);font-size:14px;line-height:1.55;
     display:flex;flex-direction:column}

header{background:linear-gradient(155deg,#0c1428,#16294a 58%,#203860);
       color:#f4f1e8;padding:14px 16px 12px;flex:0 0 auto;
       box-shadow:inset 0 -3px 0 var(--gold)}
header .in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;
           gap:8px;align-items:center}
header .crumb{font-size:12px;color:#b7c4dd;flex:1 1 100%;margin-bottom:2px}
header .crumb a{color:#dfe6f3;text-decoration:underline;text-underline-offset:2px}
header .crumb a:hover{color:#f6e6bf}
header h1{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0;
          letter-spacing:-.01em}
header .btn{font-size:12px;color:#e9edf6;border:1px solid rgba(232,196,121,.5);
            background:rgba(255,255,255,.06);padding:7px 12px;border-radius:8px;
            text-decoration:none;white-space:nowrap}
header .btn:hover{background:rgba(232,196,121,.18);border-color:#e8c479;color:#fff}

.note{background:#fff7e6;border-bottom:1px solid #e4c77a;color:#7a5b17;
      font-size:11.5px;padding:6px 16px;text-align:center;flex:0 0 auto}

.stage{flex:1 1 auto;position:relative;min-height:0;background:var(--paper)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.fallback{position:absolute;inset:0;display:none;flex-direction:column;
          align-items:center;justify-content:center;gap:12px;text-align:center;
          padding:24px;background:var(--paper)}
.fallback.on{display:flex}
.fallback p{margin:0;color:var(--dim);font-size:13px;line-height:1.8}
.fallback a{display:inline-block;background:var(--navy);color:#fff;
            padding:11px 22px;border-radius:9px;text-decoration:none;font-size:13.5px}
.fallback a:hover{background:var(--gold)}

@media(max-width:640px){
  header h1{font-size:16px;flex:1 1 100%}
  header .btn{font-size:11.5px;padding:6px 10px}
}
</style>
</head>
<body>

<header>
  <div class="in">
    <div class="crumb"><a href="index.html">홈</a> › <b>유란시아서 디지털 리더</b></div>
    <h1>유란시아서 디지털 리더</h1>
    <a class="btn" id="openNew" href="/reader/"
       target="_blank" rel="noopener">새 창에서 열기 ↗</a>
    <a class="btn" href="index.html">포털 첫 화면</a>
  </div>
</header>

<div class="note">
  형광펜·메모·읽은 날짜는 이 브라우저 안에 저장됩니다. 지우기 전에 [💾 이 파일 저장]으로 한 번씩 갈무리해 두시면 안전합니다.
</div>

<div class="stage">
  <iframe id="rd" src="/reader/"
          title="유란시아서 디지털 리더"
          allow="clipboard-write; clipboard-read; fullscreen"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div class="fallback" id="fb">
    <p>리더를 이 화면 안에서 불러오지 못했습니다.<br>
       아래 단추를 누르면 새 창에서 정상으로 열립니다.</p>
    <a href="/reader/"
       target="_blank" rel="noopener">유란시아서 디지털 리더 열기 ↗</a>
  </div>
</div>

<script>
(function(){
  var f=document.getElementById('rd'), fb=document.getElementById('fb'), ok=false;
  f.addEventListener('load', function(){ ok=true; });
  setTimeout(function(){ if(!ok) fb.className='fallback on'; }, 8000);
})();
</script>
</body>
</html>

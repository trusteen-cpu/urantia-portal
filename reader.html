<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유란시아서 디지털 리더</title>
<style>
:root{--gold:#B7791F;--ink:#20242e;--dim:#6b6f7d;--paper:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
     background:#faf8f3;color:var(--ink);font-size:14px;
     display:flex;flex-direction:column}
header{background:linear-gradient(155deg,#0c1428,#16294a 58%,#203860);
       color:#f4f1e8;padding:12px 16px 10px;flex:0 0 auto;
       box-shadow:inset 0 -3px 0 var(--gold)}
header .in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;
           gap:8px;align-items:center}
header h1{margin:0;font-size:18px;font-weight:800;flex:1;min-width:0}
header .btn{font-size:12px;color:#e9edf6;border:1px solid rgba(232,196,121,.5);
            background:rgba(255,255,255,.06);padding:7px 12px;border-radius:8px;
            text-decoration:none;white-space:nowrap}
header .btn:hover{background:rgba(232,196,121,.18);border-color:#e8c479;color:#fff}
.stage{flex:1 1 auto;position:relative;min-height:0;background:var(--paper)}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:14px;text-align:center;
         padding:24px;background:var(--paper);color:var(--dim);font-size:13px}
.loading a{color:var(--gold);font-weight:700;text-decoration:none}
.kakao-banner{background:#8b6914;color:#fff;padding:12px 16px;font-size:13px;
              text-align:center;line-height:1.5}
.kakao-banner b{white-space:nowrap}
@media(max-width:640px){ header h1{font-size:16px;flex:1 1 100%} }
</style>
</head>
<body>

<header>
  <div class="in">
    <h1>유란시아서 디지털 리더</h1>
    <a class="btn" href="/reader/index.html">새 창에서 열기 ↗</a>
    <a class="btn" href="index.html">포털 첫 화면</a>
  </div>
</header>

<div id="kakaoBanner"></div>

<div class="stage">
  <div class="loading" id="ld">
    <div>리더로 이동하는 중입니다…</div>
    <div>자동으로 넘어가지 않으면 <a href="/reader/index.html">여기를 눌러주세요</a>.</div>
  </div>
</div>

<script>
// 예전에는 이 페이지 안에서 리더 전체를 iframe으로 불러왔지만,
// 리더 파일 용량이 커서(6MB+) 카카오톡 인앱 브라우저 등 일부 환경에서
// iframe 로드가 멈추거나("불러오는 중" 무한 대기) 다운로드로 잘못 처리되는
// 문제가 있어, 이제는 리더 페이지로 직접(최상위 창으로) 이동시킵니다.
(function () {
  var ua = navigator.userAgent || '';
  var isKakao = /KAKAOTALK/i.test(ua);

  if (isKakao) {
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    if (isAndroid) {
      // 안드로이드: 카카오톡 인앱 브라우저를 벗어나 외부 브라우저(크롬)로 강제 실행
      var target = location.href.replace(/^https?:\/\//, '');
      location.href = 'intent://' + target + '#Intent;scheme=https;package=com.android.chrome;end';
      return; // 외부 브라우저가 열리면 이 페이지는 더 진행하지 않음
    } else if (isIOS) {
      // iOS는 앱에서 강제로 외부 브라우저를 열 수 없어 안내 배너만 표시하고 계속 진행
      document.getElementById('kakaoBanner').innerHTML =
        '<div class="kakao-banner">카카오톡 브라우저에서는 리더가 느리거나 멈출 수 있습니다.<br>' +
        '오른쪽 아래 <b>공유(⬆)</b> 버튼을 눌러 <b>"Safari로 열기"</b>를 선택해 주세요.</div>';
    }
  }

  // 최상위 창으로 실제 리더 페이지로 이동 (iframe 대신)
  location.replace('/reader/index.html');
})();
</script>

<noscript>
  <p style="padding:20px">자바스크립트가 꺼져 있습니다.
    <a href="/reader/index.html">여기를 눌러 리더를 열어주세요</a>.</p>
</noscript>

</body>
</html>

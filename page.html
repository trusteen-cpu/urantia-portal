<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>글</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero sub" id="hero">
  <canvas id="stars"></canvas>
  <div class="glow"></div>
  <div class="inner">
    <nav class="crumb" id="crumb"></nav>
    <div class="bigico" id="bigico"></div>
    <h1 id="hTitle"></h1>
    <div class="sub" id="hSub"></div>
    <div class="rule"></div>
  </div>
</header>

<div class="searchbar">
  <div class="wrap row">
    <span class="pagenote" id="note"></span>
    <a class="home" href="index.html">← 첫 화면</a>
  </div>
</div>

<main class="wrap">
  <article class="article" id="body"></article>
  <div class="backrow" id="backrow"></div>
</main>

<footer><a href="index.html">첫 화면으로 돌아가기</a></footer>
<a href="#" class="totop" id="totop" title="맨 위로">▲</a>

<script src="app.js"></script>
<script>
(function(){
  const c=document.getElementById('stars'), x=c.getContext('2d');
  function draw(){const w=c.width=c.offsetWidth,h=c.height=c.offsetHeight;x.clearRect(0,0,w,h);
    for(let i=0;i<80;i++){const px=Math.random()*w,py=Math.random()*h*.95,r=Math.random()*1.2+.25,
      a=(1-py/h)*(Math.random()*.6+.15);x.fillStyle='rgba(255,253,244,'+a.toFixed(2)+')';
      x.beginPath();x.arc(px,py,r,0,6.284);x.fill();}}
  draw();window.addEventListener('resize',draw);
})();

const P=new URLSearchParams(location.search);
const GID=P.get('g')||'', I=P.get('i'), K=P.get('k'), J=P.get('j');

loadData().then(D=>{
  const G=(D.groups||[]).find(g=>g.id===GID);
  if(!G||I===null){ body.innerHTML='<p class="empty">글을 찾을 수 없습니다.</p>'; return; }
  const COLOR=colorOf(G);
  document.getElementById('hero').style.setProperty('--gc',COLOR);

  const it=G.items[+I]; if(!it){ body.innerHTML='<p class="empty">글을 찾을 수 없습니다.</p>'; return; }
  let node=it, crumbs='<a href="index.html">홈</a> › <a href="'+href(G.id)+'">'+esc(G.title)+'</a>';
  let back=href(G.id), backName=G.title;

  if(K!==null && (it.children||[])[+K]){
    crumbs+=' › <a href="'+href(G.id,+I)+'">'+esc(it.name)+'</a>';
    node=it.children[+K]; back=href(G.id,+I); backName=it.name;
    if(J!==null && (node.children||[])[+J]){
      crumbs+=' › <a href="'+href(G.id,+I,+K)+'">'+esc(node.name)+'</a>';
      back=href(G.id,+I,+K); backName=node.name;
      node=node.children[+J];
    }
  }
  crumbs+=' › <b>'+esc(node.name)+'</b>';

  document.title=node.name;
  crumb.innerHTML=crumbs;
  bigico.textContent=G.icon||'📄';
  hTitle.textContent=node.name;
  hSub.textContent=G.title;

  /* 대표 사진 → 글 → 사진첩 → 첨부 파일 순서로 그린다 */
  let html='';
  if(node.image) html+='<figure class="lead"><img src="'+esc(node.image)+'" alt=""></figure>';

  const txt=(node.text||'').trim();
  if(txt) html+=mdToHtml(txt);

  const gal=(node.gallery||[]).filter(x=>x&&(x.image||x));
  if(gal.length){
    html+='<div class="figs">';
    gal.forEach(x=>{
      const src=x.image||x, cap=x.caption||'';
      html+='<figure><a href="'+esc(src)+'" target="_blank" rel="noopener">'
          + '<img src="'+esc(src)+'" alt="'+esc(cap)+'" loading="lazy"></a>'
          + (cap?'<figcaption>'+esc(cap)+'</figcaption>':'')+'</figure>';
    });
    html+='</div>';
  }

  const fl=(node.files||[]).filter(x=>x&&x.file);
  if(fl.length){
    html+='<div class="filebox"><b>첨부 파일</b><div class="filelist">';
    fl.forEach(x=>{
      const nm=x.name||x.file.split('/').pop();
      html+='<a class="fileitem" href="'+esc(x.file)+'" download target="_blank" rel="noopener">'
          + '<span class="fi">'+icoOf(x.file)+'</span><span class="fn">'+esc(nm)+'</span>'
          + '<span class="fd">내려받기</span></a>';
    });
    html+='</div></div>';
  }

  body.innerHTML = html || '<p class="empty">아직 내용이 없습니다.</p>';

  /* 글 아래에 원문 링크가 따로 있으면 단추로 */
  let extra='';
  if(node.url) extra='<a class="back go" href="'+esc(node.url)+'" target="_blank" rel="noopener">원문 보러 가기 ↗</a>';
  backrow.innerHTML = extra
    + '<a class="back" href="'+back+'">← '+esc(backName)+' 목록으로</a>'
    + '<a class="back" href="index.html">← 첫 화면</a>';
}).catch(()=>{ body.innerHTML='<p class="empty">links.json 을 읽지 못했습니다.</p>'; });

function icoOf(p){
  const e=(p||'').split('.').pop().toLowerCase();
  if(['pdf'].includes(e)) return '📕';
  if(['doc','docx','hwp','hwpx','txt','rtf'].includes(e)) return '📄';
  if(['xls','xlsx','csv'].includes(e)) return '📊';
  if(['ppt','pptx'].includes(e)) return '📽️';
  if(['mp3','wav','m4a','ogg'].includes(e)) return '🎵';
  if(['mp4','mov','avi','mkv'].includes(e)) return '🎬';
  if(['zip','7z','rar'].includes(e)) return '🗜️';
  if(['jpg','jpeg','png','gif','webp','svg'].includes(e)) return '🖼️';
  return '📎';
}

window.addEventListener('scroll',()=>{
  document.getElementById('totop').classList.toggle('on', window.scrollY>500);
});
</script>
</body>
</html>

<header><div class='in'><div class='crumb'><a href='/'>홈</a> › <a href='./'>주제별 유란시아서 인용</a> › 죽음과 생존</div><h1>인격의 소멸</h1><div class='meta'>5-3 · 인용 1곳 · 4차 교정본</div></div></header><main><blockquote><p>이와 같이 행성 시대의 잠자는 생존자들은 섭리 시대 소집 시 재인격화된다. 그러나 특정 영역의 구원 불가능한 인격과 관련하여, 운명의 집단 수호자들과 함께 봉사할 불멸 영이 부재하며, 이는 창조체 실존의 소멸을 이룬다. 너희 기록 중 일부는 이 사건들이 필사자 죽음의 행성에서 발생한다고 기술했지만, 실제로는 모두 맨션 세계들에서 발생한다.</p><cite>49:6.7</cite></blockquote><div class='nav'><a href='28.html'>← 인격의 생존</a><a href='./'>목록</a><a href='30.html'>사후 상승의 길 →</a></div></main>

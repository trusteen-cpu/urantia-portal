<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 묵상 · 2026-07-05 · 그 안에서 살고 움직이며</title>
<style>
  :root{
    --navy:#1E2761;
    --navy-dark:#12173F;
    --gold:#C9A85C;
    --gold-light:#E7D096;
    --white:#FFFFFF;
    --muted:#B9C3E1;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--navy-dark);
    font-family:'Nanum Myeongjo','Batang','Georgia',serif;
    color:var(--white);
  }
  #app{
    max-width:720px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding-bottom:120px;
  }
  header{
    text-align:center;
    padding:36px 24px 20px 24px;
    background:linear-gradient(180deg, var(--navy), var(--navy-dark));
  }
  header .date{
    color:var(--gold); font-size:13px; letter-spacing:0.15em;
    font-family:'Calibri','Arial',sans-serif;
  }
  header h1{
    font-size:26px; font-weight:normal; margin:10px 0 6px 0;
    color:var(--white);
  }
  header .ref{
    font-size:13px; color:var(--muted);
    font-family:'Calibri','Arial',sans-serif;
  }
  .stage-label{
    text-align:center;
    font-family:'Calibri','Arial',sans-serif;
    font-size:12px; letter-spacing:0.2em;
    color:var(--gold);
    text-transform:uppercase;
    margin:28px 0 4px 0;
  }
  section{
    display:none;
    padding:8px 28px 24px 28px;
    animation:fadeIn 0.6s ease;
  }
  section.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .verse-block{
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .verse-block:last-child{ border-bottom:none; }
  .verse-ref{
    color:var(--gold);
    font-family:'Calibri','Arial',sans-serif;
    font-size:13px;
    margin-bottom:6px;
    letter-spacing:0.05em;
  }
  .verse-text{
    font-size:17px; line-height:1.9; color:var(--white);
  }
  .verse-block.reciting .verse-text{
    color:var(--gold-light);
  }

  .sermon-text, .prayer-text{
    font-size:17px; line-height:2.0; white-space:pre-line;
    color:var(--white);
  }
  .song-title{
    text-align:center; color:var(--gold);
    font-size:18px; margin-bottom:16px;
    font-family:'Calibri','Arial',sans-serif;
    letter-spacing:0.05em;
  }
  .song-lyrics{
    font-size:17px; line-height:2.0; white-space:pre-line;
    text-align:center; color:var(--gold-light);
  }

  #controls{
    position:fixed; left:0; right:0; bottom:0;
    max-width:720px; margin:0 auto;
    display:flex; align-items:center; gap:14px;
    padding:14px 24px;
    background:linear-gradient(to top, rgba(18,23,63,0.97), rgba(18,23,63,0.85));
    font-family:'Calibri','Arial',sans-serif;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  #playBtn{
    width:46px; height:46px; border-radius:50%;
    background:var(--gold); border:none; cursor:pointer;
    font-size:16px; color:var(--navy-dark); flex-shrink:0;
  }
  #progressWrap{
    flex:1; height:6px; background:rgba(255,255,255,0.2);
    border-radius:3px; position:relative; cursor:pointer;
  }
  #progressBar{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:var(--gold); border-radius:3px;
  }
  #stageCounter{
    font-size:12px; color:var(--muted); min-width:70px; text-align:right;
  }
  #startOverlay{
    position:fixed; inset:0; z-index:20;
    background:var(--navy-dark);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #startOverlay .date{ color:var(--gold); font-size:13px; letter-spacing:0.15em; font-family:'Calibri','Arial',sans-serif; }
  #startOverlay h1{ font-size:26px; font-weight:normal; margin:12px 0 6px 0; }
  #startOverlay .ref{ font-size:13px; color:var(--muted); margin-bottom:32px; font-family:'Calibri','Arial',sans-serif; }
  #startBtn{
    padding:14px 40px; font-size:16px; background:var(--gold);
    color:var(--navy-dark); border:none; border-radius:30px; cursor:pointer;
    font-family:'Calibri','Arial',sans-serif; font-weight:bold; letter-spacing:0.03em;
  }
  #replayWrap{
    display:none; text-align:center; padding:32px 24px 60px 24px;
  }
  #replayBtn{
    padding:12px 32px; font-size:14px; background:transparent;
    color:var(--gold); border:1px solid var(--gold); border-radius:24px; cursor:pointer;
    font-family:'Calibri','Arial',sans-serif;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <div class="date">2026-07-05</div>
  <h1>그 안에서 살고 움직이며</h1>
  <div class="ref">유란시아서 1:5.12–17 · 낭독 · 강론 · 노래 · 기도</div>
  <button id="startBtn">▶ 오늘의 묵상 시작</button>
</div>

<div id="app">
  <header>
    <div class="date">2026-07-05</div>
    <h1>그 안에서 살고 움직이며</h1>
    <div class="ref">유란시아서 1:5.12–17</div>
  </header>

  <div class="stage-label" id="stageLabel">낭독</div>

  <section id="stage-scripture">
    <div id="versesContainer"></div>
  </section>

  <section id="stage-sermon">
    <div class="sermon-text" id="sermonText"></div>
  </section>

  <section id="stage-song">
    <div class="song-title" id="songTitle"></div>
    <div class="song-lyrics" id="songLyrics"></div>
  </section>

  <section id="stage-prayer">
    <div class="prayer-text" id="prayerText"></div>
  </section>

  <div id="replayWrap">
    <button id="replayBtn">처음부터 다시 듣기</button>
  </div>
</div>

<div id="controls" style="display:none;">
  <button id="playBtn">❚❚</button>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="stageCounter">낭독 1/4</div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
const DATA = {"date": "2026-07-05", "title": "그 안에서 살고 움직이며", "reference": "유란시아서 1:5.12–17", "verses": [{"ref": "1:5.12", "text": "신을 깊이 사유할 때, 인격이라는 개념이 어떤 물질적 형체를 수반해야 한다는 생각은 버려야 한다. 물질적 육체는 인간이든 신이든 인격에 필수적인 것이 아니다. 이 오류는 인간 철학의 양극단에서 드러난다—유물론은 사람이 죽으면 육체를 잃기에 인격도 사라진다고 보고, 범신론은 하나님께 육체가 없으므로 인격도 없다고 주장한다. 인간을 초월한 진보적 인격 형태는 마음과 영의 결합 안에서 기능한다."}, {"ref": "1:5.13", "text": "인격은 단지 하나님의 여러 속성 중 하나가 아니다. 오히려 그것은 무한한 본성의 조율된 전체와, 완전한 표현의 보편성과, 영원 속에서 표현된 통합된 신의 의지 전체를 의미한다. 인격은 가장 높은 의미에서, 우주들의 우주에 대한 하나님의 계시이다."}, {"ref": "1:5.14", "text": "하나님은 영원하고, 절대적이며, 무한하신 존재로서 지식이 자라거나 지혜가 늘지 않으신다. 하나님은 유한한 인간들이 이해하는 방식대로 경험을 취득하지는 않지만, 자신의 영원한 인격 영역 안에서 지속적인 자기 실현의 확장을 즐기신다. 이러한 자기 실현은 진화 세계의 유한 존재들이 얻는 새로운 경험의 취득과 비교되거나 비유될 수 있다."}, {"ref": "1:5.15–16", "text": "만약 신이 불완전한 혼들이 높은 영적 세계로 상승하고자 노력할 때, 우주 아버지가 직접 참여하지 않으신다면, 무한한 신의 절대 완전성은 오히려 완전성의 무제한적 종결성의 무서운 한계를 겪게 될 것이다. 우주의 모든 영적 존재와 유한 인간의 이런 진보적 경험은, 아버지의 끝없이 확장되는 신 의식 안에서 하나의 신성한 자기 실현 순환이다."}, {"ref": "1:5.17", "text": "\"너희 모든 고통 가운데 그가 고통받으시며,\" \"너희의 모든 승리 안에서 너희와 함께 승리하신다\"는 말씀은 문자 그대로 참이다. 그의 전인격적 영은 너의 진정한 일부이다. 파라다이스 섬은 우주의 모든 물질적 변화에 반응한다. 영원 아들은 모든 영적 충동을 느끼며, 공동 행위자는 우주 마음의 모든 표현을 포괄하신다. 우주 아버지는 신성한 의식의 충만 속에서, 시공간 속의 전체 진화 창조에서 모든 실체와 존재, 인격의 확장된 마음들과 상승하는 영들의 진보적 노력 속에 담긴 모든 체험을 인식하신다. 그리고 \"그 안에 우리가 살고 움직이며 존재를 가지느니라\"는 말은 문자 그대로 사실이다."}], "sermon": "하나님을 생각할 때 우리는 은연중에 어떤 형체를 떠올립니다. 그러나 오늘 본문은 그 생각을 내려놓으라 말합니다. 인격은 육체에 있지 않습니다. 유물론은 육체가 사라지면 인격도 사라진다 하고, 범신론은 육체가 없으니 인격도 없다 합니다. 그러나 참된 인격은 마음과 영의 결합 안에서, 육체를 초월하여 기능합니다.\n\n인격은 하나님의 여러 속성 중 하나가 아닙니다. 그것은 하나님의 무한한 본성 전체가 조율되어, 완전하게, 영원히 표현된 것입니다. 인격은 우주들의 우주를 향한 하나님의 계시입니다. 하나님은 우리처럼 하루하루 배우며 자라지 않으십니다. 그러나 그분은 결코 정적이지 않으십니다. 그분은 영원 속에서 끊임없이 자기 자신을 실현해 가십니다.\n\n그리고 여기 가장 놀라운 진실이 있습니다. 우리 불완전한 영혼들이 힘겹게 위를 향해 오르려 애쓸 때, 우주 아버지께서는 결코 방관자로 계시지 않습니다. 그분은 참여하십니다. 우리의 상승, 우리의 씨름, 우리의 작은 진보 하나하나가 아버지의 끝없이 확장되는 신 의식 안에서 하나의 거룩한 순환이 됩니다.\n\n그러므로 \"너희 모든 고통 가운데 그가 고통받으시며, 너희의 모든 승리 안에서 너희와 함께 승리하신다\"는 말씀은 비유가 아니라 문자 그대로 참입니다. 파라다이스는 우주의 떨림에 반응하고, 영원 아들은 우리의 영적 충동을 느끼시며, 공동 행위자는 우리 마음의 모든 표현을 품으십니다. 그리고 아버지께서는 이 모든 것을 신성한 의식의 충만함 속에서 인식하십니다.\n\n여러분, 오늘 여러분이 겪는 그 눈물도, 그 작은 승리도 — 결코 혼자 겪는 것이 아닙니다. \"그 안에 우리가 살고 움직이며 존재를 가지느니라\"는 이 말씀이, 오늘 여러분의 삶 속에서 그대로 이루어지고 있습니다.", "songTitle": "그 안에서 살고 움직이며", "songLyrics": "[Verse 1]\n그 손 안에서 나는 숨을 쉬고\n그 사랑 안에서 나는 걸어가네\n보이지 않아도 느껴지는 그 임재\n내 모든 순간 함께 하시네\n\n[Chorus]\n그 안에서 살고 움직이며\n그 안에서 존재하네\n나의 눈물도 나의 기쁨도\n아버지 품 안에 있네\n\n[Verse 2]\n파라다이스도 함께 떨리고\n영원 아들도 함께 느끼시네\n공동 행위자 내 맘을 품으시고\n아버지는 다 아시네 내 삶을\n\n[Chorus]\n그 안에서 살고 움직이며\n그 안에서 존재하네\n나의 눈물도 나의 기쁨도\n아버지 품 안에 있네\n\n[Bridge]\n고통 중에 그가 고통받으시고\n승리 중에 그가 함께 하시니\n나는 혼자가 아니라네\n영원히 함께 하시는 나의 하나님\n\n[Chorus]\n그 안에서 살고 움직이며\n그 안에서 존재하네\n나의 눈물도 나의 기쁨도\n아버지 품 안에 있네", "prayer": "은혜로우신 아버지 하나님,\n오늘 아침 눈을 뜨며\n당신의 임재를 느낍니다\n\n제 육체가 아니라\n제 영과 마음 안에서\n당신의 인격을 압니다\n\n제가 걷는 이 길 위에\n홀로 걷지 않게 하소서\n\n제 눈물도 제 기쁨도\n아버지와 함께 하게 하소서\n\n제 안에 계신 성령님이\n저를 이끌어 주소서\n\n오늘도 살아 움직이며\n당신 안에 거하게 하소서\n\n예수님의 이름으로 기도드립니다."};

const STAGES = ["scripture", "sermon", "song", "prayer"];
const STAGE_LABELS = {scripture:"낭독", sermon:"강론", song:"노래", prayer:"기도"};
const STAGE_AUDIO = {scripture:"https://archive.org/download/urantia-devotion-2026-07-05-morning/scripture.mp3", sermon:"https://archive.org/download/urantia-devotion-2026-07-05-morning/sermon.mp3", song:"https://archive.org/download/urantia-devotion-2026-07-05-morning/song.mp3", prayer:"https://archive.org/download/urantia-devotion-2026-07-05-morning/prayer.mp3"};

let currentStageIdx = 0;
let isPlaying = false;

const audioPlayer = document.getElementById('audioPlayer');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const progressWrap = document.getElementById('progressWrap');
const stageCounter = document.getElementById('stageCounter');
const stageLabel = document.getElementById('stageLabel');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const controls = document.getElementById('controls');
const replayWrap = document.getElementById('replayWrap');
const replayBtn = document.getElementById('replayBtn');

function renderContent(){
  const versesContainer = document.getElementById('versesContainer');
  versesContainer.innerHTML = '';
  DATA.verses.forEach(v => {
    const block = document.createElement('div');
    block.className = 'verse-block';
    block.innerHTML = '<div class="verse-ref">' + v.ref + '</div><div class="verse-text">' + v.text + '</div>';
    versesContainer.appendChild(block);
  });
  // mark first verse block as the one being recited
  const firstBlock = versesContainer.querySelector('.verse-block');
  if (firstBlock) firstBlock.classList.add('reciting');

  document.getElementById('sermonText').textContent = DATA.sermon;
  document.getElementById('songTitle').textContent = DATA.songTitle;
  document.getElementById('songLyrics').textContent = DATA.songLyrics;
  document.getElementById('prayerText').textContent = DATA.prayer;
}

function showStage(idx){
  STAGES.forEach((s, i) => {
    document.getElementById('stage-' + s).classList.toggle('active', i === idx);
  });
  stageLabel.textContent = STAGE_LABELS[STAGES[idx]];
  stageCounter.textContent = STAGE_LABELS[STAGES[idx]] + ' ' + (idx+1) + '/4';
  window.scrollTo({top:0, behavior:'smooth'});
}

function loadStage(idx, autoplay){
  currentStageIdx = idx;
  showStage(idx);
  audioPlayer.src = STAGE_AUDIO[STAGES[idx]];
  if (autoplay){
    audioPlayer.play().then(() => {
      isPlaying = true;
      playBtn.textContent = '❚❚';
    }).catch(err => {
      console.warn('Autoplay blocked.', err);
      isPlaying = false;
      playBtn.textContent = '▶';
    });
  }
}

function goToNextStage(){
  const next = currentStageIdx + 1;
  if (next >= STAGES.length){
    controls.style.display = 'none';
    replayWrap.style.display = 'block';
    return;
  }
  loadStage(next, true);
}

audioPlayer.addEventListener('ended', goToNextStage);

audioPlayer.addEventListener('timeupdate', () => {
  if (audioPlayer.duration){
    progressBar.style.width = (audioPlayer.currentTime / audioPlayer.duration * 100) + '%';
  }
});

audioPlayer.addEventListener('error', () => {
  console.error('오디오 로드 실패: ' + STAGE_AUDIO[STAGES[currentStageIdx]] + ' 파일이 audio/ 폴더에 있는지 확인하세요.');
});

playBtn.addEventListener('click', () => {
  if (isPlaying){
    audioPlayer.pause(); isPlaying = false; playBtn.textContent = '▶';
  } else {
    audioPlayer.play(); isPlaying = true; playBtn.textContent = '❚❚';
  }
});

progressWrap.addEventListener('click', (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  if (audioPlayer.duration) audioPlayer.currentTime = ratio * audioPlayer.duration;
});

startBtn.addEventListener('click', () => {
  startOverlay.style.display = 'none';
  controls.style.display = 'flex';
  loadStage(0, true);
});

replayBtn.addEventListener('click', () => {
  replayWrap.style.display = 'none';
  controls.style.display = 'flex';
  loadStage(0, true);
});

renderContent();
</script>
</body>
</html>

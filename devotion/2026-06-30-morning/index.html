<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 묵상 · 완전을 향한 영원한 모험</title>
<style>
  :root{
    --navy:#1E2761;
    --navy-soft:#2a356f;
    --gold:#C9A227;
    --gold-soft:#e3c768;
    --cream:#F4F1E8;
    --ink:#22253a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px 80px;}

  header{
    background:linear-gradient(160deg,var(--navy),var(--navy-soft));
    color:var(--cream);
    text-align:center;
    padding:46px 24px 40px;
    border-bottom:4px solid var(--gold);
  }
  header .date{
    letter-spacing:.32em;font-size:.78rem;color:var(--gold-soft);
    text-transform:uppercase;margin-bottom:14px;
  }
  header h1{
    font-size:1.9rem;font-weight:700;line-height:1.4;margin-bottom:12px;
    word-break:keep-all;
  }
  header .ref{
    font-size:.92rem;color:#cfd4ec;letter-spacing:.04em;
  }
  header .rule{
    width:54px;height:2px;background:var(--gold);margin:18px auto 0;
  }

  /* 재생 바 */
  .player{
    position:sticky;top:0;z-index:50;
    background:rgba(30,39,97,.97);
    backdrop-filter:saturate(140%) blur(6px);
    color:var(--cream);
    display:flex;align-items:center;gap:14px;
    padding:12px 18px;border-bottom:1px solid rgba(201,162,39,.4);
  }
  .play-btn{
    flex:0 0 auto;width:48px;height:48px;border-radius:50%;
    border:2px solid var(--gold);background:transparent;color:var(--gold-soft);
    font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.2s;
  }
  .play-btn:hover{background:var(--gold);color:var(--navy);}
  .nowplaying{flex:1 1 auto;min-width:0;}
  .nowplaying .label{font-size:.72rem;letter-spacing:.2em;color:var(--gold-soft);text-transform:uppercase;}
  .nowplaying .title{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .progress{height:4px;background:rgba(255,255,255,.18);border-radius:4px;margin-top:6px;overflow:hidden;}
  .progress > span{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear;}

  /* 섹션 */
  section{
    background:#fff;border-radius:14px;margin-top:26px;padding:30px 28px;
    box-shadow:0 6px 24px rgba(30,39,97,.07);
    border:1px solid rgba(30,39,97,.06);
    scroll-margin-top:90px;transition:box-shadow .3s,border-color .3s;
  }
  section.active{
    border-color:var(--gold);
    box-shadow:0 8px 30px rgba(201,162,39,.28);
  }
  .sec-head{
    display:flex;align-items:center;gap:12px;margin-bottom:20px;
  }
  .sec-num{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    background:var(--navy);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:.95rem;font-weight:700;
  }
  section.active .sec-num{background:var(--gold);color:var(--navy);}
  .sec-title{font-size:1.18rem;font-weight:700;color:var(--navy);}
  .sec-sub{font-size:.8rem;color:#8a8f9e;margin-left:auto;letter-spacing:.04em;}

  .para{margin-bottom:18px;}
  .para:last-child{margin-bottom:0;}
  .para .cite{
    display:inline-block;font-size:.74rem;font-weight:700;color:var(--gold);
    background:rgba(201,162,39,.1);border-radius:4px;padding:2px 8px;margin-bottom:6px;
    letter-spacing:.05em;
  }
  .para.narrated{
    background:rgba(201,162,39,.06);border-left:3px solid var(--gold);
    padding:14px 16px;border-radius:0 8px 8px 0;
  }
  .para.narrated .cite::after{content:" · 낭독";color:var(--navy);}
  .para p{font-size:1.04rem;word-break:keep-all;}

  .body-text{font-size:1.05rem;white-space:pre-line;word-break:keep-all;}
  .song-text{
    font-size:1.04rem;white-space:pre-line;word-break:keep-all;
    text-align:center;color:var(--ink);
  }
  .prayer-text{
    font-size:1.08rem;white-space:pre-line;word-break:keep-all;
    text-align:center;color:var(--navy);line-height:2.05;
    font-style:normal;
  }
  .song-note{
    margin-top:16px;font-size:.78rem;color:#a08a3c;text-align:center;
    border-top:1px dashed rgba(201,162,39,.5);padding-top:12px;
  }

  footer{text-align:center;margin-top:40px;color:#9aa0b0;font-size:.82rem;letter-spacing:.04em;}
  footer .seal{color:var(--gold);font-size:1.1rem;margin-bottom:6px;}
</style>
</head>
<body>

<header>
  <div class="date">오늘의 묵상 · 2026 · 06 · 30</div>
  <h1>완전을 향한 영원한 모험</h1>
  <div class="ref">유란시아서 1:0.3 – 1:0.6</div>
  <div class="rule"></div>
</header>

<div class="player">
  <button class="play-btn" id="playBtn" aria-label="재생">▶</button>
  <div class="nowplaying">
    <div class="label">전체 자동 재생</div>
    <div class="title" id="npTitle">재생 버튼을 누르면 처음부터 끝까지 이어집니다</div>
    <div class="progress"><span id="bar"></span></div>
  </div>
</div>

<div class="wrap">

  <!-- 1. 본문 -->
  <section id="sec-reading">
    <div class="sec-head">
      <div class="sec-num">1</div>
      <div class="sec-title">본문 낭독</div>
      <div class="sec-sub">1:0.3 낭독 · 전체 표시</div>
    </div>
    <div id="paragraphs"></div>
  </section>

  <!-- 2. 강론 -->
  <section id="sec-sermon">
    <div class="sec-head">
      <div class="sec-num">2</div>
      <div class="sec-title">강론</div>
    </div>
    <div class="body-text" id="sermonText"></div>
  </section>

  <!-- 3. 노래 -->
  <section id="sec-song">
    <div class="sec-head">
      <div class="sec-num">3</div>
      <div class="sec-title">노래 · 완전을 향하여</div>
    </div>
    <div class="song-text" id="songText"></div>
    <div class="song-note">♪ song.mp3 는 Mureka 에서 생성하여 audio/ 폴더에 추가하세요.</div>
  </section>

  <!-- 4. 아침 기도 -->
  <section id="sec-prayer">
    <div class="sec-head">
      <div class="sec-num">4</div>
      <div class="sec-title">아침 기도</div>
    </div>
    <div class="prayer-text" id="prayerText"></div>
  </section>

  <footer>
    <div class="seal">✦</div>
    오늘의 묵상 · 유란시아서 스터디
  </footer>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ── 콘텐츠 데이터 ───────────────────────────────────────── */
const PARAGRAPHS = [
  ["1:0.3", "계몽된 세계들은 모든 창조의 영원한 창조자이며 무한한 유지자인 우주 아버지를 인식하고 예배한다. 우주들의 우주의 의지 창조체들은 파라다이스로 가는 길고 긴 여행을 시작했으니, 이는 아버지 하나님께 도달하고자 하는 영원한 모험의 매혹적인 도전이다. 시간의 자녀들의 초월적 목표는 영원한 하나님을 발견하고 신성한 본성을 이해하고 우주 아버지를 인식하는 것이다. 하나님을 아는 창조체들은 단 한 가지 최고의 열망, 곧 단 하나의 강렬한 소망을 가지고 있는데, 바로 자기들의 구체에서 파라다이스의 하나님이 인격의 완전함과 의로운 최상위의 보편적 영역 안에 계신 것처럼 되는 것이다. 영원에 거하시는 우주 아버지로부터 최상의 명령이 내려졌다. \u201C내가 완전한 것처럼 너희도 완전하라.\u201D 사랑과 자비로써 파라다이스 전령들이 이 신성한 권고를 여러 시대에 걸쳐 여러 우주를 통해 전했으며, 심지어 유란시아의 낮고 동물적 기원을 가진 인류에게까지 이르게 했다.", true],
  ["1:0.4", "신성의 완전을 성취하려고 노력하라는 장엄하고 보편적인 권면은 완전하신 하나님께 속한 모든 분투하는 창조 존재들의 첫째 의무이자 가장 높은 열망이 되어야 한다. 신성한 완전에 도달할 가능성은 인간의 영원한 영적 진보의 최종적이고 확실한 운명이다.", false],
  ["1:0.5", "유란시아의 인간들이 무한이란 의미에서 완전하기를 도저히 바랄 수 없지만, 인간이 이 행성에서 시작하는 그들의 방식대로 출발하여 무한한 하나님이 유한한 인간들을 위해서 세워 준 고귀하고 신성한 목표를 달성하는 일은 전적으로 가능하다. 그들이 이 숙명을 성취했을 때 그들은 자아 실현과 마음 달성에 관련해서 하나님 자신이 무한하고 영원한 그의 구체에서 그런 것처럼 신성한 완전의 자기 영역에서 충만하게 될 것이다. 그러한 완전함은 물질적인 의미에서는 보편적이지 않고 지적인 이해에서는 제한이 있을지도 모르고 영적 체험에서 최종적이지 않을 수도 있지만, 그것은 의지 신성함, 인격 동기 완전함, 하나님 의식이라는 모든 유한의 측면에서는 최종적이고 완전하다.", false],
  ["1:0.6", "이것이 \u201C너희는 완전하라, 내가 완전하듯이\u201D라는 신성한 명령의 진정한 의미이다. 이 명령은 언제나 유한한 인간으로 하여금 앞으로 나아가도록 독려하고, 더 높고 높은 수준의 영적 가치와 진정한 우주 의미를 깨닫게 하기 위한 그 길고 매혹적인 투쟁 안으로 그를 부른다. 우주들의 하나님을 찾는 이 숭고한 탐구는 시간과 공간 모든 세계 거주민들의 최상의 모험이다.", false]
];

const SERMON = `오늘 우리는 우주 아버지를 향한 가장 위대한 부르심 앞에 섭니다. 계몽된 세계들이 영원한 창조자를 인식하고 예배할 때, 그들의 가슴에는 단 하나의 갈망이 타오릅니다. 바로 파라다이스로 가는 길고 긴 여행, 하나님 아버지께 도달하려는 영원한 모험입니다.

이 모험은 두려운 것이 아닙니다. 오히려 매혹적인 도전입니다. 시간의 자녀인 우리의 초월적 목표는 영원한 하나님을 발견하고, 신성한 본성을 이해하며, 우주 아버지를 인식하는 것입니다. 하나님을 아는 사람의 마음에는 오직 하나의 소망이 있습니다. 우리 자신의 구체에서, 파라다이스의 하나님이 그러하신 것처럼 인격의 완전함에 이르는 것입니다.

여기 시대를 가로질러 울려 퍼진 신성한 명령이 있습니다. 내가 완전한 것처럼 너희도 완전하라. 이 음성은 영원에 거하시는 아버지로부터 사랑과 자비로 전해졌습니다. 파라다이스의 전령들은 이 권고를 수많은 우주를 통해 전하였고, 마침내 낮고 동물적 기원을 가진 유란시아의 인류에게까지 이르게 하였습니다.

우리는 무한의 의미에서 완전할 수 없습니다. 그러나 이 행성에서 출발하는 우리의 방식대로, 무한한 하나님이 유한한 자녀를 위해 세워 주신 고귀하고 신성한 목표에 도달하는 일은 전적으로 가능합니다. 이 숙명을 성취할 때, 우리는 의지의 신성함과 인격 동기의 완전함과 하나님 의식 안에서 충만해질 것입니다.

그러므로 두려워하지 마십시오. 하나님을 찾는 이 숭고한 탐구는 시간과 공간의 모든 세계에 거주하는 이들의 최상의 모험입니다. 오늘도 그 부르심은 우리를 더 높은 곳으로, 더 높은 곳으로 부르고 있습니다.`;

const SONG = `1절
영원한 창조자 우주의 아버지
계몽된 세계가 당신을 부르네
파라다이스 향한 길고 긴 여정에
내 마음 설레며 첫발을 내딛네

후렴
내가 완전하듯 너희도 완전하라
시대를 넘어서 울리는 그 음성
사랑과 자비로 전해진 부르심
오늘 내 가슴에 불을 밝히네

2절
무한할 수 없는 작은 나이지만
아버지 세우신 목표에 이르리
의지의 신성함 하나님 의식 안에
충만한 그날을 소망하며 가네

후렴
내가 완전하듯 너희도 완전하라
시대를 넘어서 울리는 그 음성
사랑과 자비로 전해진 부르심
오늘 내 가슴에 불을 밝히네

브릿지
두려움 없이 매혹의 모험으로
시간과 공간 모든 세계 넘어
하나님 찾는 숭고한 탐구 속에
영원의 빛을 향해 나아가리라`;

const PRAYER = `사랑의 하나님 아버지,
영원한 창조자이시며
무한한 유지자이신
우주 아버지를 예배합니다.

오늘도 저희를
파라다이스의 여정으로
부르시니 감사합니다.

내가 완전하듯
너희도 완전하라 하신
그 음성을 듣게 하시고
저희 마음에 새겨 주소서.

무한의 완전에
이르지 못하는 저희지만
아버지께서 세워 주신
신성한 목표를 향하여
한 걸음 내딛게 하소서.

의지의 신성함과
인격의 완전함과
하나님 의식 안에서
저희가 충만해지게 하소서.

두려움을 거두시고
이 매혹적인 모험을
기쁨으로 걷게 하소서.

시간과 공간 모든 세계의
이 숭고한 탐구 속에
저희를 인도하여 주소서.

예수님의 이름으로
기도드립니다.`;

/* ── 화면 렌더링 ─────────────────────────────────────────── */
const pWrap = document.getElementById('paragraphs');
PARAGRAPHS.forEach(([cite, text, narrated]) => {
  const div = document.createElement('div');
  div.className = 'para' + (narrated ? ' narrated' : '');
  div.innerHTML = '<span class="cite">' + cite + '</span><p>' + text + '</p>';
  pWrap.appendChild(div);
});
document.getElementById('sermonText').textContent = SERMON;
document.getElementById('songText').textContent = SONG;
document.getElementById('prayerText').textContent = PRAYER;

/* ── 자동 재생 플레이어 ──────────────────────────────────── */
const PLAYLIST = [
  { id:'reading', title:'본문 낭독 (1:0.3)', src:'https://archive.org/download/urantia-devotion-2026-06-30-morning/reading.mp3', sec:'sec-reading' },
  { id:'sermon',  title:'강론',             src:'https://archive.org/download/urantia-devotion-2026-06-30-morning/sermon.mp3',  sec:'sec-sermon'  },
  { id:'song',    title:'노래 · 완전을 향하여', src:'https://archive.org/download/urantia-devotion-2026-06-30-morning/song.mp3',  sec:'sec-song'    },
  { id:'prayer',  title:'아침 기도',         src:'https://archive.org/download/urantia-devotion-2026-06-30-morning/prayer.mp3',  sec:'sec-prayer'  }
];

const audio   = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const npTitle = document.getElementById('npTitle');
const bar     = document.getElementById('bar');

let idx = -1;
let playing = false;

function setActive(secId){
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  if(secId){
    const el = document.getElementById(secId);
    if(el){
      el.classList.add('active');
      el.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }
}

function load(i){
  idx = i;
  const item = PLAYLIST[i];
  npTitle.textContent = (i+1) + ' / ' + PLAYLIST.length + ' · ' + item.title;
  setActive(item.sec);
  audio.src = item.src;
  audio.play().then(() => {
    playing = true; playBtn.textContent = '❚❚';
  }).catch(() => {
    playing = false; playBtn.textContent = '▶';
  });
}

function next(){
  if(idx + 1 < PLAYLIST.length){
    load(idx + 1);
  } else {
    // 끝까지 재생 완료
    playing = false;
    playBtn.textContent = '▶';
    npTitle.textContent = '묵상을 마쳤습니다 · 다시 들으려면 ▶';
    bar.style.width = '100%';
    setActive(null);
    idx = -1;
  }
}

playBtn.addEventListener('click', () => {
  if(idx === -1){ load(0); return; }          // 처음부터 시작
  if(playing){ audio.pause(); }                // 일시정지
  else{ audio.play(); }                         // 재개
});

audio.addEventListener('play',  () => { playing = true;  playBtn.textContent = '❚❚'; });
audio.addEventListener('pause', () => { if(!audio.ended){ playing = false; playBtn.textContent = '▶'; } });
audio.addEventListener('ended', next);

// 파일이 없거나(아직 song.mp3 미추가 등) 오류 시 다음 순서로 자동 진행
audio.addEventListener('error', () => {
  if(idx > -1){

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 묵상 — 한국 유란시아서 포털</title>
<style>
:root{--navy:#1f3f52;--gold:#d8b45a;--ink:#20272c;--line:#dfe6ea;--bg:#f6f8f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.hd{background:linear-gradient(160deg,#16303f,#1f3f52 60%,#264a5c);color:#fff;
 border-bottom:3px solid var(--gold);padding:15px 20px}
.hd .in{max-width:820px;margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.hd h1{margin:0;font-size:19px;letter-spacing:-.3px}
.hd .crumb{width:100%;font-size:12px;color:#b9cdd8}
.hd .crumb a:hover{color:#fff;text-decoration:underline}
.hd .sp{margin-left:auto}
.hd .sp a{background:rgba(255,255,255,.14);border-radius:16px;padding:5px 13px;font-size:12.5px}
.hd .sp a:hover{background:rgba(255,255,255,.24)}
.wrap{max-width:820px;margin:0 auto;padding:22px 20px 46px}
.lead{font-size:13.5px;color:#4e5b63;margin:0 0 18px}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:block;background:#fff;border:1px solid #e4ebee;border-radius:10px;
 padding:13px 16px;transition:box-shadow .12s,border-color .12s}
.card:hover{border-color:var(--navy);box-shadow:0 3px 12px rgba(31,63,82,.12)}
.card .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .kind{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--navy);
 border-radius:4px;padding:1px 7px}
.card .date{font-size:12.5px;color:#5d6b73}
.card .title{margin-top:4px;font-size:15.5px;font-weight:700;color:var(--ink)}
.card .src{margin-top:2px;font-size:12px;color:#7a8891}
.foot{max-width:820px;margin:0 auto;padding:0 20px 40px;font-size:12.5px;color:#68767e;text-align:center}
.foot a{color:var(--navy);border-bottom:1px solid #c2d0d7}
</style>
</head>
<body>

<div class="hd"><div class="in">
  <div class="crumb"><a href="/">홈</a> › 오늘의 묵상</div>
  <h1>오늘의 묵상</h1>
  <div class="sp"><a href="/">포털 첫 화면</a></div>
</div></div>

<div class="wrap">
  <p class="lead">유란시아서 한 절을 낭독·강론·노래·기도로 이어 듣는 아침·취침 묵상입니다. 최신순으로 나열했습니다.</p>
  <div class="list" id="list"></div>
</div>

<div class="foot">
  <a href="/">포털 첫 화면</a> · <a href="/text.html">유란시아서 본문</a> · <a href="/mind.html">전편 마인드맵</a>
</div>

<script>
/* ─────────────────────────────────────────────────────────
   묵상을 새로 올릴 때마다 이 목록 맨 위에 한 줄 추가하세요.
     folder : devotion 안의 날짜 폴더 이름
     kind   : "아침" 또는 "취침"
     date   : 화면에 보일 날짜
     title  : 묵상 제목
     source : 본문 편·장 제목
     verse  : 절 번호(예: 12:7.10)
   ───────────────────────────────────────────────────────── */
var DAYS = [
  { folder: "2026-08-16-night", kind: "취침", date: "2026년 8월 16일",
    title: "먼저 주셨기에", source: "제149편 두 번째 전도 여행 · 주에 대한 두려움", verse: "149:6.4" },
  { folder: "2026-08-15-night", kind: "취침", date: "2026년 8월 15일",
    title: "환멸 너머의 사랑", source: "제83편 결혼 제도 · 결혼의 이상화", verse: "83:8.6" },
  { folder: "2026-08-14-night", kind: "취침", date: "2026년 8월 14일",
    title: "전체의 얼굴", source: "제12편 우주들의 우주 · 부분과 전체", verse: "12:7.10" },
  { folder: "2026-08-13-night", kind: "취침", date: "2026년 8월 13일",
    title: "미미한 불꽃에도", source: "제155편 북부 갈릴리를 통해 피신 · 종교에 대한 두 번째 설교", verse: "155:6.17" },
  { folder: "2026-08-12-night", kind: "취침", date: "2026년 8월 12일",
    title: "감사라는 다리", source: "제149편 두 번째 전도 여행 · 주에 대한 두려움", verse: "149:6.3" }
];

(function(){
  var list = document.getElementById('list');
  DAYS.forEach(function(d){
    var a = document.createElement('a');
    a.className = 'card';
    a.href =  d.folder + '/';
    a.innerHTML =
      '<div class="top"><span class="kind">' + d.kind + '</span>' +
      '<span class="date">' + d.date + '</span></div>' +
      '<div class="title">' + d.title + '</div>' +
      '<div class="src">' + d.source + ' (' + d.verse + ')</div>';
    list.appendChild(a);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080D1F">
<title>오늘의 묵상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080D1F;
  --ink-2:#101838;
  --veil:#24305C;
  --moon:#F2EBDA;
  --lamp:#E8A94E;
  --water:#6FA9A2;
  --dim:#7F8AB4;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 50% -8%, #1B2A55 0%, transparent 62%),
    linear-gradient(180deg,#0B1230 0%, var(--ink) 55%, #05070F 100%);
  background-attachment:fixed;
  color:var(--moon);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
#stars{position:fixed;inset:0;pointer-events:none;opacity:.5}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:32px 22px 120px}

/* ── 머리말 ── */
.eyebrow{
  font-family:var(--sans);font-weight:400;font-size:11.5px;letter-spacing:.34em;
  color:var(--dim);text-transform:uppercase;display:flex;gap:14px;align-items:center
}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--veil),transparent)}
h1{font-size:clamp(26px,5.4vw,38px);font-weight:700;letter-spacing:-.01em;margin:14px 0 6px;line-height:1.32}
.ref{font-family:var(--sans);font-size:13px;color:var(--lamp);letter-spacing:.06em}
.ref span{color:var(--dim)}
.oneline{
  margin-top:18px;padding-left:16px;border-left:2px solid var(--lamp);
  font-size:16px;line-height:1.85;color:#D8D2C2
}

/* ── 서명 요소: 달의 궤적 ── */
.sky{margin:34px 0 6px;position:relative}
.sky svg{display:block;width:100%;height:auto;overflow:visible}
.arc-bg{fill:none;stroke:var(--veil);stroke-width:1.25;stroke-dasharray:2 6;stroke-linecap:round}
.arc-fg{fill:none;stroke:url(#glow);stroke-width:2;stroke-linecap:round;transition:stroke-dashoffset .28s linear}
.station{fill:var(--ink-2);stroke:var(--veil);stroke-width:1.5;transition:.5s}
.station.passed{stroke:var(--water);fill:#132A2C}
.station.active{stroke:var(--lamp);fill:var(--lamp)}
.st-label{
  font-family:var(--sans);font-size:12px;font-weight:400;fill:var(--dim);
  text-anchor:middle;transition:.5s;letter-spacing:.16em
}
.st-label.active{fill:var(--moon);font-weight:500}
.moon-body{fill:var(--moon)}
.moon-halo{fill:var(--moon);opacity:.14}

/* ── 본문 ── */
.panel{
  margin-top:26px;background:rgba(16,24,56,.44);
  border:1px solid rgba(36,48,92,.9);border-radius:2px;
  padding:26px 24px;min-height:210px
}
.panel-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--sans);font-size:12px;letter-spacing:.2em;color:var(--dim);
  padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid rgba(36,48,92,.8)
}
.panel-head b{color:var(--lamp);font-weight:500}
.body-text{font-size:17px;line-height:2.05;color:#E4DECE;white-space:pre-wrap;word-break:keep-all}
.body-text.verse{font-size:16.5px}
.notice{font-family:var(--sans);font-size:12.5px;color:var(--lamp);margin-top:16px;display:none}
.notice.on{display:block}

/* ── 재생 막대 ── */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:linear-gradient(180deg,rgba(8,13,31,.6),rgba(5,7,15,.97) 42%);
  backdrop-filter:blur(14px);border-top:1px solid rgba(36,48,92,.9);
  padding:14px 22px calc(16px + env(safe-area-inset-bottom))
}
.dock-in{max-width:760px;margin:0 auto}
.bar{height:3px;background:rgba(36,48,92,.9);border-radius:2px;cursor:pointer;position:relative}
.bar-fill{height:100%;background:var(--lamp);border-radius:2px;width:0}
.bar::after{content:"";position:absolute;inset:-9px 0}
.times{
  display:flex;justify-content:space-between;font-family:var(--sans);
  font-size:11px;color:var(--dim);margin-top:7px;font-variant-numeric:tabular-nums
}
.ctrls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
button{
  font-family:var(--sans);background:none;border:1px solid rgba(36,48,92,.9);
  color:var(--dim);border-radius:2px;cursor:pointer;transition:.2s;
  display:grid;place-items:center
}
button:hover{color:var(--moon);border-color:var(--water)}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.icon{width:42px;height:38px}
.icon svg{width:17px;height:17px;fill:currentColor}
.play{width:58px;height:52px;border-color:var(--lamp);color:var(--lamp)}
.play:hover{background:rgba(232,169,78,.1);color:var(--lamp)}
.play svg{width:20px;height:20px}
.mode{
  height:38px;padding:0 14px;font-size:12px;letter-spacing:.08em;white-space:nowrap
}
.mode.on{color:var(--water);border-color:var(--water)}
.hint{
  font-family:var(--sans);font-size:10.5px;color:#4C568A;text-align:center;
  margin-top:9px;letter-spacing:.05em
}
@media(max-width:520px){.hint{display:none}.ctrls{gap:7px}.icon{width:38px}}

/* ── 시작 덮개 ── */
.gate{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:rgba(5,7,15,.94);backdrop-filter:blur(6px);text-align:center;padding:24px
}
.gate.off{display:none}
.gate p{font-family:var(--sans);font-size:13px;color:var(--dim);letter-spacing:.14em;margin-bottom:22px}
.gate button{
  width:auto;height:auto;padding:16px 40px;font-family:var(--serif);font-size:17px;
  color:var(--moon);border-color:var(--lamp)
}
.gate button:hover{background:rgba(232,169,78,.1)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="gate" id="gate">
  <div>
    <p>오늘의 묵상</p>
    <button id="gateBtn">조용히 시작하기</button>
  </div>
</div>

<div class="wrap">
  <div class="eyebrow"><span id="dateTxt">—</span></div>
  <h1 id="theme">—</h1>
  <div class="ref"><span id="paper">—</span> · <b id="refTxt">—</b></div>
  <p class="oneline" id="oneLine">—</p>

  <div class="sky">
    <svg id="sky" viewBox="0 0 700 190" role="img" aria-label="묵상 진행 궤적">
      <defs>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#6FA9A2"/>
          <stop offset="100%" stop-color="#E8A94E"/>
        </linearGradient>
      </defs>
      <path id="arcBg" class="arc-bg" d="M 50 160 A 300 300 0 0 1 650 160"/>
      <path id="arcFg" class="arc-fg" d="M 50 160 A 300 300 0 0 1 650 160"/>
      <g id="stations"></g>
      <g id="moon">
        <circle class="moon-halo" r="19"/>
        <circle class="moon-body" r="7.5"/>
      </g>
    </svg>
  </div>

  <div class="panel">
    <div class="panel-head"><b id="trackLabel">낭독</b><span id="trackSub">—</span></div>
    <div class="body-text" id="bodyText">—</div>
    <div class="notice" id="notice">음성 파일이 아직 없습니다. 본문만 표시합니다.</div>
  </div>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="times"><span id="tNow">0:00</span><span id="tEnd">0:00</span></div>
    <div class="ctrls">
      <button class="icon" id="prev" title="이전 (P)" aria-label="이전 순서">
        <svg viewBox="0 0 24 24"><path d="M7 6h2v12H7zm3 6l8-6v12z"/></svg></button>
      <button class="icon" id="back" title="10초 뒤로 (←)" aria-label="10초 뒤로">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L6 6l6 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
      <button class="play" id="play" title="재생 / 멈춤 (스페이스)" aria-label="재생">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="icon" id="fwd" title="10초 앞으로 (→)" aria-label="10초 앞으로">
        <svg viewBox="0 0 24 24"><path d="M12 5V1l6 5-6 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg></button>
      <button class="icon" id="next" title="건너뛰기 (N)" aria-label="다음 순서">
        <svg viewBox="0 0 24 24"><path d="M15 6h2v12h-2zm-1 6L6 18V6z"/></svg></button>
      <button class="mode on" id="mode" title="반복 방식 (R)">전체 무한</button>
    </div>
    <div class="hint">스페이스 재생 · ← → 10초 · N 건너뛰기 · P 이전 · R 반복 방식</div>
  </div>
</div>

<audio id="au" preload="auto"></audio>
<script src="content.js"></script>
<script>
(() => {
  const D = window.MEDITATION;
  const au = document.getElementById('au');
  const $ = id => document.getElementById(id);
  const MODES = [
    {key:'all',  label:'전체 무한'},
    {key:'one',  label:'이 항목 무한'},
    {key:'once', label:'한 번만'}
  ];
  let idx = 0, mode = 0, started = false, fallbackTimer = null;

  /* ── 머리말 채우기 ── */
  const d = new Date(D.date + 'T00:00:00');
  const wk = ['일','월','화','수','목','금','토'][d.getDay()];
  $('dateTxt').textContent = `오늘의 묵상 · ${D.date.replace(/-/g,'.')} ${wk}`;
  $('theme').textContent = D.theme;
  $('paper').textContent = D.paperTitle + ' › ' + D.sectionTitle;
  $('refTxt').textContent = D.reference;
  $('oneLine').textContent = D.oneLine;

  /* ── 달의 궤적 ── */
  const arcFg = $('arcFg'), arcBg = $('arcBg'), moon = $('moon');
  const L = arcBg.getTotalLength();
  arcFg.style.strokeDasharray = L;
  arcFg.style.strokeDashoffset = L;

  const gStations = $('stations');
  D.tracks.forEach((t, i) => {
    const p = arcBg.getPointAtLength((i + .5) / D.tracks.length * L);
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 5.5);
    c.setAttribute('class','station'); c.dataset.i = i;
    const lb = document.createElementNS('http://www.w3.org/2000/svg','text');
    lb.setAttribute('x', p.x); lb.setAttribute('y', p.y - 18);
    lb.setAttribute('class','st-label'); lb.textContent = t.label; lb.dataset.i = i;
    c.style.cursor = lb.style.cursor = 'pointer';
    c.onclick = lb.onclick = () => load(i, started);
    gStations.append(c, lb);
  });

  function drawArc(frac){
    const f = Math.max(0, Math.min(1, frac));
    arcFg.style.strokeDashoffset = L * (1 - f);
    const p = arcBg.getPointAtLength(L * f);
    moon.setAttribute('transform', `translate(${p.x} ${p.y})`);
  }

  /* ── 트랙 불러오기 ── */
  function load(i, autoplay){
    idx = (i + D.tracks.length) % D.tracks.length;
    const t = D.tracks[idx];
    clearTimeout(fallbackTimer);
    $('trackLabel').textContent = t.label;
    $('trackSub').textContent = t.sub;
    $('bodyText').textContent = t.text;
    $('bodyText').className = 'body-text' + (t.id === 'reading' ? ' verse' : '');
    $('notice').classList.remove('on');
    document.querySelectorAll('.station').forEach(s => {
      s.classList.toggle('active', +s.dataset.i === idx);
      s.classList.toggle('passed', +s.dataset.i < idx);
    });
    document.querySelectorAll('.st-label').forEach(s =>
      s.classList.toggle('active', +s.dataset.i === idx));
    drawArc((idx + .5) / D.tracks.length);
    au.src = D.audioBase + t.file;
    au.load();
    if (autoplay) au.play().catch(() => {});
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ── 다음 순서 ── */
  function advance(auto){
    const m = MODES[mode].key;
    if (auto && m === 'one'){ au.currentTime = 0; au.play().catch(()=>{}); return; }
    if (auto && m === 'once' && idx === D.tracks.length - 1){ setPlayIcon(false); return; }
    load(idx + 1, true);
  }

  /* ── 음성 파일이 없을 때: 본문 읽을 시간만큼 머문 뒤 넘어감 ── */
  function fallback(){
    $('notice').classList.add('on');
    const secs = Math.max(20, Math.round(D.tracks[idx].text.length / 5.2));
    $('tEnd').textContent = fmt(secs);
    let el = 0;
    fallbackTimer = setInterval(() => {
      if (au.paused && started === 'paused') return;
      el++;
      $('tNow').textContent = fmt(el);
      $('barFill').style.width = (el / secs * 100) + '%';
      const seg = 1 / D.tracks.length;
      drawArc(idx * seg + seg * (el / secs));
      if (el >= secs){ clearInterval(fallbackTimer); advance(true); }
    }, 1000);
  }

  const fmt = s => {
    if (!isFinite(s) || s < 0) s = 0;
    return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  };
  const setPlayIcon = on => {
    $('playIcon').innerHTML = on
      ? '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>'
      : '<path d="M7 4l13 8-13 8z"/>';
    $('play').setAttribute('aria-label', on ? '멈춤' : '재생');
  };

  /* ── 오디오 사건 ── */
  au.addEventListener('loadedmetadata', () => $('tEnd').textContent = fmt(au.duration));
  au.addEventListener('timeupdate', () => {
    if (!au.duration) return;
    const f = au.currentTime / au.duration;
    $('barFill').style.width = (f * 100) + '%';
    $('tNow').textContent = fmt(au.currentTime);
    const seg = 1 / D.tracks.length;
    drawArc(idx * seg + seg * f);
  });
  au.addEventListener('ended', () => advance(true));
  au.addEventListener('play',  () => { started = true;  setPlayIcon(true);  });
  au.addEventListener('pause', () => { started = 'paused'; setPlayIcon(false); });
  au.addEventListener('error', fallback);

  /* ── 조작 ── */
  $('play').onclick = () => au.paused ? au.play().catch(fallback) : au.pause();
  $('next').onclick = () => advance(false);
  $('prev').onclick = () => au.currentTime > 3 ? au.currentTime = 0 : load(idx - 1, true);
  $('back').onclick = () => au.currentTime = Math.max(0, au.currentTime - 10);
  $('fwd').onclick  = () => au.currentTime = Math.min(au.duration || 0, au.currentTime + 10);
  $('bar').onclick = e => {
    if (!au.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    au.currentTime = (e.clientX - r.left) / r.width * au.duration;
  };
  $('mode').onclick = () => {
    mode = (mode + 1) % MODES.length;
    $('mode').textContent = MODES[mode].label;
    $('mode').classList.toggle('on', MODES[mode].key !== 'once');
  };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'BUTTON' && e.code === 'Space') e.preventDefault();
    const k = e.key.toLowerCase();
    if (e.code === 'Space'){ e.preventDefault(); $('play').click(); }
    else if (e.key === 'ArrowLeft')  e.shiftKey ? $('prev').click() : $('back').click();
    else if (e.key === 'ArrowRight') e.shiftKey ? $('next').click() : $('fwd').click();
    else if (k === 'n') $('next').click();
    else if (k === 'p') $('prev').click();
    else if (k === 'r') $('mode').click();
  });

  /* ── 밤하늘 ── */
  const cv = $('stars'), ctx = cv.getContext('2d');
  function sky(){
    cv.width = innerWidth; cv.height = innerHeight;
    ctx.clearRect(0,0,cv.width,cv.height);
    for (let i = 0; i < Math.round(innerWidth * innerHeight / 5200); i++){
      const r = Math.random() * 1.15 + .18;
      ctx.globalAlpha = Math.random() * .65 + .12;
      ctx.fillStyle = Math.random() > .88 ? '#E8A94E' : '#F2EBDA';
      ctx.beginPath();
      ctx.arc(Math.random()*cv.width, Math.random()*cv.height, r, 0, 7);
      ctx.fill();
    }
  }
  sky(); addEventListener('resize', sky);

  /* ── 시작 ── */
  load(0, false);
  $('gateBtn').onclick = () => {
    $('gate').classList.add('off');
    au.play().catch(fallback);
  };
  au.play().then(() => $('gate').classList.add('off')).catch(() => {});
})();
</script>
</body>
</html>

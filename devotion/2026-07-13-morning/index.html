<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 아침 명상 · 성실함, 하늘나라의 열쇠</title>
<style>
  :root{
    --navy:#0a1733; --navy2:#0f2249; --gold:#d4af37; --gold-soft:#e8cf82;
    --ink:#eef2fb; --dim:#a7b6d6; --line:rgba(212,175,55,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1100px 640px at 50% -8%, var(--navy2), var(--navy) 62%);
    color:var(--ink);
    font-family:"Noto Serif KR","Nanum Myeongjo",-apple-system,system-ui,"Malgun Gothic",serif;
    display:flex;flex-direction:column;min-height:100%;
  }
  header{text-align:center;padding:26px 18px 10px;}
  header .kicker{font-size:12px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;}
  header .title{font-size:26px;margin-top:8px;font-weight:700;}
  header .meta{font-size:13px;color:var(--dim);margin-top:8px;}
  /* section tabs */
  .tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px auto 6px;padding:0 14px;}
  .tab{
    border:1px solid var(--line);color:var(--gold-soft);background:transparent;
    padding:8px 18px;border-radius:999px;font-size:15px;cursor:pointer;transition:all .15s ease;
    font-family:inherit;letter-spacing:1px;
  }
  .tab .en{font-size:11px;color:var(--dim);margin-left:6px;letter-spacing:1px;}
  .tab.active{background:linear-gradient(180deg, rgba(212,175,55,.22), rgba(212,175,55,.10));
    border-color:var(--gold);color:#fff;}
  .tab.done{color:var(--dim);}
  /* reading pane */
  .pane{
    flex:1;width:min(92vw,760px);margin:14px auto 8px;padding:26px 30px;
    border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
    box-shadow:0 16px 46px rgba(0,0,0,.5);
    font-size:19px;line-height:2.0;white-space:pre-wrap;overflow-y:auto;max-height:52vh;
  }
  .pane.song{font-style:normal;color:var(--gold-soft);}
  .pane .marker{color:var(--gold);font-weight:700;}
  /* controls */
  .bar{
    width:min(92vw,760px);margin:6px auto 10px;display:flex;align-items:center;gap:14px;
    padding:12px 18px;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  }
  .btn{
    background:transparent;border:1px solid rgba(212,175,55,.5);color:var(--gold-soft);
    width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease;
  }
  .btn:hover{background:rgba(212,175,55,.14);color:#fff;border-color:var(--gold);}
  .btn.play{width:54px;height:54px;font-size:20px;border-color:var(--gold);color:var(--gold);}
  .now{color:var(--gold);font-size:15px;min-width:96px;text-align:center;letter-spacing:1px;}
  .progress{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;cursor:pointer;}
  .progress .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
  .time{color:var(--dim);font-size:12px;min-width:84px;text-align:right;font-variant-numeric:tabular-nums;}
  .hint{color:var(--dim);font-size:12px;text-align:center;padding:0 14px 18px;}
  /* start overlay */
  #overlay{position:fixed;inset:0;background:rgba(6,14,33,.82);backdrop-filter:blur(4px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9;cursor:pointer;}
  #overlay .ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:38px;transition:transform .2s ease;}
  #overlay:hover .ring{transform:scale(1.06);background:rgba(212,175,55,.12);}
  #overlay .lbl{color:var(--gold-soft);letter-spacing:3px;font-size:14px;}
  #overlay .ttl{font-size:20px;color:var(--ink);}
  @media (max-width:560px){
    header .title{font-size:21px;} .pane{font-size:17px;line-height:1.9;padding:20px 20px;}
    .time{display:none;}
  }
</style>
</head>
<body>
  <div id="overlay">
    <div class="ttl">오늘의 아침 명상</div>
    <div class="ring">&#9654;</div>
    <div class="lbl">재생하기</div>
  </div>

  <header>
    <div class="kicker">오늘의 아침 명상</div>
    <div class="title">성실함, 하늘나라의 열쇠</div>
    <div class="meta">2026년 7월 13일 &nbsp;·&nbsp; 유란시아서 39:4.13–4.14</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="pane" id="pane"></div>

  <div class="bar">
    <button class="btn" id="prev" title="이전">&#10094;</button>
    <button class="btn play" id="pp" title="재생/일시정지 (Space)">&#9654;</button>
    <button class="btn" id="next" title="다음 (건너뛰기)">&#10095;</button>
    <span class="now" id="now">낭독</span>
    <div class="progress" id="progress"><div class="fill" id="fill"></div></div>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <div class="hint">낭독 → 강론 → 노래 → 기도 순으로 자동 재생됩니다 · 화살표 버튼으로 건너뛰기 · Space 재생/정지</div>

<script>
const SECTIONS = [{"ko": "낭독", "en": "Reading", "src": "https://archive.org/download/urantia-devotion-2026-07-13-morning/reading.mp3", "text": "유란시아서 삼십구편 사장, 십삼절과 십사절 말씀입니다.\n\n사람이 사는 세계에서는 도덕 촉진자들이 인간 생애를 하나의 끊기지 않은 긴 사슬로 묘사한다. 유란시아에서의 짧은 체류는 그 사슬의 첫 번째 고리일 뿐이다. 이 생애에서 배울 수 있는 것은 많지 않지만, 살아가는 경험 자체가 중요하다. 이 세상에서 무슨 일을 하느냐도 중요하지만, 그것을 어떻게 하느냐는 훨씬 더 중요하다. 정의로운 삶에는 물질적 보상이 따르지 않지만, 내면의 성취에서 오는 깊은 만족은 어떤 외적 보상보다 훨씬 더 크다.\n\n하늘나라의 열쇠는 성실함, 더 큰 성실함, 그리고 더욱 깊은 성실함이다. 이 열쇠는 누구나 지니고 있으며, 사람들은 반복된 선택을 통해 이를 사용하고 점점 더 높은 영적 지위에 도달한다. 도덕성의 가장 고결한 선택은 가능한 최고의 가치를 선택하는 것이며, 이는 항상 하나님의 뜻을 행하는 것이다. 따라서 인간은 선택함으로써 위대해진다. 예루셈에서 가장 겸손한 시민이든, 유란시아에서 가장 미미한 인간이든 상관없다."}, {"ko": "강론", "en": "Homily", "src": "https://archive.org/download/urantia-devotion-2026-07-13-morning/homily.mp3", "text": "사랑하는 여러분, 오늘 아침 우리는 인간의 삶이 하나의 끊기지 않는 긴 사슬이라는 말씀 앞에 섭니다. 유란시아에서 보내는 이 짧은 시간은 그 사슬의 첫 번째 고리일 뿐입니다. 그러니 오늘 하루가 작고 평범해 보여도, 그것은 영원으로 이어지는 사슬의 소중한 한 고리입니다.\n\n말씀은 우리에게 무엇을 하느냐보다 어떻게 하느냐가 훨씬 더 중요하다고 일러 줍니다. 세상은 큰 업적과 눈에 보이는 보상을 칭송하지만, 정의로운 삶에는 물질적 보상이 따르지 않을 때가 많습니다. 그러나 내면의 성취에서 오는 깊은 만족은 그 어떤 외적 보상보다 큽니다. 아무도 보지 않는 자리에서 성실하게 살아낸 하루가, 온 우주가 기억하는 하루가 됩니다.\n\n하늘나라의 열쇠는 성실함, 더 큰 성실함, 그리고 더욱 깊은 성실함이라고 말씀은 선언합니다. 이 열쇠는 특별한 사람만의 것이 아닙니다. 우리 모두가 이미 손에 쥐고 있습니다. 우리는 날마다 반복되는 작은 선택을 통해 이 열쇠를 사용하고, 한 걸음씩 더 높은 영적 지위에 이릅니다.\n\n그리고 도덕성의 가장 고결한 선택은 언제나 가능한 최고의 가치, 곧 하나님의 뜻을 행하는 것입니다. 그러므로 사람은 선택함으로써 위대해집니다. 예루셈에서 가장 겸손한 시민이든, 이 땅에서 가장 미미해 보이는 사람이든, 하나님의 뜻을 향해 성실히 선택하는 그 순간 우리는 위대함에 참여합니다.\n\n오늘 하루, 큰일을 이루려 애쓰기보다 주어진 일을 성실히, 사랑으로 해 나가기를 바랍니다. 그 성실한 선택 하나하나가 여러분의 혼을 영원한 아름다움으로 짜 나갈 것입니다."}, {"ko": "노래", "en": "Song", "src": "https://archive.org/download/urantia-devotion-2026-07-13-morning/song.mp3", "text": "[1절]\n작은 하루의 첫 고리\n끊기지 않는 긴 사슬 되어\n무엇을 하든 어떻게 하든\n그 마음을 주께 드리네\n\n[후렴]\n성실함 더 깊은 성실함\n그 열쇠 내 손에 있네\n날마다 선택하며 오르리\n하나님의 뜻을 향하여\n\n[2절]\n보상 없어 보이는 길에도\n내면의 기쁨 넘쳐나네\n아무도 몰라도 하늘은 아네\n성실한 하루의 노래를\n\n[후렴]\n성실함 더 깊은 성실함\n그 열쇠 내 손에 있네\n날마다 선택하며 오르리\n하나님의 뜻을 향하여\n\n[브릿지]\n가장 낮은 자리에서도\n선택함으로 위대해지리\n최고의 가치를 택하는 손\n그 손을 주께 올리네"}, {"ko": "기도", "en": "Prayer", "src": "https://archive.org/download/urantia-devotion-2026-07-13-morning/prayer.mp3", "text": "사랑이 많으신 아버지 하나님,\n오늘 아침 저희를 부르시니\n감사드립니다.\n저희 삶이 끊기지 않는\n긴 사슬의 첫 고리임을\n기억하게 하소서.\n무엇을 하든지\n어떻게 하는지 살피며\n성실하게 살게 하소서.\n보이는 보상이 없어도\n내면의 기쁨으로\n만족하게 하소서.\n날마다 작은 선택 속에서\n아버지의 뜻을 택하여\n한 걸음씩 자라게 하소서.\n가장 낮은 자리에서도\n선택함으로 위대해지는\n그 은혜를 누리게 하소서.\n오늘 하루도\n성실함의 열쇠를 쥐고\n아버지께로 나아가게 하소서.\n예수님의 이름으로 기도드립니다.\n아멘."}];
const pane=document.getElementById('pane');
const tabsEl=document.getElementById('tabs');
const nowEl=document.getElementById('now');
const fill=document.getElementById('fill');
const timeEl=document.getElementById('time');
const pp=document.getElementById('pp');
const overlay=document.getElementById('overlay');
const audio=new Audio();
audio.preload="auto";
let idx=0, started=false;

// build tabs
SECTIONS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='tab'; b.innerHTML=s.ko+'<span class="en">'+s.en+'</span>';
  b.onclick=()=>{ if(!started){start(i);} else load(i,true); };
  tabsEl.appendChild(b);
});
const tabEls=[...tabsEl.children];

function renderText(i){
  const s=SECTIONS[i];
  let t=s.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(s.en==='Song'){ t=t.replace(/(\[[^\]]+\])/g,'<span class="marker">$1</span>'); pane.classList.add('song'); }
  else pane.classList.remove('song');
  pane.innerHTML=t; pane.scrollTop=0;
}
function fmt(t){ if(!isFinite(t)||t<0)t=0; const m=Math.floor(t/60),s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); }
function setIcon(p){ pp.innerHTML=p?'&#10073;&#10073;':'&#9654;'; }

function load(i, autoplay){
  idx=(i+SECTIONS.length)%SECTIONS.length;
  renderText(idx);
  nowEl.textContent=SECTIONS[idx].ko;
  tabEls.forEach((t,j)=>{ t.classList.toggle('active',j===idx); t.classList.toggle('done',j<idx); });
  audio.src=SECTIONS[idx].src; fill.style.width='0%'; timeEl.textContent='0:00 / 0:00';
  if(autoplay) audio.play().catch(()=>{});
}
audio.addEventListener('timeupdate',()=>{
  if(audio.duration){ fill.style.width=(audio.currentTime/audio.duration*100)+'%';
    timeEl.textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration); }
});
audio.addEventListener('ended',()=>{
  if(idx < SECTIONS.length-1){ load(idx+1,true); }
  else { setIcon(false); }   // 기도 끝: 정지 (반복 없음)
});
audio.addEventListener('play',()=>setIcon(true));
audio.addEventListener('pause',()=>setIcon(false));
audio.addEventListener('error',()=>{ timeEl.textContent='음성 없음'; });

function start(i){ started=true; overlay.style.display='none'; load(i||0,true); }
overlay.addEventListener('click',()=>start(0));
pp.addEventListener('click',()=>{ if(!started){start(0);return;} if(audio.paused)audio.play().catch(()=>{}); else audio.pause(); });
document.getElementById('next').addEventListener('click',()=>{ if(!started){start(0);return;} load(idx+1,true); });
document.getElementById('prev').addEventListener('click',()=>{ if(!started){start(0);return;}
  if(audio.currentTime>3) audio.currentTime=0; else load(idx-1,true); });
document.getElementById('progress').addEventListener('click',e=>{
  if(!audio.duration)return; const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; });
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();pp.click();}
  else if(e.code==='ArrowRight')document.getElementById('next').click();
  else if(e.code==='ArrowLeft')document.getElementById('prev').click();
});
// initial render (낭독)
renderText(0); tabEls[0].classList.add('active');
</script>
</body>
</html>

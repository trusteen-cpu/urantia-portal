<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 아침 묵상 2026-07-26 · 생수의 강</title>
<style>
  :root{
    --navy:#141b30; --navy2:#1f2a4a; --amber:#f0a840; --gold:#d9b04a;
    --cream:#f7f1e3; --ink:#e8e3d6; --dim:#a9b0c4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 620px at 82% -8%, rgba(240,168,64,.42) 0%, rgba(240,168,64,0) 62%),
      linear-gradient(180deg, #0e1426 0%, #141b30 38%, #24304f 72%, #3b3a52 100%);
    background-attachment:fixed;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .stars{position:fixed;inset:0;pointer-events:none;opacity:.55;}
  .stars i{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.6;}
  .sun{
    position:fixed; right:-90px; top:-90px; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(255,214,140,.55), rgba(240,168,64,.18) 45%, rgba(240,168,64,0) 70%);
    pointer-events:none;
  }
  .wrap{position:relative;max-width:820px;margin:0 auto;padding:28px 20px 120px;}
  header{text-align:center;padding:18px 0 10px;}
  header .kicker{font-size:.86rem;letter-spacing:.34em;color:var(--gold);}
  header h1{margin:.5rem 0 .3rem;font-size:1.9rem;color:var(--cream);font-weight:700;letter-spacing:.02em;}
  header .sub{color:var(--dim);font-size:.98rem;}
  header .rule{width:78px;height:2px;margin:16px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);}

  .menu{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0 18px;}
  .menu button{
    font-family:inherit;font-size:.95rem;color:var(--ink);
    background:rgba(255,255,255,.05);border:1px solid rgba(217,176,74,.45);
    border-radius:999px;padding:8px 18px;cursor:pointer;transition:.2s;
  }
  .menu button:hover{background:rgba(217,176,74,.16);}
  .menu button.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:700;}
  .menu button.off{opacity:.38;}

  .card{
    background:rgba(10,15,30,.42);
    border:1px solid rgba(217,176,74,.28);
    border-radius:18px;padding:26px 24px;margin-bottom:16px;
    backdrop-filter:blur(3px);
  }
  .card .label{
    display:inline-block;font-size:.78rem;letter-spacing:.28em;color:var(--gold);
    border:1px solid rgba(217,176,74,.5);border-radius:999px;padding:3px 12px;margin-bottom:14px;
  }
  .card.active{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,176,74,.25), 0 10px 40px rgba(0,0,0,.35);}
  .cite{color:var(--gold);font-size:.9rem;margin-bottom:10px;letter-spacing:.04em;}
  .body{font-size:1.09rem;line-height:2.05;color:var(--cream);}
  .body p{margin:0 0 1.1em;}
  .body p:last-child{margin-bottom:0;}
  .prayer .body{text-align:center;line-height:2.2;}
  .song .tag{color:var(--amber);font-size:.9rem;letter-spacing:.2em;margin:1.1em 0 .35em;}
  .song .tag:first-child{margin-top:0;}
  .song .body{text-align:center;line-height:2.1;}
  .songtitle{text-align:center;color:var(--cream);font-size:1.15rem;margin-bottom:6px;}

  .player{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(9,13,26,.94);border-top:1px solid rgba(217,176,74,.35);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  .player .inner{max-width:820px;margin:0 auto;}
  .bar{height:6px;background:rgba(255,255,255,.12);border-radius:6px;cursor:pointer;overflow:hidden;}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--amber));}
  .ctrls{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;}
  .ctrls .now{color:var(--gold);font-size:.9rem;min-width:96px;letter-spacing:.08em;}
  .ctrls .time{color:var(--dim);font-size:.82rem;margin-left:auto;font-variant-numeric:tabular-nums;}
  .btn{
    font-family:inherit;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid rgba(217,176,74,.4);border-radius:10px;
    padding:7px 13px;cursor:pointer;font-size:.92rem;transition:.15s;
  }
  .btn:hover{background:rgba(217,176,74,.18);}
  .btn.key{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700;}

  .overlay{
    position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(10,14,26,.96),rgba(30,26,46,.96));text-align:center;padding:24px;
  }
  .overlay .box{max-width:460px;}
  .overlay h2{color:var(--cream);font-size:1.5rem;margin:.2rem 0 .6rem;}
  .overlay p{color:var(--dim);line-height:1.9;font-size:.98rem;}
  .overlay .start{
    margin-top:22px;background:var(--gold);color:#1a1a1a;border:none;border-radius:999px;
    padding:14px 40px;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .hint{color:var(--dim);font-size:.82rem;text-align:center;margin-top:10px;line-height:1.7;}
  @media(max-width:520px){
    header h1{font-size:1.5rem;}
    .body{font-size:1.02rem;line-height:1.95;}
    .card{padding:20px 16px;}
    .ctrls .now{min-width:66px;font-size:.84rem;}
    .btn{padding:6px 10px;font-size:.86rem;}
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="sun"></div>

<div class="wrap">
  <header>
    <div class="kicker">URANTIA CORE TRUTH</div>
    <h1>오늘의 아침 묵상 2026-07-26</h1>
    <div class="sub">생수의 강 · 유란시아서 162:6.1</div>
    <div class="sub" style="font-size:.86rem;margin-top:6px;">제162편 초막절에서 · 생명의 물에 대한 설교</div>
    <div class="rule"></div>
  </header>

  <div class="menu" id="menu"></div>

  <div id="cards"></div>

  <div class="hint">
    스페이스바 재생·일시정지 &nbsp;|&nbsp; ← → 이전·다음 순서<br>
    반복 버튼을 누르면 반복 없음 → 전체 무한 반복 → 한 메뉴 무한 반복 으로 바뀝니다.
  </div>
</div>

<div class="player">
  <div class="inner">
    <div class="bar" id="bar"><div id="fill"></div></div>
    <div class="ctrls">
      <span class="now" id="now">낭독</span>
      <button class="btn" id="prev">◀ 이전</button>
      <button class="btn key" id="play">❚❚ 일시정지</button>
      <button class="btn" id="next">다음 ▶</button>
      <button class="btn" id="rep">반복: 전체</button>
      <button class="btn" id="mute">🔊</button>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="box">
    <div class="kicker" style="color:var(--gold);letter-spacing:.3em;font-size:.8rem;">URANTIA CORE TRUTH</div>
    <h2>오늘의 아침 묵상 2026-07-26</h2>
    <p>생수의 강 · 유란시아서 162:6.1<br><br>
       낭독 → 강론 → 노래 → 기도 순서로<br>자동으로 이어서 재생됩니다.</p>
    <button class="start" id="startBtn">묵상 시작하기</button>
  </div>
</div>

<audio id="au" preload="auto"></audio>

<script>

  "sermon": [

    "우리도 상징에 익숙합니다. 예배에 참석하고, 경전을 읽고, 옳은 말을 배웁니다. 그 모든 것이 귀합니다. 그러나 부어진 물이 제단에 남지 않듯, 형식만으로는 혼의 갈증이 채워지지 않습니다. 우리가 진실로 목말라하는 것은 하나님을 직접 아는 살아있는 체험입니다. 그 갈증은 부끄러운 것이 아니라, 아버지께서 우리 안에 심어 두신 초대장입니다.",
    "주목할 것은 그다음 말씀입니다. 예수께서는 이 물을 고인 웅덩이가 아니라 흘러나오는 강이라 하셨습니다. 받은 사람은 저수지가 아니라 통로가 됩니다. 진리의 영을 받은 사람에게서는 반드시 무언가가 흘러나갑니다. 오늘 내 곁의 지친 사람에게 건네는 한마디, 아무도 보지 않는 자리에서의 한 번의 친절, 그것이 바로 그 강이 흐르는 자리입니다.",
    "오늘 아침, 먼저 정직하게 인정합시다. 나는 목마르다고. 그 솔직한 고백에서 살아있는 물은 흐르기 시작합니다."
  ],
  "song": [
    "[1절]",
    "제단 위에 부어진 물은",
    "잠시 적시고 말라 버렸네",
    "해마다 되풀이한 그 상징 앞에",
    "내 마음은 여전히 목말랐네",
    "",
    "[후렴]",
    "목마른 자여 내게로 오라",
    "살아있는 물을 마시라",
    "내 안에 흐르는 진리의 영",
    "생수의 강이 되어 흐르네",
    "",
    "[2절]",
    "숨기지 않고 고백합니다",
    "나는 오늘도 목마릅니다",
    "세상의 잔으로 채우려던 밤들",
    "이제는 아버지께 나아갑니다",
    "",
    "[후렴]",
    "목마른 자여 내게로 오라",
    "살아있는 물을 마시라",
    "내 안에 흐르는 진리의 영",
    "생수의 강이 되어 흐르네",
    "",
    "[브리지]",
    "고이지 않게 하소서",
    "막히지 않게 하소서",
    "지친 이의 마른 땅으로",
    "오늘 나를 통해 흐르소서",
    "",
    "[후렴]",
    "목마른 자여 내게로 오라",
    "살아있는 물을 마시라",
    "내 안에 흐르는 진리의 영",
    "생수의 강이 되어 흐르네"
  ],
  "prayer": [
    "생명의 물을 주시는",
    "아버지 하나님,",
    "오늘 아침 제 마음의",
    "목마름을 숨기지 않고",
    "아버지 앞에 내어놓습니다.",
    "세상의 것으로 채우려다",
    "더 목말랐던 저를",
    "용서하여 주옵소서.",
    "예수님께서 부르신 그 자리로",
    "나아가 마시게 하시고,",
    "아버지의 진리의 영으로",
    "저를 가득 채워 주옵소서.",
    "채워 주신 것이 제 안에",
    "고이지 않게 하시고,",
    "오늘 만나는 사람들에게",
    "생수의 강으로 흐르게",
    "하여 주옵소서.",
    "지친 이에게 따뜻한 말로,",
    "외로운 이에게 조용한 곁으로",
    "흐르게 하여 주옵소서.",
    "아버지께서 주시는 물은",
    "결코 마르지 않음을",
    "오늘 하루 믿게 하시고,",
    "저의 작은 걸음마다",
    "그 강이 함께",
    "흐르게 하여 주옵소서.",
    "다시는 목마르지 않는",
    "그 사랑 안에",
    "머물게 하여 주옵소서.",
    "예수님의 이름으로",
    "기도드립니다."
  ]
};

const SEGS = [
  {key:"reading", label:"낭독", file:"https://archive.org/download/urantia-devotion-2026-07-26-morning/01_reading.mp3"},
  {key:"sermon",  label:"강론", file:"https://archive.org/download/urantia-devotion-2026-07-26-morning/02_sermon.mp3"},
  {key:"song",    label:"노래", file:"https://archive.org/download/urantia-devotion-2026-07-26-morning/03_song.mp3"},
  {key:"prayer",  label:"기도", file:"https://archive.org/download/urantia-devotion-2026-07-26-morning/04_prayer.mp3"}
];

/* 별 */
(function(){
  const box=document.getElementById("stars");
  let h="";
  for(let i=0;i<70;i++){
    const x=Math.random()*100, y=Math.random()*45, o=(Math.random()*0.5+0.2).toFixed(2);
    h+='<i style="left:'+x.toFixed(2)+'%;top:'+y.toFixed(2)+'%;opacity:'+o+'"></i>';
  }
  box.innerHTML=h;
})();

/* 본문 카드 */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildCards(){
  const wrap=document.getElementById("cards");
  let html="";

  html+='<section class="card" id="card-reading"><span class="label">낭독</span>'
      + '<div class="cite">유란시아서 '+esc(DATA.citation)+'</div>'
      + '<div class="body"><p>'+esc(DATA.reading)+'</p></div></section>';

  html+='<section class="card" id="card-sermon"><span class="label">강론</span><div class="body">'
      + DATA.sermon.map(p=>'<p>'+esc(p)+'</p>').join("")
      + '</div></section>';

  let songHtml="";
  DATA.song.forEach(function(line){
    const t=line.trim();
    if(!t){ return; }
    if(/^\[.*\]$/.test(t)){ songHtml+='<div class="tag">'+esc(t)+'</div>'; }
    else { songHtml+='<div>'+esc(t)+'</div>'; }
  });
  html+='<section class="card song" id="card-song"><span class="label">노래</span>'
      + '<div class="songtitle">「'+esc(DATA.songTitle)+'」</div>'
      + '<div class="body">'+songHtml+'</div></section>';

  html+='<section class="card prayer" id="card-prayer"><span class="label">기도</span><div class="body">'
      + DATA.prayer.map(l=>'<div>'+esc(l)+'</div>').join("")
      + '</div></section>';

  wrap.innerHTML=html;
}
buildCards();

/* 메뉴 */
const menu=document.getElementById("menu");
SEGS.forEach(function(s,i){
  const b=document.createElement("button");
  b.textContent=s.label;
  b.dataset.i=i;
  b.onclick=function(){ go(i,true); };
  menu.appendChild(b);
});

/* 재생기 */
const au=document.getElementById("au");
const fill=document.getElementById("fill");
const bar=document.getElementById("bar");
const nowEl=document.getElementById("now");
const timeEl=document.getElementById("time");
const playBtn=document.getElementById("play");
const repBtn=document.getElementById("rep");
const muteBtn=document.getElementById("mute");

let cur=0;
let repMode=1;            /* 0 없음, 1 전체 무한, 2 한 메뉴 무한 */
const missing={};         /* 파일 없음 표시 */
let started=false;

const REP_LABEL=["반복: 없음","반복: 전체","반복: 한 메뉴"];

function mark(){
  SEGS.forEach(function(s,i){
    const b=menu.children[i];
    b.classList.toggle("on", i===cur);
    b.classList.toggle("off", !!missing[s.key]);
    const c=document.getElementById("card-"+s.key);
    if(c) c.classList.toggle("active", i===cur);
  });
  nowEl.textContent=SEGS[cur].label;
}

function scrollTo(i){
  const c=document.getElementById("card-"+SEGS[i].key);
  if(c) c.scrollIntoView({behavior:"smooth", block:"start"});
}

function go(i, user){
  if(i<0) i=SEGS.length-1;
  if(i>=SEGS.length) i=0;
  cur=i;
  mark();
  if(user) scrollTo(i);
  au.src=SEGS[cur].file;
  au.load();
  const p=au.play();
  if(p && p.catch) p.catch(function(){ playBtn.textContent="▶ 재생"; });
}

function nextSeg(auto){
  if(repMode===2 && auto){ go(cur,false); return; }
  if(cur===SEGS.length-1){
    if(repMode===0 && auto){ au.pause(); playBtn.textContent="▶ 재생"; return; }
    go(0,false); scrollTo(0); return;
  }
  go(cur+1,false);
  if(auto) scrollTo(cur);
}

au.addEventListener("ended", function(){ nextSeg(true); });

au.addEventListener("error", function(){
  missing[SEGS[cur].key]=true;
  mark();
  if(!started) return;
  /* 파일이 없으면 다음 순서로 자동 건너뜀 (전부 없으면 멈춤) */
  const alive=SEGS.filter(function(s){ return !missing[s.key]; }).length;
  if(alive===0){ playBtn.textContent="▶ 재생"; return; }
  setTimeout(function(){ nextSeg(true); }, 200);
});

au.addEventListener("timeupdate", function(){
  if(!au.duration) return;
  fill.style.width=(au.currentTime/au.duration*100)+"%";
  timeEl.textContent=fmt(au.currentTime)+" / "+fmt(au.duration);
});
au.addEventListener("play", function(){ playBtn.textContent="❚❚ 일시정지"; });
au.addEventListener("pause", function(){ playBtn.textContent="▶ 재생"; });

function fmt(t){
  t=Math.floor(t||0);
  const m=Math.floor(t/60), s=t%60;
  return m+":"+(s<10?"0":"")+s;
}

bar.onclick=function(e){
  if(!au.duration) return;
  const r=bar.getBoundingClientRect();
  au.currentTime=(e.clientX-r.left)/r.width*au.duration;
};
playBtn.onclick=function(){ if(au.paused) au.play(); else au.pause(); };
document.getElementById("prev").onclick=function(){ go(cur-1,true); };
document.getElementById("next").onclick=function(){ go(cur+1,true); };
repBtn.onclick=function(){ repMode=(repMode+1)%3; repBtn.textContent=REP_LABEL[repMode]; };
muteBtn.onclick=function(){ au.muted=!au.muted; muteBtn.textContent=au.muted?"🔇":"🔊"; };

document.addEventListener("keydown", function(e){
  if(!started) return;
  if(e.code==="Space"){ e.preventDefault(); playBtn.onclick(); }
  else if(e.code==="ArrowRight"){ go(cur+1,true); }
  else if(e.code==="ArrowLeft"){ go(cur-1,true); }
});

document.getElementById("startBtn").onclick=function(){
  document.getElementById("overlay").style.display="none";
  started=true;
  go(0,false);
};

repBtn.textContent=REP_LABEL[repMode];
mark();
</script>
</body>
</html>

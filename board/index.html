<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>독자게시판 — 한국 유란시아서 독자회</title>
<meta name="description" content="한국 유란시아서 독자회 독자게시판 — 정회원이 글을 나누는 곳">
<script src="/auth.js"></script>
<script src="/home-button.js" defer></script>
<style>
:root{--navy:#17365D;--teal:#1F6D73;--gold:#B7791F;--crimson:#9E3D35;--ink:#20242e;--dim:#6b6f7d;--line:#e2ddd0;--cream:#faf8f3;--paper:#fffdf8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.6}
header{background:linear-gradient(160deg,#0f2f33 0%,#1F6D73 55%,#2f8a8f 100%);color:#f4f1e8;text-align:center;padding:40px 16px 28px}
header .rib{display:inline-block;border:1px solid rgba(232,196,121,.55);color:#e8c479;font-size:11px;letter-spacing:.24em;padding:4px 14px;border-radius:3px}
header h1{margin:10px 0 4px;font-size:27px}
header p{margin:0;color:#d3e6e6;font-size:14px}
.embed header{display:none}
main{max-width:780px;margin:-12px auto 40px;padding:0 16px}
.embed main{margin-top:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:0 1px 2px rgba(20,24,40,.05),0 6px 18px rgba(20,24,40,.06)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{flex:1;margin:0;font-size:18px;color:var(--navy)}
.btn{display:inline-block;padding:9px 16px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:700 14px/1.2 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn:hover{background:#185a5f}.btn:disabled{opacity:.6;cursor:wait}
.btn.line{background:#fff;color:var(--teal);border:1px solid var(--teal)}.btn.line:hover{background:#eef6f6}
.btn.red{background:#fff;color:var(--crimson);border:1px solid var(--crimson)}.btn.red:hover{background:#fbf0ef}
.btn.sm{padding:5px 10px;font-size:12.5px}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
ul.list a{display:flex;gap:10px;align-items:baseline;padding:12px 4px;color:var(--ink);text-decoration:none}
ul.list a:hover{background:var(--cream)}
ul.list .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul.list .c{color:var(--gold);font-weight:700;font-size:13px}
ul.list .m{color:var(--dim);font-size:12.5px;white-space:nowrap}
.new{display:inline-block;margin-left:4px;padding:0 5px;border-radius:4px;background:var(--crimson);color:#fff;font-size:10.5px;font-weight:700;vertical-align:2px}
.empty{padding:28px 0;text-align:center;color:var(--dim)}
.more{text-align:center;margin-top:14px}
.post h2{margin:0 0 6px;font-size:21px;color:var(--navy);line-height:1.45;word-break:keep-all}
.post .m{color:var(--dim);font-size:13px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.text{white-space:pre-wrap;word-break:break-word;margin:16px 0 4px;line-height:1.85}
.text a{color:var(--teal)}
.att{margin:14px 0 0;padding:12px;background:var(--cream);border-radius:10px}
.att .imgs{display:flex;flex-wrap:wrap;gap:10px}
.att .imgs a{display:block;max-width:100%}
.att .imgs img{display:block;max-width:100%;max-height:420px;border-radius:8px;border:1px solid var(--line)}
.att .fl{margin:8px 0 0;padding:0;list-style:none}
.att .fl li{margin:4px 0}.att .fl a{color:var(--teal);font-weight:600}
.att small{color:var(--dim)}
.up{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--paper)}
.up label.pick{display:inline-block;margin:0;padding:8px 14px;border-radius:8px;background:#fff;border:1px solid var(--teal);color:var(--teal);font-weight:700;cursor:pointer}
.up input[type=file]{display:none}
.up ul{list-style:none;margin:8px 0 0;padding:0}.up li{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:13.5px}
.up li img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.up li .x{margin-left:auto}
ul.list .a{color:var(--dim);font-size:13px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.cmts{margin-top:18px}
.cmts h3{margin:0 0 8px;font-size:15.5px;color:var(--navy)}
.cmt{padding:10px 0;border-top:1px solid var(--line)}
.cmt .h{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.cmt .h b{color:var(--ink)}
.cmt .h .x{margin-left:auto}
.cmt .text{margin:4px 0 0;line-height:1.7}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
label small{font-weight:400;color:var(--dim)}
input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:var(--paper);color:var(--ink)}
textarea{resize:vertical;min-height:220px;line-height:1.7}
.cform textarea{min-height:80px}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(183,121,31,.14)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.msg{margin-top:10px;font-size:14px;color:var(--crimson);min-height:1em}
.note{margin:14px 0 0;font-size:12.5px;color:var(--dim)}
.foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--dim)}
.foot a{color:var(--dim)}
dialog{width:min(380px,calc(100% - 24px));border:0;border-radius:12px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(13,23,48,.5)}
dialog h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
@media (max-width:560px){ul.list a{flex-wrap:wrap}ul.list .t{flex-basis:100%;white-space:normal}.row2{flex-direction:column;gap:0}}
</style>
</head>
<body>
<header data-into>
  <span class="rib">KOREAN URANTIA READERS</span>
  <h1>독자게시판</h1>
  <p>정회원이 서로 생각과 소식을 나누는 곳입니다</p>
</header>
<main><div class="card" id="view"><div class="empty">불러오는 중…</div></div>
<div class="foot">서로 존중하는 글을 부탁드립니다. 광고·비방 글은 지울 수 있습니다. · <a href="#" id="adm">관리자</a></div></main>


<script>
var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '' : 'https://urantia-members.trusteen.workers.dev';
var Q = new URLSearchParams(location.search), EMB = Q.get('embed') === '1';
if (EMB) document.documentElement.classList.add('embed');
var V = document.getElementById('view');
function adminKey(){ try { return sessionStorage.getItem('boardAdmin') || ''; } catch (e) { return ''; } }
var AU = window.URAuth;
function call(method, path, body){
  var h = AU.headers({ 'content-type': 'application/json' }), k = adminKey(); if (k) h['X-Admin-Key'] = k;
  return fetch(API + '/api/board' + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined })
    .then(function(r){ if (r.status === 401 && !adminKey() && AU.token()) { AU.clear(); location.reload(); } return r.json().catch(function(){ return { error: '서버 응답을 읽지 못했습니다.' }; }).then(function(j){ if (!r.ok && !j.error) j.error = '오류(' + r.status + ')'; return j; }); })
    .catch(function(){ return { error: '서버에 연결하지 못했습니다. 잠시 뒤 다시 해 주세요.' }; });
}
function href(p){ var s = new URLSearchParams(p || {}); if (EMB) s.set('embed', '1'); var q = s.toString(); return location.pathname + (q ? '?' + q : ''); }
function go(p){ history.pushState(null, '', href(p)); route(); window.scrollTo(0, 0); }
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  for (var k in attrs || {}) { if (k === 'text') e.textContent = attrs[k]; else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(function(c){ if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function nav(a, p){ a.setAttribute('href', href(p)); a.addEventListener('click', function(ev){ if (ev.ctrlKey || ev.metaKey) return; ev.preventDefault(); go(p); }); return a; }
function fmt(s){ var d = new Date(s), z = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '.' + z(d.getMonth() + 1) + '.' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
function isNew(s){ return Date.now() - new Date(s).getTime() < 86400000; }
function textNode(s){   // 글은 글자 그대로 보이고, 주소만 링크로 바꾼다
  var box = el('div', { class: 'text' }), re = /https?:\/\/[^\s<>"']+/g, last = 0, m;
  while ((m = re.exec(s))) { box.appendChild(document.createTextNode(s.slice(last, m.index)));
    box.appendChild(el('a', { href: m[0], target: '_blank', rel: 'nofollow noopener noreferrer', text: m[0] })); last = m.index + m[0].length; }
  box.appendChild(document.createTextNode(s.slice(last))); return box;
}
function showList(){
  V.innerHTML = '';
  var bar = el('div', { class: 'bar' }, [el('h2', { text: '글 목록' }), nav(el('a', { class: 'btn', text: '✏️ 글쓰기' }), { write: '1' })]);
  var ul = el('ul', { class: 'list' }), more = el('div', { class: 'more' });
  V.append(bar, ul, more);
  var load = function(cursor){
    more.innerHTML = '';
    call('GET', cursor ? '?cursor=' + encodeURIComponent(cursor) : '').then(function(j){
      if (j.error) { more.textContent = j.error; return; }
      if (!cursor && !j.rows.length) ul.appendChild(el('li', { class: 'empty', text: '아직 글이 없습니다. 첫 글을 써 주세요.' }));
      j.rows.forEach(function(r){
        ul.appendChild(el('li', {}, [nav(el('a', {}, [
          el('span', { class: 't' }, [r.t || '(제목 없음)', isNew(r.at) ? el('span', { class: 'new', text: 'N' }) : null]),
          r.a ? el('span', { class: 'a', text: '📎' }) : null,
          r.c ? el('span', { class: 'c', text: '[' + r.c + ']' }) : null,
          el('span', { class: 'm', text: (r.n || '') + ' · ' + fmt(r.at).slice(2, 10) })]), { id: r.id })]));
      });
      if (j.cursor) more.appendChild(el('button', { class: 'btn line', text: '더 보기', onclick: function(){ load(j.cursor); } }));
    });
  };
  load();
}

function showPost(id){
  V.innerHTML = '<div class="empty">불러오는 중…</div>';
  call('GET', '/' + encodeURIComponent(id)).then(function(p){
    V.innerHTML = '';
    if (p.error) { V.append(el('div', { class: 'empty', text: p.error }), el('div', { class: 'more' }, [nav(el('a', { class: 'btn line', text: '목록으로' }), {})])); return; }
    document.title = p.title + ' — 독자게시판';
    var post = el('div', { class: 'post' }, [el('h2', { text: p.title }),
      el('div', { class: 'm', text: p.name + ' · ' + fmt(p.at) + (p.edited ? ' (고침 ' + fmt(p.edited) + ')' : '') }), textNode(p.body), attBox(p.files)]);
    var acts = el('div', { class: 'acts' }, [
      nav(el('a', { class: 'btn line sm', text: '목록' }), {}),
      p.mine ? el('button', { class: 'btn line sm', text: '수정', onclick: function(){ showForm(p); } }) : null,
      p.mine ? el('button', { class: 'btn red sm', text: '삭제', onclick: function(){
        if (!confirm('이 글을 지울까요? 되살릴 수 없습니다.')) return;
        call('DELETE', '/' + id).then(function(j){ if (j.error) return alert(j.error); go({}); }); } }) : null]);
    var cm = el('div', { class: 'cmts' }, [el('h3', { text: '댓글 ' + p.comments.length })]);
    p.comments.forEach(function(c){
      cm.appendChild(el('div', { class: 'cmt' }, [el('div', { class: 'h' }, [el('b', { text: c.name }), fmt(c.at),
        c.mine ? el('button', { class: 'btn red sm x', text: '삭제', onclick: function(){
          if (!confirm('이 댓글을 지울까요?')) return;
          call('DELETE', '/' + id + '/c/' + c.cid).then(function(j){ if (j.error) return alert(j.error); showPost(id); }); } }) : null]), textNode(c.body)]));
    });
    var f = el('form', { class: 'cform' }), msg = el('div', { class: 'msg' });
    f.innerHTML = '<label>댓글 <small>(' + AU.name() + ' 님 이름으로 올라갑니다)</small></label><textarea name="body" maxlength="2000"></textarea>';
    var sb = el('button', { class: 'btn', text: '댓글 달기' }); f.append(el('div', { class: 'acts' }, [sb]), msg);
    f.onsubmit = function(ev){ ev.preventDefault(); msg.textContent = ''; sb.disabled = true;
      call('POST', '/' + id + '/c', { body: f.elements.body.value }).then(function(j){
        sb.disabled = false; if (j.error) { msg.textContent = j.error; return; } showPost(id); }); };
    cm.appendChild(f);
    V.append(post, acts, cm);
  });
}

function fileUrl(f){ return API + '/api/file/' + f.key.split('/').map(encodeURIComponent).join('/'); }
function kb(n){ return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
function attBox(files){
  if (!files || !files.length) return null;
  var imgs = files.filter(function(f){ return /^image\//.test(f.type); }), docs = files.filter(function(f){ return !/^image\//.test(f.type); });
  var box = el('div', { class: 'att' });
  if (imgs.length) box.appendChild(el('div', { class: 'imgs' }, imgs.map(function(f){
    return el('a', { href: fileUrl(f), target: '_blank', rel: 'noopener' }, [el('img', { src: fileUrl(f), alt: f.name, loading: 'lazy' })]); })));
  if (docs.length) box.appendChild(el('ul', { class: 'fl' }, docs.map(function(f){
    return el('li', {}, ['📎 ', el('a', { href: fileUrl(f), target: '_blank', rel: 'noopener', text: f.name }), ' ', el('small', { text: '(' + kb(f.size) + ')' })]); })));
  return box;
}
function upload(file){
  return fetch(API + '/api/board/upload', { method: 'POST', headers: AU.headers({ 'content-type': file.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(file.name) }), body: file })
    .then(function(r){ return r.json().catch(function(){ return { error: '올리지 못했습니다.' }; }); })
    .catch(function(){ return { error: '서버에 연결하지 못했습니다.' }; });
}

function showForm(p){      // p 가 있으면 고치기
  document.title = (p ? '글 수정' : '글쓰기') + ' — 독자게시판';
  V.innerHTML = '';
  var f = el('form'), msg = el('div', { class: 'msg' });
  f.innerHTML = '<label>제목</label><input type="text" name="title" maxlength="100">'
    + '<label>내용</label><textarea name="body" maxlength="10000"></textarea>'
    + '<div class="up"><label class="pick">📷 사진·파일 첨부<input type="file" multiple accept="image/*,.pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"></label>'
    + ' <small>사진(jpg·png·gif·webp)과 문서(pdf·hwp·doc·xls·ppt·txt·zip), 파일당 10MB, 10개까지</small><ul></ul></div>';
  var files = p && p.files ? p.files.slice() : [], busy = 0, ul = f.querySelector('.up ul'), inp = f.querySelector('input[type=file]');
  function drawFiles(){
    ul.innerHTML = '';
    files.forEach(function(x, i){
      ul.appendChild(el('li', {}, [/^image\//.test(x.type) ? el('img', { src: fileUrl(x), alt: '' }) : el('span', { text: '📎' }), x.name, el('small', { text: '(' + kb(x.size) + ')' }),
        el('button', { type: 'button', class: 'btn red sm x', text: '빼기', onclick: function(){ files.splice(i, 1); drawFiles(); } })]));
    });
  }
  drawFiles();
  inp.addEventListener('change', function(){
    var list = Array.prototype.slice.call(inp.files); inp.value = '';
    list.forEach(function(file){
      if (files.length + busy >= 10) { msg.textContent = '첨부는 10개까지입니다.'; return; }
      if (file.size > 10 * 1024 * 1024) { msg.textContent = file.name + ': 파일 하나는 10MB까지입니다.'; return; }
      busy++; sb.disabled = true; var li = el('li', { text: '⏳ ' + file.name + ' 올리는 중…' }); ul.appendChild(li);
      upload(file).then(function(j){
        busy--; li.remove(); if (!busy) sb.disabled = false;
        if (j.error) { msg.textContent = file.name + ': ' + j.error; return; }
        files.push(j.file); drawFiles();
      });
    });
  });
  var sb = el('button', { class: 'btn', text: p ? '고친 글 올리기' : '글 올리기' });
  var cancel = el('button', { type: 'button', class: 'btn line', text: '취소', onclick: function(){ p ? go({ id: p.id }) : go({}); } });
  f.append(el('div', { class: 'acts' }, [cancel, sb]), msg,
    el('p', { class: 'note', text: (p ? '' : AU.name() + ' 님 이름으로 올라갑니다. ') + '글은 정회원 모두가 볼 수 있습니다. 전화번호·주소 같은 개인 정보는 적지 마세요. 링크는 다섯 개까지 넣을 수 있습니다.' }));
  V.append(el('div', { class: 'bar' }, [el('h2', { text: p ? '글 수정' : '글쓰기' })]), f);
  if (p) { f.elements.title.value = p.title; f.elements.body.value = p.body; }
  f.onsubmit = function(ev){ ev.preventDefault(); msg.textContent = ''; sb.disabled = true;
    if (busy) { msg.textContent = '파일을 올리는 중입니다. 잠시만 기다려 주세요.'; sb.disabled = false; return; }
    call('POST', p ? '/' + p.id : '', { title: f.elements.title.value, body: f.elements.body.value, files: files }).then(function(j){
      sb.disabled = false; if (j.error) { msg.textContent = j.error; return; }
      go({ id: p ? p.id : j.id }); });
  };
}

function route(){
  var q = new URLSearchParams(location.search);
  document.title = '독자게시판 — 한국 유란시아서 독자회';
  if (q.get('id')) showPost(q.get('id')); else if (q.get('write')) showForm(null); else showList();
}
window.addEventListener('popstate', route);
document.getElementById('adm').addEventListener('click', function(ev){
  ev.preventDefault();
  if (adminKey()) { if (confirm('관리자 모드를 끌까요?')) { sessionStorage.removeItem('boardAdmin'); alert('관리자 모드를 껐습니다.'); } return; }
  var k = prompt('관리자 열쇠 (정회원 명단 화면과 같은 열쇠)'); if (!k) return;
  try { sessionStorage.setItem('boardAdmin', k); } catch (e) {}
  alert('이 창을 닫을 때까지 관리자 모드입니다. 모든 글과 댓글에 수정·삭제 단추가 보입니다.'); route();
});
if (AU.isMember() || adminKey()) route();
</script>
</body>
</html>

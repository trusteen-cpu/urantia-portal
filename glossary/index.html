<script>
var S=[{"name":"용어집","rows":[["Aaron","아론","모세의 형이자 이스라엘의 첫 제사장으로 레위 지파 출신이다."],["Abaddon","아바돈","‘멸망’을 의미하며, 파괴의 천사 또는 무저갱의 영으로 언급된다."],["abandonter","버림받은 존재","진화적 상승 과정에서 통합되지 못한 존재를 지칭한다."],["Abel","아벨","아담과 이브의 둘째 아들로, 믿음으로 제사를 드린 인물이다."],["Abila","아빌라","요단강 동편의 고대 도시로, 예수 시대에도 존재했다."],["Abimelech","아비멜렉","성경에서 여러 왕의 이름으로 등장하며 ‘나의 아버지는 왕이다’라는 뜻이다."],["Abiram","아비람","고라의 반역에 가담했다가 심판받은 구약의 인물이다."],["Abner","압넬","사울의 군대 장관으로, 다윗과의 권력 투쟁 중에 살해되었다."],["Abraham","아브라함","이스라엘 민족의 조상으로, 믿음의 조상이라 불린다."],["Abram","아브람","아브라함의 본래 이름으로, 나중에 ‘열국의 아버지’로 개명되었다."],["abridgment","요약본","긴 내용을 간략히 줄여 핵심만 정리한 문서나 기록이다."],["Absalom","압살롬","다윗의 아들로, 아버지에게 반역했으나 비참하게 죽음을 맞았다."],["absoluta","앱솔루타","파라다이스의 절대적 실체 중 하나로, 완전성과 무한성을 상징한다."],["absolute","절대","무한하고 한계가 없는 신적 실체를 의미한다."],["Absolutes of potentiality","가능성의 절대자들","아직 실제화되지 않았지만 무한한 가능성과 잠재 능력을 품고 있는 절대적 차원의 존재들을 가리키는 말"],["absolutum","절대소(absolutum)","무한 존재의 실제적 차원을 나타내는 개념이다."],["absonite","아절대","시간과 영원을 연결하는 초월적 실체의 영역을 의미한다."],["Absoniter","압소나이터","시간과 영원을 초월하여 활동하는 존재들을 뜻한다."],["absonitize","압소나이트화하다","시간-공간의 한계를 초월하도록 변형되거나 진보하는 과정을 의미한다."],["absonity","아절대성","시간과 공간의 제약을 초월하는 성질이나 특성을 뜻한다."],["Achaia","아가야","고대 그리스의 지역으로, 신약시대 바울의 선교지 중 하나이다."],["Acropolis","아크로폴리스","그리스 도시의 높은 요새로, 신전과 공공건물이 모여 있다."],["Actium","악티움","로마 내전의 결정적 해전이 벌어진 그리스 서해안 도시이다."],["actual","실재하는","현실 속에서 존재하거나 구체적으로 실현된 상태를 의미한다."],["Adam","아담","유란시아의 물질적 아들로, 인류의 생물학적 향상을 위해 파견된 존재이다."],["Adamite","아담족","아담과 이브의 후손으로, 진보된 문화와 유전적 품질을 가진 인류 집단이다."],["Adamson","아담손","아담과 한 인간 여성 사이에서 태어난 아들로, 중간 후손들의 조상이다."],["Adamsonite","아담손족","아담손의 후손들로, 안드족과 인간 사이의 혼혈 집단을 의미한다."],["Aden","아덴","예멘 남부의 항구 도시로, 고대 무역의 중심지였다."],["adjudicate","판결하다","법적이거나 도덕적 문제에 대해 판단하고 결정을 내리다."],["Adjuster","조절자","우주 아버지의 단편으로, 인간의 혼을 인도하는 내주 영이다."],["Adjuster fusion","조절자 융합","필사 인간의 영혼이 내주하는 생각조절자와 영원히 하나가 되어 더 이상 분리될 수 없는 단일한 불멸 존재로 통합되는 사건"],["Adjutant Mind-Spirits","보조 마음-영","무한 영이 진화 존재의 마음 발달을 위해 부여한 일곱 영이다."],["Adonai","아도나이","히브리어로 ‘주님’을 의미하며, 하나님을 존칭할 때 사용된다."],["Adonia","아도니아","다윗의 아들 중 하나로, 솔로몬과 왕위를 다투었다."],["Afghanistan","아프가니스탄","중앙아시아의 산악 국가로, 다양한 민족과 종교가 공존한다."],["Africa","아프리카","세계에서 두 번째로 큰 대륙으로, 인류의 기원지로 여겨진다."],["Agaman","아가만","유란시아서에 등장하는 고대 지도자 또는 영적 존재의 이름이다."],["Agni","아그니","힌두교의 불의 신으로, 제사의 중개자 역할을 한다."],["agondonter","아곤돈터","보이지 않는 신을 믿음으로 견디는 존재들을 뜻한다."],["Ahab","아합","이스라엘의 왕으로, 이세벨과 함께 바알 숭배를 장려했다."],["Ahura-Mazda","아후라 마즈다","조로아스터교의 최고신으로, 빛과 선의 신이다."],["Akkad","아카드","고대 메소포타미아의 도시로, 사르곤 왕국의 중심지였다."],["Alexander","알렉산더","마케도니아의 정복자로, 헬레니즘 문화를 전 세계에 확산시켰다."],["Alexandria","알렉산드리아","이집트의 항구 도시로, 고대 세계의 학문 중심지였다."],["Allah","알라","이슬람에서 유일신을 의미하는 아랍어로, 하나님을 지칭한다."],["Almighty","전능자","무한한 힘과 권능을 지닌 신을 표현하는 명칭이다."],["Almighty Supreme","전능 최상위","“진화하는 우주 전체의 창조적·경험적 힘이 집약되어 형성되는, 시간·공간에서 힘과 권능으로 나타나는 ‘최상존재의 전능한 면(권능 측면)"],["Alpheus","알패오","신약에서 여러 인물의 이름으로 등장하며, 예수의 제자들의 아버지 이름이다."],["Alvoring","알보링","유란시아서에 언급되는 초우주의 본부 세계 중 하나이다."],["Amadon","아마돈","루시퍼 반란 때 충성을 지킨 인간 영웅으로, 반역을 견뎌낸 상징적 인물이다."],["Amadonite","아마돈족","아마돈의 후손으로, 신앙과 충성의 전통을 계승한 집단이다."],["Amatha","아마타","고대 근동의 지역명 또는 도시 이름으로 전해진다."],["Amathus","아마투스","지중해의 섬 키프로스에 있던 고대 도시이다."],["Amaziah","아마샤","유다의 왕으로, 정의를 추구했으나 교만으로 인해 몰락했다."],["Amdon","암돈","유란시아서에 등장하는 초우주 인물 혹은 지역적 존재를 의미한다."],["Amenemope","아메네모페","고대 이집트의 지혜 문학 저자로, 잠언서에 영향을 끼쳤다."],["Amenhotep","아메노텝","이집트의 파라오 이름으로, 종교 개혁을 시도한 통치자도 있었다."],["America","아메리카","서반구 대륙으로, 현대 문명과 기술 발전의 중심지 중 하나이다."],["Amerindian","아메린디언","북미와 남미의 원주민 집단을 통칭하는 말이다."],["Amerinds","아메린드족","아메리카 대륙의 원주민들을 가리키는 또 다른 표현이다."],["Amida Buddha","아미타불","자비의 신으로 숭배되는 불교적 이상 존재로, 서방 극락세계의 주재자로 여겨지는 전통적 종교 개념"],["Ammonites","암몬족","이스라엘 근동의 민족으로, 롯의 후손으로 전해진다."],["Amorites","아모리인","고대 가나안 지역의 민족으로, 여러 왕국을 세운 인류 집단이다."],["Amos","아모스","구약의 예언자로, 정의와 공의를 외친 인물이다."],["Amosad","아모사드","유란시아서에 언급된 선지자적 교사로, 진리의 빛을 전한 존재이다."],["Anatolian","아나톨리아의","소아시아 지역과 관련된 지리적·문화적 개념이다."],["Anaxagoras","아낙사고라스","고대 그리스 철학자로, 우주에 ‘이성적 질서’가 존재한다고 주장했다."],["Anaxand","아낙산드","유란시아서에서 언급되는 고대 인물 혹은 상징적 존재이다."],["Ancients of Days","옛적부터 늘 계신 이들","각 초우주를 다스리며 심판과 행정 권한을 가진, 파라다이스 삼위일체가 직접 기원시킨 세 분의 공동 통치자.”"],["Andite","안드족","아담과 이브의 후손들이 섞여 형성된 인류 집단이다."],["Andon","안돈","최초의 인간 부부 중 남자로, 인류의 진화가 시작된 존재이다."],["Andonite","안돈족","안돈과 폰타의 후손으로, 원시 인류의 시조 집단이다."],["Andovontia","안도본티아","초우주의 행정관으로, 진화 행성을 감독하는 존재이다."],["Andrew","안드레","예수의 첫 번째 제자이자, 사도 베드로의 형이다."],["Andronover","안드로노버","우리 지역 우주 내의 성운으로, 태양계의 기원이 된 곳이다."],["Ang","앙","유란시아서에 언급된 고대 혈통 또는 문화적 집단의 이름이다."],["Angamon","앙가몬","유란시아서에 등장하는 초인적 존재로, 진리의 옹호자이다."],["Angel","천사","신의 사자로, 인간을 보호하고 인도하는 영적 존재이다."],["Angona","앙고나","유란시아서에 언급된 성운 또는 우주적 사건과 관련된 이름이다."],["animism","애니미즘","자연물에 영혼이 깃들어 있다고 믿는 원시적 신앙 형태이다."],["Anna","안나","신약에 등장하는 예언자 여인으로, 예수의 탄생을 증언했다."],["Annan","안난","유란시아서 또는 고대 역사에서 언급되는 왕이나 지역의 이름이다."],["Annas","안나스","대제사장으로, 예수의 재판에 관여한 인물이다."],["Annon","안논","유란시아서에서 언급되는 고대 인물 혹은 집단의 이름이다."],["Anova","아노바","유란시아서에 나오는 지역적 또는 상징적 존재의 이름이다."],["Ansie","안시에","유란시아서에서 언급되는 인물 혹은 상징적 존재의 이름이다."],["Antarctica","남극","지구 남극 대륙으로, 얼음으로 덮인 미개척의 지역이다."],["Antares","안타레스","전갈자리의 붉은 거성으로, 하늘에서 매우 밝게 빛난다."],["antecedent","선행하는","시간적으로 앞서거나 원인이 되는 것을 의미한다."],["antigravity","반중력","중력에 저항하거나 상쇄시키는 힘 또는 기술을 뜻한다."],["Antioch","안디옥","초기 기독교의 중심지로, 바울과 바나바의 선교가 시작된 곳이다."],["Antipatris","안디파트리스","팔레스타인 지역의 도시로, 로마시대 요새가 있었다."],["Antonia","안토니아","헤롯 대왕이 예루살렘에 세운 요새로, 로마 병영의 본거지였다."],["Anu","아누","수메르 신화의 하늘의 신으로, 최고신으로 여겨졌다."],["Aphrodite","아프로디테","그리스 신화의 사랑과 미의 여신으로, 로마의 비너스와 동일시된다."],["Apollo","아폴로","그리스의 음악과 예언의 신으로, 태양과 예술의 상징이다."],["apostate","배교자","신앙이나 충성을 버리고 진리를 떠난 자를 의미한다."],["apostle","사도","예수의 제자이자 복음을 전한 초기 기독교 지도자이다."],["Appalachian","애팔래치아","북미 동부의 산맥 지역으로, 문화적 다양성이 풍부한 곳이다."],["Appian Way","아피아 가도","고대 로마에서 가장 오래되고 중요한 군사·교역 도로로, 로마를 남쪽 브린디시움까지 연결한 대표적 포장도로"],["Aquila","아굴라","신약의 인물로, 바울과 함께 복음을 전한 동역자이다."],["Arabia","아라비아","서남아시아의 반도로, 고대 문명과 예언자들이 활동한 지역이다."],["Aram","아람","성경에서 시리아 지역을 가리키는 이름으로, 아람족의 조상이다."],["Aramaic","아람어","예수 시대에 사용된 언어로, 고대 근동의 공용어였다."],["Ararat","아라랏","노아의 방주가 머물렀다고 전해지는 산으로, 오늘날 터키 지역에 있다."],["Arbela","아르벨라","알렉산더 대왕과 다리우스가 싸운 고대 전투의 장소이다."],["Archangels","천사장들","하늘의 고위 사자로, 중요한 사명을 수행하는 천사 집단이다."],["archdeceiver","최대의 기만자","사탄 또는 루시퍼처럼 진리를 왜곡하는 존재를 의미한다."],["Archelais","아르켈라이스","팔레스타인의 고대 도시로, 헤롯 왕조와 관련이 있다."],["Archelaus","아르켈라오","헤롯 대왕의 아들로, 유대 지역을 통치했다."],["Architects of the Master Universe","주(主)우주 건축자들","주(主)우주의 전체 구조·설계·질서를 기획하고 감독하는, 파라다이스 존재들 중 가장 고유하고 높은 계층의 우주 설계자 집단"],["architectural spheres","건축 구체들","자연적으로 형성된 천체가 아니라, 특정 목적과 기능을 위해 신성한 존재들이 직접 설계·조성한 특별 제작 행성들"],["archrebel","대반역자","하나님에 반역한 최고 수준의 배교자를 의미한다."],["Ardnon","아드논","유란시아서에 언급되는 충성스러운 인간 협력자의 이름이다."],["Areopagus","아레오바고","고대 아테네의 의회가 열리던 언덕으로, 바울이 설교한 장소이다."],["Areopolis","아레오폴리스","요단 동편의 고대 도시로, 종교 중심지였다."],["Aristotle","아리스토텔레스","그리스 철학자로, 논리학과 형이상학의 기초를 세웠다."],["Arius","아리우스","예수의 신성을 부인한 초기 기독교 신학자이다."],["Armageddon","아마겟돈","최후의 영적 전쟁이 벌어진다고 예언된 종말의 장소이다."],["Armenia","아르메니아","고대 기독교 국가로, 세계 최초로 기독교를 국교로 채택했다."],["Aroer","아로엘","요단 동편의 고대 도시로, 이스라엘 지명 중 하나이다."],["Artemis","아르테미스","그리스 신화의 사냥과 순결의 여신이다."],["artisan","장인","손으로 물건을 만드는 숙련된 기술자를 의미한다."],["Aryan","아리아인","고대 인도-유럽계 민족을 가리키며, 문화 전파의 중심이었다."],["ascendant","상승하는","위로 향하거나 영적으로 진보하는 상태를 의미한다."],["ascender","상승자","진화와 신앙을 통해 신성한 수준으로 올라가는 존재이다."],["ascender-trinitized","상승자 삼위일체화된","필사 상승자들이 파라다이스에서 삼위일체화 행위를 통해 새롭게 창조해 낸, 독특한 기원과 기능을 가진 존재"],["ascending","상승 중인","영적 또는 존재적 발전의 과정에 있는 상태이다."],["Ascending Material Sons","상승하는 물질 아들들","아담·이브 계열의 물질아들들이 모론시아 상승 과정을 거쳐 영적 존재로 진보해 가는 상승 집단"],["Ascendington","어쎈딩톤","파라다이스 근처에 위치한 상승자들의 거주 행성이다."],["ascension","승천","하늘로 오르거나 신적 차원으로 들어가는 사건을 의미한다."],["Ashtoreth","아스다롯","고대 가나안의 다산과 사랑의 여신으로, 이스라엘에 영향을 주었다."],["Ashur","앗수르","앗시리아 제국의 수도이자, 그들의 주신의 이름이다."],["Ashurbanipal","아슈르바니팔","앗시리아 제국의 마지막 위대한 왕으로, 대도서관을 세웠다."],["Asmonean","하스모니안","유대 독립을 이끈 마카비 왕조의 또 다른 이름이다."],["Asoka","아쇼카","인도의 황제로, 불교를 인도 전역에 전파했다."],["Assigned Sentinels","지정 파수꾼들","최고 모론시아·영적 직무를 수행하며 우주 행정에서 특별 임무와 감찰 임무를 맡는, 삼위일체 기원 감시자 계열의 존재"],["Associate Inspectors","부(副) 감찰자들","각 지역우주의 모든 진화·행정 과정이 삼위일체의 법과 질서에 부합하는지 감독하기 위해, 초우주 본부에서 파견된 삼위일체 기원 감찰관"],["Associate Power Directors","부 동력 감독자","우주 에너지의 흐름·분배·안정을 실질적으로 관리하며, 감독권을 가진 고위 에너지 통제자들을 보좌하는 지역우주급 전능 에너지 행정자"],["Associate Registrars","부 등록자","우주의 생명·사건·인격·영적 성취 등을 정확히 기록·보관하도록, 상급 등록자들을 보조하는 전문 기록 행정 존재들"],["Associate Transcendental Master Force Organizers","부 초월 주(主) 힘 조직자","파라다이스 밖의 원(原)힘을 통제하고 조절하는 보조적 초월 존재로, 주(主)우주 전개 과정에서 물리적 우주의 기초를 준비하는 고위 우주-힘 조직자"],["associators","협력자들","함께 일하며 신적 사명을 보좌하는 존재들을 의미한다."],["Assuntia","어썬시아","유란시아서에 언급된 상승한 존재의 세계 또는 인물이다."],["Astarte","아스다르테","페니키아와 시돈에서 숭배된 여신으로, 아스다롯과 동일시된다."],["Athanasius","아타나시우스","예수의 신성을 옹호하며 삼위일체 교리를 확립한 교부이다."],["Athens","아테네","고대 그리스의 도시로, 철학과 민주주의의 발상지이다."],["Aton","아톤","이집트 태양신으로, 아케나톤 왕이 유일신으로 숭배했다."],["Attis","아티스","프리기아 신화의 부활과 생명의 신이다."],["Augustus","아우구스투스","로마 제국의 초대 황제로, 평화의 시대를 열었다."],["Australasian","오스트랄라시아","호주와 태평양 제도를 포함한 지역을 의미한다."],["automatism","자동행동","의식적 통제 없이 무의식적으로 이루어지는 행동이다."],["autorevelation","자기계시","하나님이 자신의 본성을 직접 드러내는 행위이다."],["Avalon","아발론","전설 속의 섬으로, 아서왕 전설에서 불사의 상징이다."],["Avonals","아보날 아들들","심판자이자 계시자로, 행성 섭리 시대에 임하는 신적 아들들이다."],["Azariah","아사랴","구약의 인물로, 다니엘의 친구이며 믿음으로 시험을 견뎌냈다."],["Baal","바알","가나안의 풍요와 폭풍의 신으로, 이스라엘의 신앙을 위협했다."],["Baalim","바알들","바알의 여러 지역적 형태로 숭배된 신들을 의미한다."],["Babel","바벨","인간이 하늘에 닿으려 탑을 쌓은 도시로, 언어 혼란의 상징이다."],["Bablod","바블로드","유란시아서에 언급된 바벨탑과 관련된 전설적 지역이다."],["Bablot","바블롯","고대 바벨탑 신화에서 유래된 또 다른 이름이다."],["Babylon","바빌론","고대 메소포타미아의 제국으로, 문화와 종교의 중심지였다."],["Badonan","바도난","유란시아서에서 안돈 후손들의 지도자로 언급되는 인물이다."],["Baptism","세례","신앙의 상징으로 물을 통해 정화와 헌신을 나타내는 의식이다."],["Barabbas","바라바","예수 대신 석방된 죄수로, 군중의 선택을 상징한다."],["Barak","바락","사사기 시대의 이스라엘 장군으로, 드보라와 함께 싸웠다."],["Barnabas","바나바","초대교회의 선교사로, 바울과 함께 복음을 전했다."],["Bartholomew","바돌로매","예수의 열두 사도 중 한 사람으로, 나다나엘과 동일시된다."],["Bartimeus","바디매오","맹인이었다가 예수의 은혜로 눈을 뜬 인물이다."],["Basques","바스크인","스페인과 프랑스 접경 지역의 고대 민족이다."],["Bathsheba","밧세바","다윗의 아내이자 솔로몬의 어머니이다."],["Bautan","바우탄","유란시아서의 전설적 인물로, 초기 문화 창시자 중 하나이다."],["Beelzebub","베엘제붑","악마의 우두머리로, 사탄과 동일시된다."],["Beeroth","브에롯","이스라엘의 고대 도시로, 기브온 근처에 위치했다."],["Beersheba","브엘세바","아브라함과 이삭이 거주한 남부 유대의 도시이다."],["Beirut","베이루트","레바논의 수도로, 고대 페니키아 도시의 후예이다."],["Beit Adis","베이트 아디스","유란시아서에 등장하는 고대 도시나 지역의 이름이다."],["Beit Jenn","베이트 젠","시리아의 산악 지역으로, 예수 시대에도 거주지가 있었다."],["Bel","벨","바빌론의 주요 신 중 하나로, 권능과 풍요를 상징했다."],["Bel-Marduk","벨-마르둑","고대 바빌로니아에서 창조와 질서의 신으로 숭배되던 마르두크를 가리키는 이름으로, 도시 바빌론의 주신(主神)으로 여겨진 존재"],["Belgium","벨기에","유럽의 서부 국가로, 문화와 정치의 중심지 중 하나이다."],["Benares","베나레스","인도의 성지로, 갠지스 강가의 불교와 힌두교 중심 도시이다."],["Berbers","베르베르인","북아프리카의 토착 민족으로, 고대부터 존재했다."],["Bernice","버니스","헤롯 아그리빠 2세의 누이로, 사도 바울과 대화한 인물이다."],["bestowal","증여","신적 존재가 자신을 인간에게 내어주는 행위이다."],["Beth-Marion","벧마리온","유란시아서에 언급되는 영적 공동체의 이름이다."],["Beth-Meon","벧므온","요단 동편의 고대 도시로, 이스라엘의 지경에 있었다."],["Beth-Nimrah","벧님라","요단 동편의 도시로, 르우벤 지파의 기업이었다."],["Beth-Peor","벧브올","요단 동편의 산으로, 모세가 죽기 전 머물렀던 곳이다."],["Beth-shean","벧산","이스라엘 북부의 도시로, 사울이 죽은 후 시신이 걸린 곳이다."],["Bethabara","베다바라","요단강 근처의 세례 장소로, 세례 요한이 활동하던 곳이다."],["Bethany","베다니","예루살렘 근처 마을로, 마르다와 마리아의 고향이다."],["Bethel","벧엘","‘하나님의 집’을 뜻하며, 야곱이 하나님을 만난 장소이다."],["Bethesda","베데스다","예루살렘의 연못으로, 병자들이 고침을 받던 곳이다."],["Bethlehem","베들레헴","예수의 탄생지로, 다윗의 고향이다."],["Bethpage","벳바게","예루살렘 근처의 마을로, 예수가 나귀를 얻은 곳이다."],["Bethsaida","벧새다","갈릴리 호수 근처의 마을로, 예수의 제자들이 태어난 곳이다."],["Bildad","빌닷","욥기의 친구 중 한 사람으로, 인간의 고난을 논의했다."],["Bithynia","비티니아","소아시아 북서부의 지역으로, 초대 교회가 세워졌다."],["Blackfoot","블랙풋","북아메리카 원주민 부족으로, 캐나다와 미국 북부에 거주한다."],["Bon","본 교","티베트의 전통 신앙으로, 불교 이전의 종교이다."],["Bosora","보소라","에돔의 고대 도시로, 성경에 자주 등장한다."],["Brahma","브라흐마","힌두교의 창조신으로, 삼위신 중 하나이다."],["Brahman-Absolute","절대 브라만","힌두 철학의 브라만 개념을 우주 절대의 차원에서 이해한 것으로, 모든 실체의 근원이며 무한·초월·절대성을 지닌 궁극적 실재를 가리키는 표현"],["Brahman-Narayana","브라만-나라야나","힌두 전통의 비인격적 절대(브라만)과 인격신(나라야나)을 결합해 ‘절대적 실재와 개인적 신성을 함께 지닌 최고 존재’로 이해한 종교적 개념"],["Brenner Pass","브레너 고개","알프스를 통과하는 고개로, 유럽 교통의 주요 통로이다."],["Bretons","브르타뉴인","프랑스 북서부 브르타뉴 지방의 민족 집단이다."],["Bright and Morning Stars","찬란한 새벽별","각 지역우주에서 ‘창조자 아들’의 첫 번째 독자적 창조물로 태어난, 그 우주의 최고 행정·조정·계시 사명을 맡는 으뜸 존재"],["Brilliant Evening Stars","찬란한 저녁 별들","지역우주의 가브리엘을 보좌하며 특별 사명·임무·계시 활동을 수행하도록 창조된, 네바돈에서 가장 아름답고 빛나는 고위 천사 계열"],["Buddha","부처","불교의 창시자 석가모니로, 깨달음을 통해 진리를 전했다."],["Buddhist","불교도","불교의 가르침을 따르는 사람을 의미한다."],["Bushmen","부시맨","남아프리카의 원주민으로, 사냥과 채집으로 생계를 유지했다."],["Busiris","부시리스","고대 이집트의 신화적 인물로, 오시리스의 도시로 알려진 장소의 이름이기도 하다."],["Caesar","카이사르","로마 제국의 황제를 상징하는 칭호로, 율리우스 카이사르에서 유래했다."],["Caesarea-Philippi","가이사랴-빌립보","갈릴리 북쪽 헤르몬산 기슭에 위치한 도시로, 헤롯 빌립이 로마 황제를 기려 재건한 유대-헬라 문화 중심지"],["Caiaphas","가야바","예수의 재판을 주도한 유대 대제사장이다."],["Cain","가인","성경에서 아벨을 죽인 첫 살인자로, 인간 죄의 상징으로 전해진다."],["Caleb","갈렙","이스라엘 정탐꾼 중 한 사람으로, 믿음으로 약속의 땅에 들어갔다."],["Caligastia","칼리가스티아","유란시아의 타락한 행성 영주로, 루시퍼 반란에 가담한 존재이다."],["Caligula","칼리굴라","로마의 폭군 황제로, 잔혹함과 광기로 악명 높았다."],["Calvary","골고다","예수가 십자가에 못 박힌 장소로, '해골의 곳'을 뜻한다."],["Cana","가나","예수가 첫 기적, 물을 포도주로 바꾼 사건이 일어난 갈릴리 마을이다."],["Canaan","가나안","이스라엘 백성이 차지한 약속의 땅으로, 고대 팔레스타인 지역이다."],["Cano","카노","유란시아서에 등장하는 선지자적 인물로, 진리 전파에 헌신했다."],["Capernaum","가버나움","예수의 주요 활동 무대로, 갈릴리 해변의 도시이다."],["Capitolium","카피톨리움","로마의 종교 중심지로, 주피터 신전이 있는 언덕이다."],["Capua","카푸아","고대 이탈리아의 도시로, 한니발이 주둔했던 곳이다."],["Carthage","카르타고","북아프리카의 고대 도시국가로, 로마와 세 차례 전쟁을 벌였다."],["Caspian","카스피","카스피해 지역으로, 유라시아 최대의 내해를 가리킨다."],["Caspin","카스핀","유란시아서에서 언급되는 초우주 행정 중심의 이름이다."],["Caucasoid","코카소이드","인류 인종 분류 중 백인계 인종을 뜻하는 용어이다."],["causality","인과성","원인과 결과의 법칙으로, 우주 질서의 근본 원리 중 하나이다."],["Cedes","세데스","유란시아서의 존재 혹은 거룩한 세계의 이름으로 언급된다."],["celestial","천상의","하늘에 속하거나 영적 영역에 속한 것을 의미한다."],["Celestial Artisans","천상의 예술가들","우주의 예술·음악·조형·상징·빛·색채 등을 창조하고 조율하는 ‘하늘의 예술가들’"],["celestial astronomers","천상의 천문학자들","우주 천체의 모든 물리 자료를 조사하고 보고하는 ‘하늘의 천문학자들’"],["Celestial Guardians","천상의 수호자들","모론시아·영적 진보자들을 보호하고 지도하며, 상승 존재의 안전과 성장을 돕는 고위 수호 사명자들"],["Celestial Overseers","천상의 감독자들","여러 천상 집단이 제 역할을 하도록 전체 흐름을 조정·감독하는 하늘의 총괄 관리자들"],["Celestial Recorders","천상의 기록자들","우주 전체의 공식 기록을 담당하는 하늘의 ‘정사(正史) 기록관’."],["celestial visitors","천상의 방문자들","한 우주의 본래 거주자가 아니면서 특정 임무·관찰·학습을 위해 다른 세계나 우주를 잠시 방문하는 다양 계층의 하늘 존재들."],["Celsus","켈수스","초기 기독교를 비판한 로마 철학자이자 문헌학자이다."],["Celta","켈트족","고대 유럽의 민족으로, 예술과 전설 문화가 풍부했다."],["Census Directors","인구조사 감독자들","우주 전체의 ‘의지(자유의지) 존재들’을 즉시·정확하게 계수하고 보고하는, 삼위일체 기원의 우주적 인구 집계자들."],["center-source","중심 근원","특정 실재나 기원이 처음으로 발원하고 중심적으로 유지되는 근원·중심 역할을 하는 신적 혹은 우주적 출처."],["Central Universe","중앙 우주","시간과 진화의 제약을 받지 않는, 완전한 원형(原型) 우주 — 하보나."],["centrum","중심체","우주 에너지나 영력의 초점이 되는 중심적 존재 또는 장소를 말한다."],["Chang","창","동양의 고대 인물 혹은 유란시아서에 언급된 지역 지도자이다."],["Charax","차락스","고대 메소포타미아의 항구 도시로, 무역 중심지였다."],["chazan","카잔","유대 회당에서 찬송과 기도를 인도하던 예배 지도자이다."],["Chedorlaomer","그돌라오멜","창세기에서 동방의 왕으로, 아브라함과 전투를 벌였다."],["Chemosh","그모스","모압족의 신으로, 인신 제사를 요구했던 우상으로 언급된다."],["cherubim","그룹들","하나님의 보좌를 수호하는 천상 존재로, 예언서와 계시에 자주 등장한다."],["Chorazin","고라신","예수께서 기적을 행하셨으나 회개하지 않은 갈릴리 마을이다."],["Christ","그리스도","‘기름 부음 받은 자’를 뜻하며, 예수에게 붙여진 구세주의 칭호이다."],["Christ Michael","그리스도 미가엘","예수로 세상에 왔던 네바돈 창조자 아들의 공식 칭호"],["Christian","그리스도인","예수를 그리스도로 믿고 따르는 신앙인을 말한다."],["chronoldek","크로놀덱","유란시아서에 언급된 초우주의 시간 관리 존재이다."],["Chuza","쿠자","헤롯의 청지기이자 예수를 믿은 요안나의 남편이다."],["Cicero","키케로","로마의 철학자이자 정치가로, 웅변술과 윤리학에 기여했다."],["circle of eternity","영원의 순환","시간의 시작과 끝이 존재하지 않는, 파라다이스-하보나의 영원성 구조를 상징하는 끝없는 신성한 순환"],["circuit","회로","에너지나 영적 통로의 순환 구조를 의미한다."],["Circuit Regulators","회로 조절자","우주 전체의 에너지·마음·영 회로가 올바르게 흐르도록 조정·안정시키는 고위 기술적 통제 존재들"],["circular-gravity","순환 중력","우주의 기본 구조를 동심원 형태로 잡아주는 ‘파라다이스 절대 중력’의 원형(원둘레) 작용"],["Claudia Procula","클라우디아 프로쿨라","예수를 해치지 말라고 남편 빌라도에게 말했던 로마 총독의 아내"],["Claudius","클라우디우스","로마의 황제로, 행정 개혁과 영토 확장을 이끌었다."],["Clement","클레멘트","초기 교회의 지도자이자 로마의 교황으로, 신앙 서신을 남겼다."],["Cleopas","클레오파","예수 부활 후 엠마오 길에서 그를 만난 제자 중 한 사람이다."],["Cloa","클로아","유란시아서에서 등장하는 여인 또는 신앙적 인물의 이름이다."],["Clopas","클로파","요한복음에 언급된 마리아의 남편으로 전해진다."],["Coabsolute","동(同)절대","절대자들과 협력하여 일하는 신적 실체를 의미한다."],["cocreative","공창조적","하나님과 함께 창조 행위에 참여하는 존재적 성격을 뜻한다."],["Combined Controllers","통합 통제자","여러 에너지 조절 기술을 동시에 다루며, 우주 에너지의 흐름을 현장에서 직접 관리하는 통합형 물리 컨트롤러들."],["Confucius","공자","중국의 사상가로, 도덕과 인(仁)을 강조한 유교의 창시자이다."],["Conjoint Actor","공동 행위자","삼위일체의 제3위격으로, 무한한 영을 의미한다."],["Constantine","콘스탄티누스","로마 황제로, 기독교를 공인하고 니케아 공의를 주재했다."],["Constellation","별자리","우주의 구역 단위로, 여러 체계(system)를 포함한다."],["Constellation Centers","별자리 중심들","각 성좌(Constellation)의 행정·교육·영적 감독이 이루어지는 중심 세계와 그 부속 구체들로 구성된 성좌의 본부 체계."],["Constellation Univitatia","별자리 유니비타티아","성좌(100개의 체계로 이뤄진 행정 구역)의 본부 세계에서 사는, 그 성좌만의 고유 주민들"],["Consummator of Universe Destiny","우주 운명의 완성자","무한의 차원에서 우주들의 최종 성취·완성·궁극적 결말을 대표하는, 실체화 이전의 절대·신비적·파라다이스적 궁극 실재"],["continuum","연속체","단절 없이 연결된 존재나 현상의 흐름을 의미한다."],["Corinth","고린도","그리스의 도시로, 바울이 교회를 세운 곳이다."],["Cornelius","고넬료","로마의 백부장으로, 이방인 최초의 세례자이다."],["Corps of Conjoint Trinitized Finaliters","공동 삼위일체화 최종자단","삼위일체가 친히 낳은 존재들로 구성된, 우주의 가장 높은 봉사 단위 중 하나인 ‘삼위일체화 최종군단"],["Corps of Havona Finaliters","하보나 최종자단","하보나에서 태어난 존재들로 구성된, 파라다이스-영원 봉사를 담당하는 최종 단계의 하늘 군단"],["Corps of Mortal Finaliters","필사 최종자단","조절자 융합으로 불멸 존재가 된 인간들이 파라다이스에서 결성하는 최정예 영원 봉사 군단"],["Corps of Paradise Finaliters","파라다이스 최종자 군단","파라다이스의 고유 존재들이 미래 우주의 최종 사명을 위해 조직된, 삼위일체와 협력하는 최고 계층의 파라다이스 최종 봉사 군단"],["Corps of Permanent Citizenship","영구 시민권 군단","어떤 우주나 본부 세계에 ‘영원히 거주하도록 임명된’ 상주 시민 군단"],["Corps of the Finality","최종자 군단","파라다이스에 도달해 영원한 사명을 준비하는 최종 완성 존재들의 군단으로, 우주 미래 시대의 최고 봉사를 맡도록 조직된 최정예 집단"],["Corps of Transcendental Finaliters","초월 최종자단","필사자나 천사가 아니라, 태초부터 ‘초월 존재’로 창조된 파라다이스 초월자들이 구성한 최고의 초월 사역 군단"],["Corps of Trinitized Finaliters","삼위일체화 최종자 군단","삼위일체에 의해 직접 혹은 간접적으로 생겨난 존재들이 모여, 우주의 최종 사명을 맡도록 조직된 ‘삼위일체화된 최종 봉사 군단"],["Corps of Unrevealed Sons of Destiny","드러나지 않은 운명의 아들단","파라다이스 최종군단 중에서도 그 기원·정체·사명이 공개되지 않은, 미래 우주 시대를 위한 비공개 고위 아들 군단"],["cosmic-force","우주력","우주 전반에 작용하는 기본적 에너지 또는 물리적 힘이다."],["cosmic-mind","우주 마음","모든 창조체의 의식적 기능을 통합하는 우주적 사고 능력이다."],["courtesy colonies","우대 거류지","본부 세계를 방문하는 외부 존재들이 잠시 머물 수 있도록 마련된 ‘손님용 천상 거주 구역"],["Created Citizens of Paradise","파라다이스의 창조된 시민들","파라다이스에서 직접 창조되어, 그곳의 영원한 주민으로 존재하는 본래적·창조적 기원의 파라다이스 시민들"],["Creative Daughter","창조적 딸","한 지역우주에서 ‘아버지 역할’을 하는 창조자 아들의 자녀로 태어난, 그 우주만의 특별한 딸 존재들"],["Creative Spirit","창조 영","한 지역우주에서 ‘어머니 역할’을 하며 생명 부여·보호·지도·사명을 담당하는, 무한 영의 딸이자 창조자 아들과 함께 우주를 공동 창조하는 신성한 영"],["Creator","창조자","우주의 창조 행위를 수행하는 신적 존재 또는 창조 아들을 의미한다. 우주 아버지(하나님)를 가리킬 때만 '창조주'로 쓴다."],["Creator personalities","창조자 인격들","신성과 창조 능력을 지니며 우주에 생명·지능·계획을 부여하는, 창조적 기원을 가진 고위 인격 존재들"],["Creator Son","창조자 아들","파라다이스 아버지와 영원 아들로부터 기원하여 한 지역우주를 창조·통치하도록 파견된, 예수와 같은 미가엘 계열의 신적 아들"],["creature-trinitized","창조체 삼위일체화","두 창조체의 의지로 새로운 삼위일체화 존재가 된 상태이다."],["Crispus","크리스포","고린도 회당의 지도자였으며, 바울에게 세례를 받았다."],["Cro-Magnon","크로마뇽인","현대 인류와 거의 동일한 체격과 두뇌를 가진 초기 상부 구석기 시대의 유럽 인류(호모 사피엔스 사피엔스)의 대표 유형"],["crucifixion","십자가형","죄인을 십자가에 매다는 사형 방식으로, 예수의 죽음을 의미한다."],["cruse","유병","기름이나 액체를 담는 작은 항아리이다."],["cultism","사교주의","극단적이고 폐쇄적인 종교 집단이나 우상 숭배를 의미한다."],["Custodians of Records on Paradise","파라다이스 기록의 관리자들","파라다이스 기록의 관리자들"],["Cuthites","쿠스인","사마리아에 정착한 혼혈 민족으로, 북왕국 이스라엘의 후손이다."],["Cutites","쿠티인","고대 메소포타미아의 부족으로, 아카드 근방에 거주했다."],["Cybele","키벨레","고대 아나톨리아의 대지의 여신으로, 생명과 풍요의 상징이다."],["Cymboyton","심보이톤","유란시아서의 학자이자 철학자로, 진리의 연합을 설파했다."],["Cynic","견유학파","자연과 단순함을 강조한 고대 그리스 철학 학파의 구성원이다."],["Cyprus","키프로스","지중해의 섬나라로, 바울의 선교지 중 하나이다."],["Cyrene","구레네","북아프리카의 도시로, 시몬이 예수를 도운 곳이다."],["Cyrus","고레스","페르시아의 왕으로, 유대인 포로 귀환을 허락한 인물이다."],["Dagon","다곤","블레셋의 곡식과 풍요의 신으로, 우상 숭배의 상징이다."],["Dalamatia","달라마시아","유란시아의 최초 행성 수도로, 칼리가스티아 행정부가 있던 곳이다."],["Daligastia","달리가스티아","칼리가스티아의 부관으로, 반란에 동참한 존재이다."],["Damascus","다마스커스","고대 시리아의 수도로, 바울의 회심 사건이 일어난 도시이다."],["Dan","단","야곱의 아들 중 하나로, 이스라엘 열두 지파 중 하나의 조상이 되었다."],["Daniel","다니엘","구약의 예언자로, 바빌론에서 신앙으로 승리한 인물이다."],["Danite","단 지파인","단 지파에 속한 이스라엘 사람을 의미한다."],["Danubian","도나우 지역의","유럽의 도나우 강 유역에 관련된 지리적 명칭이다."],["Daphne","다프네","그리스 신화의 요정으로, 월계수로 변한 이야기로 유명하다."],["David","다윗","이스라엘의 위대한 왕으로, 메시아의 조상이다."],["David Zebedee","다윗 세베데","예수의 제자 요한·야고보의 동생으로, 갈릴리에서 예수 사역 기간 동안 비밀 연락망과 지원 조직을 운영하며 사도들을 실제적으로 도운 핵심 조력자"],["dawn of eternity","영원의 여명","영원 세계에서 ‘처음’이란 개념을 인간이 이해하도록 표현한 상징적 새벽."],["Daynal","데이날 아들","유란시아서의 계시적 아들 계열로, 진리의 증여자이다."],["Deborah","드보라","이스라엘의 여사사로, 바락과 함께 승리를 이끈 인물이다."],["Decapolis","데가볼리","로마 제국의 열 개 도시 연맹으로, 예수의 활동 지역 중 하나이다."],["deification","신화(神化)","인간이나 존재가 신적 상태로 승화되는 과정이다."],["deified reality","신성화된 실체","신적 성질이 스며 있거나 신격(Deity)과 직접 연관되어 있는 실체—즉 하나님과 본질적으로 연결된 모든 실체."],["deify","신으로 만들다","존재를 신적 차원으로 높이는 행위를 의미한다."],["Deity","신","신성을 지닌 존재 또는 신격 전체를 의미한다."],["Deity Absolute","신 절대자","신성 안에 존재하는 모든 잠재적 가능성과 미래적 신성한 성장을 무한한 형태로 품고 있는 ‘신성 잠재의 절대 저장소"],["Deity unity","신적 통일","하나님 아버지·아들·영을 포함한 모든 신이 본질·목적·의지에서 완전한 하나로 작용하는 신성의 통일"],["demortalizing","비필사화","필사자가 영원한 존재로 변화되는 과정을 의미한다."],["descender","하강자","높은 차원에서 낮은 세계로 내려온 신적 존재를 뜻한다."],["Descending Orders","하강 계층들","파라다이스 또는 높은 영적 차원에서 기원하여 아래 우주 수준으로 내려오며 봉사하는, ‘위에서 아래로’ 흐르는 신성·천상 존재들의 계열"],["Descending Sons","하강하는 아들들","파라다이스 또는 높은 신성 차원에서 기원하여, 아래 우주로 내려와 통치·심판·계시·봉사를 수행하는 ‘하향(下向) 기원’의 신성한 아들 계열"],["destiny","운명","개인의 존재적 목적과 우주 계획 속의 필연적 귀결을 의미한다."],["Destiny Guardians","운명의 수호자들","필사자가 조절자와 영혼의 완전한 융합을 향해 나아가도록 개인적으로 배정되어 평생 보호·인도하는 가장 높은 계열의 수호 세라핌"],["destiny-heaven","운명의 천국","필사자가 조절자와 융합해 최종 영적 운명을 성취한 뒤 머물게 되는, 파라다이스 상승 여정의 최종 목표이자 영원한 천상 목적지"],["Deuteronomy","신명기","모세오경의 다섯째 책으로, 율법의 반복과 교훈을 담고 있다."],["Didymus","디두모","‘쌍둥이’라는 뜻으로, 사도 도마의 또 다른 이름이다."],["Dilmat","딜마트","유란시아서에서 언급된 고대 문명 중심지의 이름이다."],["Dilmun","딜문","고대 수메르 전설의 낙원으로, 인류 문명의 기원지로 여겨진다."],["Diogenes","디오게네스","견유학파의 철학자로, 단순한 삶과 진실을 추구했다."],["Dion","디온","그리스의 철학자이자 플라톤의 제자로 알려져 있다."],["Dionysus","디오니소스","그리스 신화의 포도주와 축제의 신이다."],["dis-Adjustered","조절자 비보유자","생각조절자가 더 이상 내주하지 않는 상태, 즉 조절자가 떠나서 인간 마음과의 내적 연결이 끊어진 상태"],["disciples","제자들","스승의 가르침을 따르는 이들로, 특히 예수의 추종자들을 뜻한다."],["dispensation","섭리 시대","유란시아서에서 특정 신적 행정 기간을 의미한다."],["dispensational classes","섭리 시대별 계층들","한 시대가 끝날 때(세대적 심판·dispensation) 필사자들이 영적 상태와 진보에 따라 나뉘는 등급"],["dissociators","분리자들","통합된 힘이나 존재를 분리시키는 초우주의 존재이다."],["Dium","디움","요단 동편의 도시로, 데가볼리 연맹 중 하나였다."],["Dives","디베스","부자와 나사로 비유에 나오는 부자의 이름이다."],["divine","신성한","하나님 또는 신의 본성에 속하는 것을 의미한다."],["Divine Counselors","신성한 조언자들","파라다이스 삼위일체가 기원시킨 세 가지 삼위일체 기원 고위 존재들 중 하나로, 초우주 전역에서 신성한 지혜와 하나님의 뜻을 해석·전달하는 최고 계층의 조언자"],["Divinington","디비닝턴","파라다이스의 거룩한 세계 중 하나로, 생각 조절자들의 본향이다."],["divinity","신성","신적인 본질, 즉 절대적 선과 완전함을 의미한다."],["Dorcas","도르가","초대 교회의 여신도로, 선행과 자선으로 유명하며 베드로에 의해 부활하였다."],["Dravidian","드라비다인","인도 남부의 원주민 계통으로, 고대 인더스 문명과 관련된 민족이다."],["dual-origin beings","이중 기원 존재들","두 서로 다른 기원 또는 두 상위 존재의 공동 작용으로 태어나는 존재들로, ‘이중 기원’을 가진 창조물"],["dualism","이원론","우주나 존재를 선과 악, 정신과 물질처럼 두 원리로 설명하는 철학적 사상이다."],["dualities","이중성들","서로 대립되거나 상보적인 두 속성이나 원리를 의미한다."],["Dyaks","다약족","보르네오 섬의 토착민으로, 고대 부족적 사회 구조를 유지한 민족이다."],["Dyaus Pitar","디아우스 피타르","고대 인도-유럽 신화의 하늘의 아버지로, 제우스와 동일 기원이다."],["Dyaus-Zeus","디아우스-제우스","인도·이란계(베다) 신 ‘디야우스 피타르(Dyaus Pitar)’가 그리스 세계에서 ‘제우스(Zeus)’로 발전한 동일 어원적 하늘신 개념"],["Ebal","에발","이스라엘의 언약 산 중 하나로, 저주의 상징으로 사용되었다."],["Eber","에벨","셈의 후손으로, 히브리 민족의 조상으로 여겨진다."],["ebullition","분출","내부의 에너지나 감정이 강하게 터져 나오는 현상을 의미한다."],["Eden","에덴","하나님이 인간을 처음 거하게 하신 낙원으로, 상징적 기원의 장소이다."],["Edentia","에덴시아","유란시아서에서 지역체계의 본부로, 아름다운 세계로 묘사된다."],["Edrei","에드레이","바산 왕 옥이 다스리던 고대 도시로, 요단 동편에 위치하였다."],["ego-entity","자아 실체","지속적 자각과 의지를 가진 개인적 ‘나’의 중심, 즉 인격의 자기의식 단위"],["Egypt","이집트","고대 나일강 문명의 중심지로, 인류 역사에서 중요한 역할을 했다."],["El Elyon","엘 엘리온","지극히 높으신 하나님’이라는 의미의 고대 셈족·히브리계 칭호로, 초월적 최고신을 가리키는 명칭"],["El Shaddai","엘 샤다이","전능하신 하나님’ 또는 ‘산(山)의 하나님)’으로 불리던 고대 히브리·셈족의 보호신적·어머니적 속성을 지닌 하나님 칭호"],["Elam","엘람","메소포타미아 동쪽의 고대 왕국으로, 성경에 자주 등장한다."],["Elealah","엘르알레","요단 동편 모압 지역의 도시로, 예언자들이 언급한 곳이다."],["electron","전자","음전하를 가진 기본 입자로, 모든 물질의 구성 요소 중 하나이다."],["Eleusinian","엘레우시스의","그리스의 신비 종교 의식인 엘레우시스 제전과 관련된 것을 의미한다."],["Elihu","엘리후","욥기의 등장 인물로, 하나님의 공의를 논한 젊은 발언자이다."],["Elijah","엘리야","구약의 예언자 중 한 사람으로, 불수레를 타고 하늘로 올라간 인물이다."],["Elijah Mark","엘리야 마가","유란시아서에서 ‘마가복음’을 기록한 마가를 부를 때 사용하는 이름—엘리야 가문의 젊은 제자 마가"],["Eliphaz","엘리바스","욥의 친구로, 고난의 원인을 인간의 죄로 설명하였다."],["Elisha","엘리사","엘리야의 후계자이자 이스라엘의 선지자로, 많은 기적을 행했다."],["Elizabeth","엘리사벳","세례 요한의 어머니로, 마리아의 친척이다."],["Ellanora","엘라노라","유란시아서에 등장하는 상징적 여성 인물 또는 고귀한 존재를 의미한다."],["Elman","엘만","유란시아서의 기록자 혹은 초우주 행정 존재 중 하나로 언급된다."],["Eloah","엘로아","히브리어로 하나님을 의미하는 단어의 단수형이다."],["Elohim","엘로힘","‘하나님들’을 의미하는 복수형으로, 창조주로서의 신을 지칭한다."],["Elyonist","엘리오니스트","지극히 높으신 하나님(엘 엘리온)을 숭배한 고대 신앙인들을 의미한다."],["emergent energy","발현 에너지","우주의 비활성 잠재 에너지가 조직되고 활성화되어 물질적·우주적 형태로 전개되기 시작하는 ‘출현 단계의 에너지’"],["Emmaus","엠마오","예수 부활 후 제자들이 예수를 만난 곳으로 기록된 마을이다."],["En-Gannim","엔가님","이스라엘의 도시로, ‘정원의 샘’을 의미한다."],["Endantum","엔단툼","유란시아서에 나오는 영적 중심 세계의 이름이다."],["Endor","엔돌","구약에서 사울이 신접한 여인을 찾아갔던 고대 도시이다."],["energy","에너지","운동, 열, 빛 등 모든 물리적 작용의 근원적 힘을 의미한다."],["Energy Transformers","에너지 변형자","우주 에너지의 형태와 강도를 조절하여 다른 계층의 존재나 물질 세계가 사용할 수 있도록 변환·중재하는 고도의 힘-조정 존재들"],["Energy Transmitters","에너지 전송자","장거리 우주 회로와 공간 경로를 따라 에너지를 정확히 전달·방향화하는, 에너지 흐름의 전송을 전문으로 담당하는 고급 존재들"],["Engedi","엔게디","유대 광야의 오아시스로, 다윗이 사울을 피한 장소이다."],["Enoch","에녹","하나님과 동행하다가 죽음을 보지 않고 하늘로 올라간 인물이다."],["Enos","에노스","셋의 아들로, ‘사람들이 여호와의 이름을 부르기 시작한’ 시기의 인물이다."],["Ensa","엔사","유란시아서에서 시간과 공간을 초월한 초우주의 존재이다."],["enseraphim","엔세라핌","유란시아서의 특별한 천사 계열로, 상급 사명자들이다."],["Enta","엔타","유란시아서에서 신적 봉사를 담당하는 존재의 이름으로 등장한다."],["Ephesians","에베소서","신약성서의 바울 서신 중 하나로, 교회의 연합을 강조한다."],["Ephesus","에베소","소아시아의 도시로, 초기 기독교의 중요한 중심지였다."],["Ephraim","에브라임","요셉의 아들로, 북이스라엘의 대표 지파가 되었다."],["Epicurean","에피쿠로스 학파","쾌락을 삶의 목적이라 본 고대 그리스 철학 학파이다."],["Epistles","서신서","사도들이 교회나 개인에게 보낸 편지를 의미하며, 신약의 주요 구성 요소이다."],["epoch","시대","특정한 역사적 혹은 우주적 변화를 구분하는 기간을 뜻한다."],["error","오류","진리나 올바른 판단에서 벗어난 생각이나 행위를 의미한다."],["Esdraelon","에스드라엘론","이스르엘 평야의 고대 이름으로, 전쟁의 주요 전장이었다."],["Eskimos","에스키모","북극권의 원주민으로, 혹독한 환경에 적응한 민족이다."],["Esta","에스타","유란시아서에 등장하는 여성적 상징 존재 또는 지역 이름이다."],["Esther","에스더","페르시아 왕비로, 유대 민족을 구한 성경의 여주인공이다."],["eternal","영원한","끝이 없고 시작도 없는 신적 속성을 의미한다."],["Eternal decision","영원한 결정","필사자가 조절자와의 영원한 운명을 받아들이기로 확정적으로 선택하는 순간으로, 영혼의 영원한 진로가 결정되는 최종적·불가역적 선택"],["Eternal Son","영원 아들","아버지로부터 영원히 함께 존재해 온, 모든 영적 창조와 사랑의 중심이 되는 둘째 하나님"],["eternaliter","영원히","시간과 공간의 제약 없이 계속됨을 뜻하는 라틴어 표현이다."],["eternalize","영원화하다","한 존재나 개념을 영속적인 상태로 변화시키다."],["Eternals of Days","영원으로 늘 계신 이들","파라다이스 삼위일체가 기원시킨 고위 삼위일체 아들들로, 하보나의 70개 세계 회로 각각을 통치하는 영원하고 완전한 통치자들"],["eternity","영원","시간의 한계를 초월한 무한한 존재의 상태를 뜻한다."],["ether","에테르","고대 물리학에서 공간을 채우는 보이지 않는 물질로 여겨졌다."],["Eve","이브","유란시아의 물질적 딸로, 인류 유전적 향상을 위해 파견된 존재이다."],["Eventod","에벤트드","유란시아서의 초우주 기록자나 시간 관리 존재로 언급된다."],["eventuate","창발하다","과정의 결과로 어떤 일이 일어나거나 실현되다."],["eventuated transcendental beings","발생된 초월 존재들","시간·공간의 창조 없이 삼위일체와 파라다이스 절대들로부터 ‘출현(eventuation)’한, 태생적으로 시간·공간을 초월한 앱소나이트(초월) 계열 존재들"],["eventuating","결과로 발생하는","결과로 나타나는 상태나 과정을 나타낸다."],["eventuation","창발","사건이 실제로 일어나는 결과의 과정이다."],["eventuators","결과자들","유란시아서에서 초월적 결과를 담당하는 존재들이다."],["Eveson","이브손","유란시아서에서 이브의 후손이나 상징적 인물을 의미한다."],["evolutional","진화적인","발전과 성숙을 통한 점진적 변화를 의미한다."],["evolutionary","진화론적","생명이나 존재의 발전 과정에 관한 이론적 접근을 의미한다."],["evolvement","발전","점진적 향상이나 성장의 과정을 의미한다."],["existential","존재적","실존과 존재의 본질에 관련된 철학적 개념이다."],["experiential","체험적","경험을 통해 인식하거나 학습하는 성격을 의미한다."],["extra-Havona","하보나 외부의","하보나 중심 우주 바깥에 존재하는, 일곱 초우주 및 그 밖의 모든 외우주 영역 전체를 가리키는 개념"],["extragalactic","은하계 밖의","우리 은하계 외부의 공간이나 천체를 의미한다."],["extrasolar","태양계 밖의","태양계 외부의 행성이나 항성을 의미한다."],["extrauniverse","우주 밖의","현재의 시간-공간 우주를 초월한 영역을 의미한다."],["Ezda","에즈다","유란시아서에서 영적 교사나 기록자의 이름으로 언급된다."],["Ezekiel","에스겔","구약의 대예언자로, 환상 속에 새 예루살렘을 보았다."],["Ezra","에스라","율법학자이자 개혁자로, 바빌론 포로 이후 율법을 회복했다."],["Ezraeon","에즈래온","유란시아서에서 언급되는 초우주 행정적 존재이다."],["factualized","사실화된","개념이 실제로 실현되어 구체적인 형태를 갖춘 상태이다."],["Fad","패드","유란시아서에서 등장하는 초우주 기록자 또는 존재의 이름이다."],["faith","신앙","진리에 대한 신뢰와 하나님에 대한 확신을 의미한다."],["Faithfuls of Days","충심으로 늘 계신 이들","파라다이스 삼위일체가 기원시킨 고위 삼위일체 아들들로, 각 성좌(별자리 구역)의 본부 세계에서 영적 조언과 신성한 대표 사명을 수행하는 ‘항상 충직한’ 삼위일체 대사"],["fandors","판도르","유란시아서에서 물리적 제어와 조화를 담당하는 존재이다."],["Fanoving","파노빙","유란시아서의 에너지 조정자이자 우주 기술자 계열이다."],["Fantad","판타드","유란시아서에 나오는 신적 존재 또는 에너지 통제자이다."],["fatalism","운명론","모든 사건이 운명에 의해 결정된다는 철학적 사상이다."],["Father fragment","아버지 단편","파라다이스 아버지가 필사자에게 직접 나누어 주는 신성한 내주 단편, 즉 ‘아버지의 단편’으로 불리는 생각조절자"],["Father Melchizedeks","아버지 멜기세덱들","지역우주에서 멜기세덱 계열을 공동 창조하며 그 집단의 영적 아버지·훈련자·조정자로 봉사하는 창조자 아들과 창조 영의 첫 공동 자녀"],["Father-Absolute","아버지-절대자","아버지를 ‘절대 차원’에서 부를 때 사용되는 이름—무한하고 완전한 아버지"],["Father-Brahma","아버지 브라흐마","인도인들이 이해한 ‘창조 아버지 하나님’ 개념—브라흐마를 가리키는 표현"],["Father-fused","아버지와 융합된","생각 조절자와 합일되어 영원한 생명을 얻은 필사자를 의미한다."],["Father-fused Mortals","아버지와 융합된 필사자들","하나님의 단편과 영원히 하나가 된 인간—아버지와 융합한 필사자"],["fatherhead","부성","하나님 아버지의 본질적 성격이나 속성을 의미한다."],["femaleness","여성성","여성 고유의 생리적·정신적 특질을 의미한다."],["finaliter","최종자","영원한 사명을 띠고 파라다이스로 향하는 상승자 집단을 의미한다."],["finalities","최종성","완전한 성취나 진화의 절정을 의미한다."],["finite","유한","시간과 공간의 제약 속에 존재하는 것을 의미한다."],["finite cosmos","유한한 코스모스","시간과 공간의 한계 안에서 진화하고 성장하는 모든 창조 세계 전체—일곱 초우주로 대표되는 유한 차원의 우주"],["First Source and Center","첫째 근원이며 중심","모든 실체·에너지·영·마음·인격의 궁극적 근원이자 중심이 되는 파라다이스 아버지, 우주의 절대적 기원"],["Flavius","플라비우스","로마 귀족 가문명으로, 여러 황제들의 이름으로 사용되었다."],["Fonta","폰타","인류의 첫 여성으로, 안돈과 함께 최초의 인간으로 여겨진다."],["force","힘","물리적, 정신적, 영적 작용의 원천을 의미한다."],["force-charge","힘의 전하","비활성 잠재 에너지가 조직되고 운동성을 갖추도록 ‘힘’을 부여받는 상태, 즉 에너지가 우주적 기능을 시작하도록 충전된 원초적 힘 단계"],["force-focal","힘의 초점","우주의 원초적 힘과 에너지가 한 지점으로 집중되며 조직되기 시작하는 초점 상태, 즉 힘이 구조화와 변환을 위해 ‘초점화된’ 단계"],["force-space","힘 공간","아직 에너지로도 물질로도 조직되지 않은, 순수한 잠재 힘이 충만한 원초적 공간 상태"],["Formosa","포르모사","대만의 옛 이름으로, ‘아름다운 섬’을 뜻한다."],["Fortant","포르탄트","유란시아서의 존재로, 초우주의 동력 감독자 계열이다."],["Fortune","포춘","운명 또는 행운을 의미하며, 유란시아서에서는 상징적 존재로 등장한다."],["Foxhall","폭스홀","유란시아서의 기록자 혹은 물리적 통제 존재로 언급된다."],["frandalank","프란달랑크","유란시아서의 물리적 에너지 감시 존재로, 힘의 균형을 유지한다."],["freewill","자유의지","인간이 스스로 선택할 수 있는 신적 선물로, 도덕적 책임의 근거이다."],["fusion","융합","인간의 혼과 생각 조절자가 하나가 되는 영적 결합을 의미한다."],["Gabriel","가브리엘","우주 아들의 수석 사자로, 메시지 전달과 행정 기능을 담당한다."],["Gad","갓","야곱의 아들 중 하나로, 이스라엘 지파의 조상이 되었다."],["Gadara","가다라","데가볼리 지역의 도시로, 예수가 귀신 들린 자를 고친 곳이다."],["Gadda","가다","유란시아서에서 등장하는 인물 또는 초우주 기록자의 이름이다."],["Gadiah","가디야","유란시아서의 신앙적 교사이자 진리의 증언자로 언급된다."],["Gautama Siddhartha","고타마 싯다르타","역사적 부처, 불교의 창시자로서 영적 해탈과 자비의 길을 가르친 고타마 싯다르타"],["Genghis Khan","칭기즈 칸","몽골 제국의 창시자로, 유라시아 전역을 정복해 역사상 가장 넓은 연속 제국을 세운 칭기즈 칸"],["God the Absolute","절대 하나님","모든 잠재와 실제, 가치와 의미가 절대 수준에서 완전히 통합될 때 체험적으로 나타나는 미래적·궁극적 신"],["God the Almighty","전능 하나님","유한 창조 세계 전체의 힘·능력·주권이 진화 속에서 통합되어 형성되는 슈프림의 권능 면, 즉 ‘전능한 최상 존재’의 우주 주권적 표현"],["God the Father","아버지 하나님","모든 인격 존재의 사랑의 근원이자 우주의 아버지로서, 파라다이스 아버지를 개인적·관계적 의미에서 부르는 명칭"],["God the Sevenfold","칠중 하나님","유한 피조물이 파라다이스 하나님께 도달할 수 있도록 일곱 단계로 계시된 신성의 계단으로, 아버지의 본질이 시간·공간 속에서 단계적으로 드러난 구조"],["God the Spirit","영 하나님","파라다이스 무한 영의 개인적·관계적 위상을 가리키는 명칭으로, 우주 전역에서 마음·봉사·위로·지능 회로를 담당하는 하나님"],["God the Supreme","최상 하나님","시간과 공간 속에서 신성의 통합을 실현하는 진화적 하나님이다."],["God-hunger","하나님에 대한 갈망","신성을 찾고자 하는 인간 내면의 영적 욕구를 의미한다."],["God-hungry","하나님을 갈망하는 자","신적 진리를 추구하고 내면적으로 하나님을 향해 열망하는 사람이다."],["God-knowing","하나님을 아는","하나님과 인격적 관계를 맺고 그 본성을 체험적으로 이해한 존재이다."],["God-unidentified","미확인 하나님","계시되지 않은 신적 실체나 인격을 지칭하는 개념이다."],["Graduate Guides","졸업생 안내자들","하보나 순례자들을 파라다이스에 이르기까지 인도하는 영 존재들이다."],["Grand Universe","대우주","하보나와 일곱 초우주로 구성된 창조의 전체 영역이다."],["Gravity Messengers","중력 사자","파라다이스 기원 존재로서, 중력 회로를 통해 신속히 이동하는 전달자들이다."],["gravity-embraced","중력에 포용된","파라다이스 중력 회로에 의해 인식되고 유지되는 상태를 의미한다."],["Greco-Roman","그리스-로마","고대 그리스와 로마의 문화적, 철학적 전통을 결합한 문명적 체계를 뜻한다."],["Guardian of Destiny","운명의 수호자","조절자 융합 예정자의 혼을 보호하는 개인 수호 세라핌이다."],["Hannah","한나","하나님께 기도로 자녀를 얻은 신앙 여인으로, 구약 사무엘의 어머니이다."],["Havona Centers","하보나 중심들","하보나 회로의 에너지 조절과 행정을 담당하는 본부 세계들이다."],["Havona Natives","하보나 원주민","하보나에 태생한 완전한 영 존재들로, 창조된 완전성의 표본이다."],["Havona Pilgrims","하보나 순례자들","파라다이스에 도달하기 위해 하보나를 통과하는 상승자들이다."],["Havona Servitals","하보나 봉사자들","하보나 세계에서 순례자와 본토민을 섬기는 봉사적 존재들이다."],["Hellenes","헬라인","고대 그리스 민족으로, 서양 철학과 문화의 기초를 세운 사람들이다."],["Hellenist","헬레니스트","그리스 문화에 영향을 받은 유대인 혹은 헬레니즘 사상가를 의미한다."],["Hellenized","헬라화된","그리스식 문화나 사상이 스며든 상태를 의미한다."],["Herod Agrippa","헤롯 아그리빠","신약시대 팔레스타인의 분봉왕으로 초대교회를 박해한 인물이다."],["Herod Antipas","헤롯 안티파스","세례 요한의 처형을 명한 갈릴리의 분봉왕이다."],["Herod the Idumean","에돔인 헤롯","유대 통치자로, 로마의 지배 아래에서 왕권을 얻은 에돔 출신 인물이다."],["High Commissioners","고등 위원들","하늘의 행정 업무를 대표하거나 감독하는 고위 존재들이다."],["High Son Assistants","높은 아들 조수들","미가엘 아들 "],["cosmos","코스모스","actuals=실제(실체 ✕); time transmutations 시간 변성."],["cosmos-infinite","코스모스-무한","subabsolute cosmos 아(亞)절대 코스모스, expanding cosmos 확장하는 코스모스('우주' ✕, 105편과 통일)."],["cosovereign","공동 주권자","창조자 아들이 일곱째 증여 뒤 우주 어머니 영을 높여 주는 동격의 주권(공동 통치자·공동 군주 ✕)."],["cosovereignty","공동 주권","창조자 아들이 일곱째 증여 뒤 우주 어머니 영을 높여 주는 동격의 주권(공동 통치자·공동 군주 ✕)."],["couches","긴 의자","179편·용어집과 통일('위층 방·침상·변압자·지구 시간' ✕); special ministry 특별한 사역; communed 교통하다(2.9)."],["council","의회","'공의회·대표단·대사제들·유대 지도자들·린넨·마르타·복지' ✕; had salvation 구원을 가지고 있었다(4.6), lived on earth 이 땅에서 살다(4.4), while the Master's body lay in the tomb 주님의 시신이 무덤에 누워 있는 동안(3.13 복원)."],["council of equilibrium","균형 위원회","일곱 주 영이 연합 주 힘 조직자단에서 파견한 동력의 고등 위원들로 초우주 본부에서 물리적 통제자를 지휘·분배한다."],["council of receivership","수탁자단 회의","'수임자' ✕(50·53·73편과 통일)."],["council of the elders","원로 평의회","tribal council of the Andite elders 안드족 원로들의 부족 평의회이며 '장로회의' ✕(70편과 통일)."],["council on political sovereignty","정치적 주권 평의회","commission(위원회)과 구별; titular (mortal) heads 명목상의 (필사) 우두머리들; commissioned 임관(용어집)."],["councilors","평의원","'대사제들·유대 지도자들(rulers)·산헤드린 의원' ✕; clerk of the court 법정 서기; procurator 총독; legatus of Syria 시리아 총독; tetrarch 헤롯(분봉왕)."],["councils of supreme sanction","최상 인가 위원회","샐빙턴의 백 개 위원회이며 의장들이 가브리엘의 실무 내각을 이룬다."],["councils of the entire universe","온 우주의 회의","'의회' ✕."],["councils of the most highs","지고자들의 회의","'의회' ✕."],["counsel","권고","67:2.3에서 나란히 나오며 '지시' ✕."],["counselor","조언자","twenty-four counselors 24 조언자들이며 '상담자' ✕(55·76편과 통일)."],["counselor and helper","조언자와 조력자","'자문' ✕; private secretary 개인 비서, master teachers 주(主) 교사."],["counselors","조언자","\"first accepted counselors\" 첫 조언자('사도' ✕); chosen family of Jesus' advisers 선택된 조언자 무리."],["counselors and advisers","상담자와 조언자","하보나 둘째 회로에서 영원의 생애를 가르치는 2차 수퍼나핌이며 adviser는 '조언자'로 통일한다(고문 ✕, 사용자 확정 26편)."],["counsels of the universe","우주의 협의","'의논·보호·어쩌면·참된 말' ✕."],["count it all gain","이득으로 여기다","'전화위복' 같은 사자성어 추가 ✕(76:5.7)."],["counterirritants","반자극제","의료 용어(연고·북소리·배설을 통 var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(t,q){t=esc(t); if(!q) return t; var i=t.toLowerCase().indexOf(q); return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)}
function letter(en){var c=(en||'').trim().charAt(0).toUpperCase(); return /[A-Z]/.test(c)?c:'#'}
function tabs(){ $('#tabs').innerHTML=S.map(function(s,i){return '<button data-i="'+i+'"'+(i===cur?' class="on"':'')+'>'+(i===0?'용어집':'참고 용어')+' '+s.rows.length.toLocaleString()+'</button>'}).join('') }
function render(){
  var q=$('#q').value.trim().toLowerCase(), rows=S[cur].rows, h='', last='', n=0, seen={};

    if(q && (r[0]+' '+r[1]+' '+r[2]).toLowerCase().indexOf(q)<0) return;
    var L=letter(r[0]); if(L!==last){ last=L; seen[L]=1; h+='<tr class="letter" id="L'+L+'"><td colspan="3">'+L+'</td></tr>'; }
    h+='<tr><td class="e">'+hl(r[0],q)+'</td><td class="k">'+hl(r[1],q)+'</td><td class="n">'+hl(r[2],q)+'</td></tr>'; n++;
  });
  $('#tb').innerHTML=h; $('#empty').hidden=n>0;
  $('#count').textContent=(q?n.toLocaleString()+'개 찾음 / ':'')+rows.length.toLocaleString()+'개';

}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button'); if(!b) return; cur=+b.dataset.i; tabs(); render(); window.scrollTo(0,0)});
$('#q').addEventListener('input',render);

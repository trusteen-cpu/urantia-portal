<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한국 유란시아서 독자 모임</title>
<link rel="stylesheet" href="style.css">
<style>
/* ── 아이콘·도형 장식 (2026-08-11 추가) ─────────────────────── */
.card .hd{position:relative}
.card .ico{display:inline-flex;align-items:center;justify-content:center;
           width:22px;height:22px;flex:0 0 auto;opacity:.95}
.card .ico svg{width:20px;height:20px;display:block}
/* 카드 머리 오른쪽 위에 깔리는 옅은 동심원 무늬 */
.card .hd::after{content:"";position:absolute;right:-14px;top:-16px;width:62px;height:62px;
  border-radius:50%;pointer-events:none;opacity:.055;
  background:radial-gradient(circle,currentColor 0 27%,transparent 28% 43%,
             currentColor 44% 47%,transparent 48% 66%,currentColor 67% 69%,transparent 70%)}
/* 카드 아래쪽 얇은 금색 마무리 선 */
.card .fin{height:1px;margin:0 12px 9px;
  background:linear-gradient(90deg,transparent,rgba(183,121,31,.35),transparent)}
/* 그룹 번호 배지를 조금 또렷하게 */
.badge{box-shadow:0 1px 0 rgba(0,0,0,.12)}

/* ── 언어 단추 (2026-08-16 추가) ───────────────────────────── */
.titlerow{display:flex;align-items:center;justify-content:center;
          gap:26px;flex-wrap:wrap}
.titlerow h1{margin:0}
.langbtn{display:inline-flex;align-items:center;gap:7px;
  padding:7px 15px;border-radius:999px;cursor:pointer;
  font:600 14px/1 inherit;letter-spacing:.02em;white-space:nowrap;
  color:#f6e3b8;background:rgba(255,255,255,.06);
  border:1px solid rgba(214,168,74,.55);
  backdrop-filter:blur(2px);transition:background .18s,border-color .18s,color .18s}
.langbtn:hover{background:rgba(214,168,74,.18);border-color:rgba(214,168,74,.9);color:#fff6df}
.langbtn:active{transform:translateY(1px)}
.langbtn svg{width:15px;height:15px;flex:0 0 auto}
.langbtn[disabled]{opacity:.5;cursor:progress}
@media(max-width:560px){.titlerow{gap:12px}.langbtn{font-size:13px;padding:6px 13px}}

/* 구글 번역이 붙이는 위쪽 띠·풍선 감추기 */
iframe.skiptranslate,.goog-te-banner-frame,#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
body{top:0!important;position:static!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
#google_translate_element{display:none}
</style>
<meta property="og:title" content="한국 유란시아서 독자 모임 — 진리를 함께 걷는 자리">
<meta property="og:description" content="유란시아서 본문, 52주·100강 강의, 인터랙티브 학습, 매일의 아침·취침 묵상까지 — 한 곳에서 만나는 유란시아서 여정.">
<meta property="og:image" content="https://urantiareaders.com/og-image.jpg">
<meta property="og:url" content="https://urantiareaders.com">
</head>
<body>

<header class="hero">
  <canvas id="stars"></canvas>
  <div class="glow"></div>
  <div class="inner">
    <span class="ribbon" id="hBadge"></span>
    <div class="titlerow">
      <h1 id="hTitle"></h1>
      <button type="button" id="langBtn" class="langbtn notranslate" translate="no">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
          <path d="M12 3c2.6 3 2.6 15 0 18-2.6-3-2.6-15 0-18z"/>
        </svg><span id="langBtnTxt">English</span>
      </button>
    </div>
    <div class="sub" id="hSub"></div>
    <div class="quote" id="hQuote"></div>
    <div class="qref" id="hQref"></div>
    <div class="rule"></div>
  </div>
</header>

<div class="searchbar">
  <div class="wrap row">
    <input id="q" type="search" placeholder="게시판·자료 이름으로 찾기  (예: 명상, 강의, 도표)" autocomplete="off">
    <a class="home" id="cafeLink" target="_blank" rel="noopener">카페 바로가기</a>
  </div>
</div>

<main class="wrap">
  <section id="results"><div class="rescount"></div><div class="resgrid"></div></section>
  <div id="sheetBox"></div>
  <section class="grid" id="grid"></section>
  <div class="summary" id="summary" style="display:none">
    <div class="em">📖</div>
    <div><b>한 문장 요약</b><p id="sumText"></p></div>
  </div>
</main>

<footer>
  <div id="fNote"></div>
  <div id="fMail" style="margin-top:4px"></div>
</footer>
<a href="#" class="totop" id="totop" title="맨 위로">▲</a>

<script src="app.js"></script>
<script>
(function(){
  const c=document.getElementById('stars'), x=c.getContext('2d');
  function draw(){const w=c.width=c.offsetWidth,h=c.height=c.offsetHeight;x.clearRect(0,0,w,h);
    for(let i=0;i<130;i++){const px=Math.random()*w,py=Math.random()*h*.95,r=Math.random()*1.3+.25,
      a=(1-py/h)*(Math.random()*.6+.15);x.fillStyle='rgba(255,253,244,'+a.toFixed(2)+')';
      x.beginPath();x.arc(px,py,r,0,6.284);x.fill();}}
  draw();window.addEventListener('resize',draw);
})();

let DATA=null, FLAT=[];

loadData().then(d=>{DATA=d;render();}).catch(()=>{
  document.getElementById('grid').innerHTML =
    '<div class="empty">links.json 을 읽지 못했습니다.<br>파일을 더블클릭하지 마시고 넷리파이에 올린 주소로 열어 주세요.</div>';
});

/* ── 게시판마다 코드로 그리는 선 아이콘 ─────────────────────
   이모지 대신 씁니다. 색은 그룹 색을 따라갑니다.
   새 그룹을 만들면 아래 ICON 에 아이디를 추가하시면 되고,
   없으면 별 모양이 기본으로 들어갑니다.                        */
const ICON = {
  ch:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M10 20v-5h4v5"/>',
  join:'<path d="M4 5h16v10H8l-4 4z"/><path d="M8.5 9h7"/><path d="M8.5 12h4"/>',
  member:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14.5 6.5l3 3"/><path d="M4 20l4-1"/>',
  study:'<path d="M12 6.5C10 5 7.5 4.6 5 5v13c2.5-.4 5 0 7 1.5 2-1.5 4.5-1.9 7-1.5V5c-2.5-.4-5 0-7 1.5z"/><path d="M12 6.5v13"/>',
  topic:'<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/><path d="M9 11h4"/>',
  bible:'<path d="M6 4h9l3 3v13H6z"/><path d="M15 4v3h3"/><path d="M9 11h6M9 14h6M9 17h4"/>',
  media:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10.5 9.5l5 2.5-5 2.5z"/>',
  class:'<path d="M12 5l9 4-9 4-9-4z"/><path d="M7 11v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4"/><path d="M20 9.5V15"/>',
  school:'<path d="M4 20h16"/><path d="M5 20V9l7-4 7 4v11"/><path d="M9 20v-6h6v6"/><path d="M9 11h.01M15 11h.01"/>',
  world:'<circle cx="12" cy="12" r="8"/><path d="M4 12h16"/><path d="M12 4c2.5 2.6 2.5 12.4 0 16-2.5-3.6-2.5-13.4 0-16z"/>',
  workbook:'<path d="M6 4h13v16H6z"/><path d="M6 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2"/><path d="M9.5 9l1.5 1.5L14 8"/><path d="M9.5 15h6"/>',
  writing:'<path d="M15 4l5 5-9.5 9.5-6 1.5 1.5-6z"/><path d="M13 6l5 5"/>',
  trans:'<path d="M4 6h8"/><path d="M8 6v1.5c0 3-1.6 5.5-4 6.5"/><path d="M6 10c1 2.2 2.8 3.7 5 4.2"/><path d="M12 20l3.5-8 3.5 8"/><path d="M13.4 17.2h4.2"/>',
  english:'<path d="M5 13v-1a7 7 0 0 1 14 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.6"/><rect x="17" y="13" width="4" height="6" rx="1.6"/>'
};
const ICON_DEFAULT = '<path d="M12 4l2.3 5.1L20 10l-4 3.9.9 5.6L12 16.9 7.1 19.5 8 13.9 4 10l5.7-.9z"/>';

function iconSvg(g){
  const d = ICON[g.id] || ICON_DEFAULT;
  return '<span class="ico" style="color:'+colorOf(g)+'">'
       + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" '
       + 'stroke-linecap="round" stroke-linejoin="round">'+d+'</svg></span>';
}

function render(){
  const s=DATA.site||{};
  document.title=s.title||'유란시아';
  hBadge.textContent=s.badge||''; hTitle.textContent=s.title||'';
  hSub.textContent=s.subtitle||'';
  hQuote.textContent=s.quote?('“'+s.quote+'”'):''; hQref.textContent=s.quoteRef||'';
  cafeLink.href=s.cafeUrl||'#';
  fNote.textContent=s.footerNote||'';
  if(s.email) fMail.innerHTML='문의 <a href="mailto:'+esc(s.email)+'">'+esc(s.email)+'</a>';
  if(s.summary){summary.style.display='flex'; sumText.textContent=s.summary;}

  /* 카드 — 1단(게시판 이름)만 */
  let html='';
  (DATA.groups||[]).forEach((g,gi)=>{
    const col=colorOf(g), items=g.items||[], max=g.preview||40, over=items.length>max;
    const shown=over?items.slice(0,max):items;
    html+='<article class="card" id="g-'+esc(g.id)+'"><div class="bar" style="background:'+col+'"></div>'
        + '<div class="hd" style="color:'+col+'"><span class="badge" style="background:'+col+'">'+(gi+1)+'</span>'
        + iconSvg(g)
        + '<h2>'+esc(g.title)+'</h2><span class="cnt">'+items.length+'</span></div><ul class="list">';
    shown.forEach((it,ii)=>{ html+=topLine(it,g,ii); });
    html+='</ul><div class="fin"></div>';
    if(over) html+='<a class="more" href="'+href(g.id)+'">전체 '+items.length+'개 보기 →</a>';
    html+='</article>';
  });
  grid.innerHTML=html;

  FLAT=flatten(DATA);
}

function topLine(it,g,ii){
  const t = targetOf(it, (DATA.site||{}).cafeUrl||'#', g.id, ii);
  const kids=(it.children||[]).length;
  const tag = kids            ? '<span class="tag sub">'+kids+'</span>'
            : t.kind==='text' ? '<span class="tag doc">글</span>'
            : it.member       ? '<span class="tag mem">회원</span>'
            : (t.empty?'<span class="tag todo">주소</span>':'');
  const dot = kids ? '▸' : t.kind==='text' ? '▪' : '·';
  return '<li><a href="'+esc(t.href)+'"'+(t.ext?' target="_blank" rel="noopener"':'')+'>'
      +'<span class="dot">'+dot+'</span><span class="nm">'+esc(it.name)+'</span>'+tag+'</a></li>';
}

/* 검색 */
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){results.classList.remove('on');grid.style.display='';return;}
  const hit=FLAT.filter(o=>o.n.toLowerCase().includes(v)||o.path.toLowerCase().includes(v));
  results.classList.add('on'); grid.style.display='none';
  results.querySelector('.rescount').textContent='“'+q.value+'” 검색 결과 '+hit.length+'개';
  results.querySelector('.resgrid').innerHTML = hit.length
    ? hit.map(o=>'<a class="resitem" href="'+esc(o.href)+'"'+(o.ext?' target="_blank" rel="noopener"':'')+'>'
        + esc(o.n)+'<small>'+esc(o.path)+'</small></a>').join('')
    : '<div class="empty">찾는 이름이 없습니다.</div>';
});

/* 맨 위로 */
window.addEventListener('scroll',()=>{
  document.getElementById('totop').classList.toggle('on', window.scrollY>500);
});
</script>

<!-- ── 한국어 ↔ English 전환 (구글 번역 위젯) ──────────────────
     페이지를 그대로 둔 채 글자만 바꿉니다. 다른 주소로 넘어가지 않습니다.
     googtrans 쿠키에 상태를 적어 두므로, 다시 들어와도 고른 언어가 유지됩니다. -->
<div id="google_translate_element"></div>
<script>
(function(){
  var btn  = document.getElementById('langBtn'),
      txt  = document.getElementById('langBtnTxt');

  /* 쿠키 읽기 — /ko/en 이면 지금 영어로 보고 있는 것 */
  function isEnglish(){
    var m = document.cookie.match(/(?:^|;\s*)googtrans=([^;]*)/);
    return !!(m && decodeURIComponent(m[1]).indexOf('/en') > 0);
  }

  /* 도메인이 여러 형태로 저장될 수 있어 후보를 모두 다룹니다 */
  function domains(){
    var h = location.hostname, out = ['', h, '.' + h], p = h.split('.');
    if (p.length > 2) out.push('.' + p.slice(-2).join('.'));
    return out;
  }
  function setCookie(val){
    domains().forEach(function(d){
      document.cookie = 'googtrans=' + val + '; path=/' + (d ? '; domain=' + d : '');
    });
  }
  function clearCookie(){
    domains().forEach(function(d){
      document.cookie = 'googtrans=; path=/' + (d ? '; domain=' + d : '') +
                        '; expires=Thu, 01 Jan 1970 00:00:00 GMT';
    });
  }

  function paint(){ txt.textContent = isEnglish() ? '한국어' : 'English'; }
  paint();

  btn.addEventListener('click', function(){
    btn.setAttribute('disabled','');
    if (isEnglish()) clearCookie(); else setCookie('/ko/en');
    location.reload();
  });
})();

function googleTranslateElementInit(){
  new google.translate.TranslateElement(
    {pageLanguage:'ko', includedLanguages:'en,ko', autoDisplay:false},
    'google_translate_element');
}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
        defer></script>
</body>
</html>

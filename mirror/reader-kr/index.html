<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유란시아서 읽어 주는 리더</title>
<style>
:root{
  --bg:#0d1220; --panel:#111730; --line:rgba(255,255,255,.10);
  --ink:#e8e6df; --dim:#9099b0; --gold:#e4be76; --teal:#7fd1c8;
  --hl:rgba(228,190,118,.14);
}
body.light{--bg:#faf8f3;--panel:#fff;--line:#e4ddcd;--ink:#23262e;--dim:#6f7484;
  --gold:#a9761c;--teal:#1d6f68;--hl:rgba(169,118,28,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);display:flex;height:100vh;overflow:hidden;
  font-family:"Noto Serif KR","바탕",serif;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* 왼쪽 목차 */
aside{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column}
aside h1{margin:0;padding:16px 18px 4px;font-size:17px;color:var(--gold)}
aside .cap{padding:0 18px 12px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line)}
.nav{flex:1;overflow:auto;padding:6px 0 30px}
.pp{padding:11px 16px 5px;font-size:13.5px;color:var(--gold);font-weight:700}
.sc{display:flex;gap:8px;align-items:baseline;padding:7px 16px 7px 24px;font-size:13px;
  color:var(--dim);cursor:pointer;border-left:3px solid transparent}
.sc:hover{background:var(--hl)}
.sc.on{background:var(--hl);border-left-color:var(--gold);color:var(--ink)}
.sc .n{color:var(--gold);font-size:11.5px;min-width:36px}
.sc .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 오른쪽 */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);
  flex-wrap:wrap}
.bar .now{flex:1;min-width:120px;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .now b{color:var(--gold);margin-right:8px}
.btn{font-size:12.5px;color:var(--ink);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:7px 11px;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.pri{border-color:var(--gold);color:var(--gold)}
.btn.on{background:var(--gold);color:#12172a;border-color:var(--gold)}
select,input[type=range]{font-family:inherit;font-size:12px;background:transparent;color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:6px}
select option{background:#111730;color:#e8e6df}
.reading{flex:1;overflow:auto;padding:26px 0 40vh}
.wrap{max-width:820px;margin:0 auto;padding:0 26px}
.hd{font-size:22px;color:var(--gold);margin:0 0 4px}
.hd small{display:block;font-size:12.5px;color:var(--dim);margin-top:5px;font-weight:400}
.para{display:flex;gap:12px;align-items:flex-start;padding:12px 12px 12px 8px;border-radius:10px;
  margin:2px -12px;line-height:2.0;font-size:17px;transition:background .15s}
.para:hover{background:var(--hl)}
.para.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--gold)}
.para .cit{flex:0 0 58px;font-size:11.5px;color:var(--gold);padding-top:9px;letter-spacing:.02em}
.para .tx{flex:1;min-width:0;text-align:justify;word-break:keep-all}
.spk{flex:0 0 auto;border:none;background:transparent;color:var(--dim);font-size:16px;
  padding:4px 6px;border-radius:8px;opacity:.35}
.para:hover .spk,.para.on .spk{opacity:1}
.spk:hover{color:var(--gold)}
.empty{color:var(--dim);padding:40px 26px;line-height:2}
.warn{background:rgba(228,190,118,.12);border:1px solid var(--gold);border-radius:10px;
  padding:12px 14px;margin:0 0 18px;font-size:13px;line-height:1.9;color:var(--ink)}
@media(max-width:820px){
  body{flex-direction:column;height:auto;overflow:auto}
  aside{width:100%;flex:none;max-height:38vh}
  .reading{overflow:visible;padding-bottom:30vh}
  .para{font-size:16.5px}
}
</style>
</head>
<body>

<script>
// 카카오톡 인앱 브라우저에서는 이 페이지가 책 전체 데이터(책.json, 몇 MB)를
// 통째로 불러오는데, 이 과정이 실패하거나 멈추는 경우가 있습니다. 이럴 때
// 아래 fetch()의 catch가 걸려서 "책.json을 읽지 못했습니다" 안내만 뜨고
// 아무 것도 읽을 수 없게 됩니다. 카카오톡이 자체 제공하는
// "다른 브라우저로 열기" 메뉴를 사용하도록 화면 가운데에 안내창을 띄웁니다.
(function () {
  var ua = navigator.userAgent || '';
  if (!/KAKAOTALK/i.test(ua)) return;
  document.addEventListener('DOMContentLoaded', function () {
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;left:0;right:0;top:0;bottom:0;z-index:99999;' +
      'background:rgba(10,12,20,.7);display:flex;align-items:center;justify-content:center;padding:20px';
    var card = document.createElement('div');
    card.style.cssText = 'max-width:340px;width:100%;background:#191f36;border:2px solid #e4be76;' +
      'border-radius:14px;padding:22px 20px;box-shadow:0 8px 30px rgba(0,0,0,.5);' +
      'font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;text-align:center;color:#e8e6df';
    card.innerHTML =
      '<div style="font-size:15px;font-weight:800;color:#e4be76;margin-bottom:12px;line-height:1.5">' +
      '카카오톡 브라우저에서는<br>리더가 열리지 않습니다</div>' +
      '<div style="font-size:13.5px;color:#c7cadb;line-height:1.7">' +
      '화면의 <b style="color:#e4be76">점 3개(⋮)</b> 또는 <b style="color:#e4be76">공유</b> 아이콘을 눌러<br>' +
      '<b style="color:#e4be76">"다른 브라우저로 열기"</b>를 선택해 주세요.<br>' +
      '(아이폰은 <b style="color:#e4be76">"Safari로 열기"</b>)</div>';
    ov.appendChild(card);
    document.body.appendChild(ov);
  });
})();
</script>

<aside>
  <h1>유란시아서</h1>
  <div class="cap" id="cap">읽어 주는 리더</div>
  <div class="nav" id="nav"></div>
</aside>

<main>
  <div class="bar">
    <div class="now" id="now">왼쪽에서 장을 고르세요</div>
    <button class="btn pri" id="play">▶ 이 장 듣기</button>
    <button class="btn" id="stop">■ 정지</button>
    <select id="voice" title="목소리"></select>
    <label style="font-size:11.5px;color:var(--dim)">속도
      <input type="range" id="rate" min="0.6" max="1.4" step="0.05" value="0.95" style="width:90px;vertical-align:middle">
    </label>
    <button class="btn" id="big">가</button>
    <button class="btn" id="theme">◐</button>
  </div>
  <div class="reading" id="reading">
    <div class="wrap"><div class="empty">불러오는 중…</div></div>
  </div>
</main>

<script>
let BOOK=null, CUR=null, IDX=-1, PLAYING=false, VOICES=[], FS=17;
const synth = window.speechSynthesis;
const $ = id => document.getElementById(id);

/* ── 불러오기 ─────────────────────────────── */
fetch('책.json?v='+Date.now()).then(r=>r.json()).then(d=>{BOOK=d;buildNav();restore();})
  .catch(()=>{ $('reading').innerHTML='<div class="wrap"><div class="empty">'
    +'책.json 을 읽지 못했습니다.<br>index.html 을 그냥 더블클릭하면 안 됩니다.<br><br>'
    +'그 폴더에서 <b>python -m http.server 8000</b> 을 실행하고<br>'
    +'http://localhost:8000 으로 여시거나, 폴더째 넷리파이에 올리세요.</div></div>'; });

function buildNav(){
  let h='', n=0;
  BOOK.papers.forEach((p,pi)=>{
    const name = p.no==='0' ? '머리말' : ('제'+p.no+'편 '+p.title);
    h+='<div class="pp">'+esc(name)+'</div>';
    p.sections.forEach((s,si)=>{
      n++;
      h+='<div class="sc" id="sc_'+pi+'_'+si+'" onclick="open_('+pi+','+si+')">'
        +'<span class="n">'+esc(s.sec)+'</span>'
        +'<span class="t">'+esc(s.title || (s.paras[0]?s.paras[0].text.slice(0,18):''))+'</span></div>';
    });
  });
  $('nav').innerHTML=h;
  const tot = BOOK.papers.reduce((a,p)=>a+p.sections.reduce((b,s)=>b+s.paras.length,0),0);
  $('cap').textContent='편 '+BOOK.papers.length+' · 장 '+n+' · 절 '+tot;
}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ── 장 열기 ──────────────────────────────── */
function open_(pi,si,keep){
  stop();
  const p=BOOK.papers[pi], s=p.sections[si];
  CUR={pi:pi,si:si,paras:s.paras};
  const name = p.no==='0' ? '머리말' : ('제'+p.no+'편 '+p.title);
  let h='<div class="wrap"><h2 class="hd">'+esc(s.title||s.sec)
      +'<small>'+esc(name)+'  ·  '+esc(s.sec)+'  ·  '+s.paras.length+'절</small></h2>';
  if(!VOICES.length || vscore(VOICES[0])<2) h+='<div class="warn" id="vwarn"></div>';
  s.paras.forEach((x,i)=>{
    h+='<div class="para" id="p'+i+'">'
      +'<span class="cit">'+esc(x.cit)+'</span>'
      +'<span class="tx">'+esc(x.text)+'</span>'
      +'<button class="spk" onclick="one('+i+')" title="이 절만 듣기">🔊</button></div>';
  });
  $('reading').innerHTML=h+'</div>';
  applyFS();
  $('now').innerHTML='<b>'+esc(s.sec)+'</b>'+esc(s.title||name);
  document.querySelectorAll('.sc').forEach(e=>e.classList.remove('on'));
  const el=$('sc_'+pi+'_'+si); if(el){el.classList.add('on'); el.scrollIntoView({block:'nearest'});}
  if(!keep) $('reading').scrollTop=0;
  save();
  checkVoices();
}

/* ── 읽기 ─────────────────────────────────── */
function speak(i){
  if(!CUR||i<0||i>=CUR.paras.length){ finish(); return; }
  IDX=i; mark(i);
  const u=new SpeechSynthesisUtterance(clean(CUR.paras[i].text));
  const v=VOICES[$('voice').selectedIndex];
  if(v) u.voice=v;
  u.lang='ko-KR';
  u.rate=parseFloat($('rate').value);
  u.onend=()=>{ if(PLAYING) speak(i+1); };
  u.onerror=()=>{ if(PLAYING) speak(i+1); };
  synth.speak(u);
  save();
}
function clean(t){
  return t.replace(/[「」『』]/g,' ').replace(/―/g,', ')
          .replace(/\[|\]/g,' ').replace(/\s+/g,' ');
}
function mark(i){
  document.querySelectorAll('.para').forEach(e=>e.classList.remove('on'));
  const el=$('p'+i);
  if(el){ el.classList.add('on');
    const box=$('reading'), r=el.getBoundingClientRect(), b=box.getBoundingClientRect();
    if(r.top<b.top+70||r.bottom>b.bottom-90)
      box.scrollTop += r.top-b.top-box.clientHeight*0.32;
  }
}
function play(from){
  if(!CUR) return;
  PLAYING=true; $('play').classList.add('on'); $('play').textContent='❚❚ 멈춤';
  speak(from!==undefined?from:(IDX>=0?IDX:0));
}
function one(i){ stop(); PLAYING=false; IDX=i; mark(i);
  const u=new SpeechSynthesisUtterance(clean(CUR.paras[i].text));
  const v=VOICES[$('voice').selectedIndex]; if(v) u.voice=v;
  u.lang='ko-KR'; u.rate=parseFloat($('rate').value);
  synth.speak(u); save(); }
function stop(){ synth.cancel(); PLAYING=false;
  $('play').classList.remove('on'); $('play').textContent='▶ 이 장 듣기'; }
function finish(){
  stop();
  /* 다음 장으로 이어 읽기 */
  if(!CUR) return;
  const p=BOOK.papers[CUR.pi];
  if(CUR.si+1<p.sections.length){ open_(CUR.pi,CUR.si+1); IDX=0; setTimeout(()=>play(0),400); }
  else if(CUR.pi+1<BOOK.papers.length){ open_(CUR.pi+1,0); IDX=0; setTimeout(()=>play(0),400); }
}
$('play').onclick=()=>{ if(PLAYING) stop(); else play(); };
$('stop').onclick=()=>{ stop(); IDX=-1;
  document.querySelectorAll('.para').forEach(e=>e.classList.remove('on')); };

/* ── 목소리 ───────────────────────────────── */
function vscore(v){
  const n=v.name||'';
  if(/Natural|Online/i.test(n)) return 3;   /* 엣지의 신경망 음성 */
  if(/Google/i.test(n)) return 2;           /* 크롬의 구글 음성 */
  if(v.localService===false) return 1;
  return 0;
}
function vlabel(v){
  const n=(v.name||'').replace('Microsoft ','').replace(/ - Korean.*$/,'')
                      .replace(' Online (Natural)',' (자연스러움)');
  return (vscore(v)>=2 ? '★ ' : '') + n;
}
function loadVoices(){
  const all=synth.getVoices();
  VOICES=all.filter(v=>/^ko/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a));
  const sel=$('voice');
  sel.innerHTML = VOICES.length
    ? VOICES.map(v=>'<option>'+esc(vlabel(v))+'</option>').join('')
    : '<option>한국어 음성 없음</option>';
  const saved=localStorage.getItem('ub_voice');
  const i = saved ? VOICES.findIndex(v=>v.name===saved) : -1;
  sel.selectedIndex = i>=0 ? i : 0;          /* 없으면 가장 좋은 것 */
  checkVoices();
}
function checkVoices(){
  const w=$('vwarn'); if(!w) return;
  if(!VOICES.length){
    w.innerHTML='이 기기에 <b>한국어 음성</b>이 설치되어 있지 않아 읽어 주지 못합니다.<br>'
      +'· 윈도우 : 설정 → 시간 및 언어 → 음성 → 음성 추가 → 한국어<br>'
      +'· 안드로이드 : 설정 → 접근성 → 텍스트 음성 변환 → 한국어 내려받기<br>'
      +'· 아이폰·아이패드 : 대개 이미 들어 있습니다. 화면을 새로고침해 보세요.';
    return;
  }
  if(vscore(VOICES[0])>=2){ w.remove(); return; }
  w.innerHTML='지금은 <b>기기에 기본으로 깔린 음성</b>이라 딱딱하게 들립니다.<br>'
    +'<b>마이크로소프트 엣지</b>로 이 쪽을 열면 «InJoon (자연스러움)», «SunHi (자연스러움)» 같은 '
    +'신경망 음성이 목록에 나타납니다. 훨씬 부드럽습니다.<br>'
    +'크롬에서는 «Google 한국어»가 나오면 그것을 고르세요. (둘 다 인터넷이 연결돼 있어야 합니다)';
}
synth.onvoiceschanged=loadVoices;
loadVoices(); setTimeout(loadVoices,600);
$('voice').onchange=()=>{ const v=VOICES[$('voice').selectedIndex];
  if(v) localStorage.setItem('ub_voice',v.name); if(PLAYING){stop();play(IDX);} };
$('rate').oninput=()=>{ localStorage.setItem('ub_rate',$('rate').value);
  if(PLAYING){ const i=IDX; stop(); play(i); } };

/* ── 글씨·색·이어 읽기 ────────────────────── */
function applyFS(){ document.querySelectorAll('.para').forEach(e=>e.style.fontSize=FS+'px'); }
$('big').onclick=()=>{ FS = FS>=23 ? 15 : FS+2; localStorage.setItem('ub_fs',FS); applyFS(); };
$('theme').onclick=()=>{ document.body.classList.toggle('light');
  localStorage.setItem('ub_light', document.body.classList.contains('light')?'1':''); };
function save(){ if(CUR) localStorage.setItem('ub_pos', JSON.stringify({p:CUR.pi,s:CUR.si,i:IDX})); }
function restore(){
  FS=parseInt(localStorage.getItem('ub_fs')||'17',10);
  if(localStorage.getItem('ub_light')) document.body.classList.add('light');
  const r=localStorage.getItem('ub_rate'); if(r) $('rate').value=r;
  try{
    const q=JSON.parse(localStorage.getItem('ub_pos')||'null');
    if(q && BOOK.papers[q.p] && BOOK.papers[q.p].sections[q.s]){
      open_(q.p,q.s); if(q.i>=0){ IDX=q.i; mark(q.i); }
      return;
    }
  }catch(e){}
  open_(0,0);
}

/* 키보드 */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); PLAYING?stop():play(); }
  if(e.code==='ArrowDown'&&e.shiftKey){ e.preventDefault(); stop(); play(IDX+1); }
  if(e.code==='ArrowUp'&&e.shiftKey){ e.preventDefault(); stop(); play(Math.max(0,IDX-1)); }
});
window.addEventListener('beforeunload',()=>synth.cancel());
</script>
</body>
</html>

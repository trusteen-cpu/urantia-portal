<style>
  :root{
    --ink:#2b2620;
    --paper:#f6f1e7;
    --paper2:#ffffff;
    --gold:#b8893f;
    --gold-deep:#8a6224;
    --line:#e3d8c4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: 'Noto Serif KR','Nanum Myeongjo',Georgia,serif;
    background: var(--paper);
    color: var(--ink);
    line-height:1.5;
  }
  .bg-pattern{
    position:fixed; inset:0; z-index:-1;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,137,63,0.06) 0%, transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(184,137,63,0.06) 0%, transparent 35%);
  }
  header{
    text-align:center;
    padding: 32px 24px 22px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    letter-spacing:0.35em;
    font-size:11px;
    color: var(--gold-deep);
    text-transform:uppercase;
    margin-bottom:8px;
    font-family: 'Pretendard','Noto Sans KR',sans-serif;
    font-weight:600;
  }
  h1{
    font-size: clamp(24px, 5vw, 40px);
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:0.02em;
    background: linear-gradient(100deg, #b8893f, #c9534a 50%, #6f5fa3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle{
    font-size:13px;
    color:#6b5f4d;
    font-family:'Pretendard','Noto Sans KR',sans-serif;
  }
  .credit{
    margin-top:12px;
    font-size:12px;
    color:#6b5f4d;
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    letter-spacing:0.05em;
  }
  .credit span{
    display:inline-block;
    padding:4px 14px;
    border:1px solid var(--gold);
    border-radius:999px;
    background: var(--paper2);
    font-weight:600;
  }
  main{
    max-width: 1000px;
    margin: 0 auto;
    padding: 18px 14px 50px;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap:8px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    background: var(--paper2);
    border:1px solid var(--line);
    border-left: 4px solid var(--accent, var(--gold));
    border-radius:8px;
    text-decoration:none;
    color: var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.card:hover{
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 4px 14px rgba(60,45,20,0.14);
  }
  .icon{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:50%;
    background: var(--accent, var(--gold));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;
  }
  .title{
    font-size:14.5px;
    font-weight:700;
    flex:1;
    line-height:1.3;
  }
  .num{
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
    color:#b3a58c;
    font-family:'Pretendard','Noto Sans KR',sans-serif;
  }
  footer{
    text-align:center;
    padding: 20px 20px 40px;
    font-size:12px;
    color:#9b8e76;
    font-family:'Pretendard','Noto Sans KR',sans-serif;
  }
  @media (prefers-reduced-motion: reduce){
    a.card{transition:none;}
  }
</style>
</head>
<body>
<div class="bg-pattern"></div>
<header>
  <div class="eyebrow">URANTIA BOOK · AUDIOBOOK SERIES</div>

  <div class="credit"><span>편집 및 제작 · 한종인</span></div>

<main>

const grid = document.getElementById('grid');
episodes.forEach((ep, i) => {
  const [title, url, icon, color] = ep;
  const a = document.createElement('a');
  a.className = 'card';
  a.style.setProperty('--accent', color);
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.innerHTML = `<div class="icon">${icon}</div><div class="title">${title}</div><div class="num">${String(i+1).padStart(2,'0')}</div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>

const TOTAL=20;
let cur=0,playing=false,autoMode=true;
const pl=document.getElementById('player');
const imgEl=document.getElementById('slide-img');
const counterEl=document.getElementById('slide-counter');
const progBar=document.getElementById('prog-bar');
const btnPlay=document.getElementById('btn-play');
const dotsEl=document.getElementById('dots');
for(let i=0;i<TOTAL;i++){
  const d=document.createElement('div');
  d.className='dot'+(i===0?' active':'');
  d.onclick=()=>goSlide(i,true);
  dotsEl.appendChild(d);
}
function render(){
  imgEl.src='data:image/jpeg;base64,'+IMAGES[cur];
  counterEl.textContent=(cur+1)+' / '+TOTAL;
  progBar.style.width='0%';
  document.querySelectorAll('.dot').forEach((d,i)=>d.className='dot'+(i===cur?' active':''));
}
function loadAudio(idx){
  pl.src='https://audio.urantiareaders.com/mirror/audiobook-kr/04/audio/slide-'+String(idx+1).padStart(2,'0')+'.mp3';
}
function goSlide(idx,stop){
  cur=((idx%TOTAL)+TOTAL)%TOTAL;
  if(stop){pl.pause();playing=false;autoMode=false;btnPlay.textContent='▶ 재생';}
  render();loadAudio(cur);
}
function prevSlide(){goSlide(cur-1,true);}
function nextSlide(){goSlide(cur+1,true);}
function togglePlay(){
  if(playing){pl.pause();playing=false;btnPlay.textContent='▶ 재생';}
  else{pl.play();playing=true;autoMode=true;btnPlay.textContent='⏸ 일시정지';}
}
function seekAudio(e){
  if(!pl.duration)return;
  const rect=e.currentTarget.getBoundingClientRect();
  pl.currentTime=(e.clientX-rect.left)/rect.width*pl.duration;
}
pl.ontimeupdate=()=>{if(pl.duration)progBar.style.width=(pl.currentTime/pl.duration*100)+'%';};
pl.onended=()=>{
  progBar.style.width='100%';playing=false;btnPlay.textContent='▶ 재생';
  if(autoMode){
    cur=(cur+1)%TOTAL;render();loadAudio(cur);
    setTimeout(()=>pl.play().then(()=>{playing=true;btnPlay.textContent='⏸ 일시정지';}).catch(()=>{}),300);
  }
};
render();loadAudio(0);
</script>

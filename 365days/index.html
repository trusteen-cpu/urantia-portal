<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>365일 유란시아서와 함께 | Urantia Far East</title>
<meta name="description" content="한 해 365일, 날마다 유란시아서 한 구절과 묵상, 오늘의 실천을 담았습니다.">
<link rel="canonical" href="https://urantiafareast.com/365days/">
<meta property="og:type" content="book">
<meta property="og:title" content="365일 유란시아서와 함께">
<meta property="og:description" content="하루 한 구절, 한 해의 영적 여정">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<script src="/home-button.js" defer></script>
<style>
:root { --a:#1f5f8b; --dk:#123b57; --tint:#eaf2f8; --q:#174a6e; --ink:#2c2a27; --muted:#6d6d73; --bg:#faf8f4; --card:#fff; --rule:#e4dfd5; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.85 "Noto Serif KR", "Batang", serif; word-break: keep-all; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
.top { text-align: center; padding: 56px 0 18px; }
.top h1 { margin: 0; font-size: 30px; line-height: 1.2; color: var(--dk); transition: color .3s; }
.top p { margin: 6px 0 0; color: var(--muted); font-style: italic; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--rule); font: 600 14px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; }
.bar button, .bar select { font: inherit; border: 1px solid var(--rule); background: #fff; color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.bar button:hover { border-color: var(--a); color: var(--a); }
.bar .today { background: var(--a); color: #fff; border-color: var(--a); }
.bar .today:hover { color: #fff; filter: brightness(1.1); }
.card { background: var(--card); border-radius: 14px; box-shadow: 0 2px 14px rgba(0,0,0,.06); padding: 28px 32px 26px; margin-top: 22px; border-top: 5px solid var(--a); }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--a); padding-bottom: 8px; }
.date { font: 700 24px/1.1 "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--a); }
.dayno { font: 12px/1 Georgia, serif; letter-spacing: 3px; color: var(--muted); margin-top: 5px; }
.src { text-align: right; font: 13px/1.45 "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--muted); }
.src a { color: var(--a); font-weight: 700; text-decoration: none; }
.src a:hover { text-decoration: underline; }
h2 { margin: 18px 0 14px; font: 700 26px/1.25 "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--dk); }
blockquote { position: relative; margin: 0 0 20px; padding: 16px 20px 12px 40px; background: var(--tint); border-left: 5px solid var(--a); border-radius: 0 10px 10px 0; color: var(--q); }
blockquote::before { content: "\201C"; position: absolute; left: 10px; top: -8px; font: 54px/1 Georgia, serif; color: var(--a); opacity: .4; }
blockquote p { margin: 0 0 8px; }
blockquote cite { display: block; text-align: right; font: 700 13px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; font-style: normal; color: var(--a); }
.msg p { margin: 0 0 12px; text-align: justify; hyphens: auto; }
.msg p:first-child::first-letter { font: 700 1.6em/1 "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--a); }
.practice { display: flex; gap: 12px; align-items: baseline; margin-top: 18px; padding: 12px 16px; border-radius: 10px; background: var(--a); color: #fff; }
.practice b { flex: none; font: 700 12px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; letter-spacing: 0; padding: 5px 8px; border-radius: 5px; background: rgba(255,255,255,.2); }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; font: 600 14px/1.3 "Noto Sans KR", "Malgun Gothic", sans-serif; }
.nav a { color: var(--a); text-decoration: none; max-width: 48%; }
.nav a:hover { text-decoration: underline; }
.nav .next { text-align: right; margin-left: auto; }
details.toc { margin-top: 30px; background: #fff; border-radius: 12px; padding: 4px 18px; box-shadow: 0 1px 8px rgba(0,0,0,.05); }
details.toc > summary { cursor: pointer; padding: 12px 0; font: 700 16px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--dk); }
.toc h3 { margin: 16px 0 6px; font: 700 14px/1 "Noto Sans KR", "Malgun Gothic", sans-serif; color: #fff; padding: 6px 10px; border-radius: 6px; }
.toc ol { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 24px; }
.toc li { break-inside: avoid; font-size: 14.5px; line-height: 1.45; padding: 3px 0; border-bottom: 1px dotted var(--rule); }
.toc li a { color: var(--ink); text-decoration: none; display: grid; grid-template-columns: 30px 1fr; }
.toc li a:hover { color: var(--a); }
.toc li span { font: 700 13px/1.45 system-ui, sans-serif; }
.about { margin-top: 26px; font-size: 14.5px; color: var(--muted); text-align: center; }
@media (max-width: 600px) {
  body { font-size: 16px; }
  .top { padding-top: 52px; } .top h1 { font-size: 24px; }
  .card { padding: 20px 18px 18px; }
  .head { flex-direction: column; align-items: flex-start; } .src { text-align: left; }
  h2 { font-size: 22px; }
  blockquote { padding: 14px 14px 10px 30px; }
  .toc ol { columns: 1; }
}
@media print { .bar, .nav, details.toc, .ur-home-btn { display: none !important; } body { background: #fff; } .card { box-shadow: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>365일 유란시아서와 함께</h1>
    <p>하루 한 구절, 한 해의 영적 여정</p>
  </header>
  <nav class="bar" aria-label="날짜 고르기">
    <button type="button" id="prev" aria-label="전날">‹ 이전</button>
    <select id="month" aria-label="월"></select>
    <select id="dayOfMonth" aria-label="일"></select>
    <button type="button" id="next" aria-label="다음 날">다음 ›</button>
    <button type="button" class="today" id="today">오늘</button>
  </nav>
  <main id="page" aria-live="polite"><p style="text-align:center;color:#888">불러오는 중…</p></main>
  <details class="toc"><summary>365일 전체 목차</summary><div id="toc"></div></details>
  <p class="about">인용은 유란시아 극동 한글 번역을 따랐습니다. 묵상 글은 각 구절에 대한 해설이며 유란시아서 본문 자체는 아닙니다.</p>
</div>
<script>
var COLORS = [
  ['#1f5f8b','#123b57','#eaf2f8','#174a6e'], ['#7b3f8c','#4a2356','#f4ecf6','#5d2e6b'], ['#2e7d5b','#1b4b37','#e9f4ee','#235f45'],
  ['#c2577a','#7a2f4a','#fbedf2','#9a3b5d'], ['#3f8f3a','#255522','#eef6ea','#2f6e2b'], ['#1d7f8c','#114c54','#e7f4f5','#156570'],
  ['#2b5fb4','#183a70','#eaf0fa','#214b90'], ['#d0782a','#7d4416','#fcf1e6','#a65b1c'], ['#a0682c','#5f3c17','#f7efe5','#7f5222'],
  ['#b5452c','#6d2818','#f9ebe7','#913621'], ['#7a5a3a','#4a3521','#f4efe8','#5f452c'], ['#8c2f3c','#561c25','#f7eaec','#70252f']];
var MN = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
var DAYS = [], cur = 1;
function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function dayFor(m, md) { for (var i = 0; i < DAYS.length; i++) if (DAYS[i].m === m && DAYS[i].md === md) return DAYS[i].d; return null; }
function todayDay() {
  var t = new Date(), m = t.getMonth() + 1, md = t.getDate();
  if (m === 2 && md === 29) md = 28;   // 윤년 2월 29일은 28일 쪽을 보여 준다
  return dayFor(m, md) || 1;
}
function fillDays(m, sel) {
  var dd = document.getElementById('dayOfMonth'); dd.innerHTML = '';
  DAYS.filter(function (x) { return x.m === m; }).forEach(function (x) {
    var o = document.createElement('option'); o.value = x.d; o.textContent = x.md + '일'; if (x.d === sel) o.selected = true; dd.appendChild(o);
  });
}
function show(d, push) {
  d = Math.max(1, Math.min(365, d)); cur = d;
  var x = DAYS[d - 1], c = COLORS[x.m - 1], r = document.documentElement.style;
  r.setProperty('--a', c[0]); r.setProperty('--dk', c[1]); r.setProperty('--tint', c[2]); r.setProperty('--q', c[3]);
  var prev = d > 1 ? DAYS[d - 2] : null, next = d < 365 ? DAYS[d] : null;
  document.getElementById('page').innerHTML =
    '<article class="card">' +
      '<div class="head"><div><div class="date">' + MN[x.m - 1] + ' ' + x.md + '일</div><div class="dayno">DAY ' + ('00' + x.d).slice(-3) + '</div></div>' +
      '<div class="src">' + esc(x.src) + '<br><a href="/textapp/index.html#' + x.cit + '" title="유란시아서 본문에서 열기">' + esc(x.ref) + '</a></div></div>' +
      '<h2>' + esc(x.t) + '</h2>' +
      '<blockquote>' + x.q.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '<cite>— 유란시아서 ' + esc(x.ref) + '</cite></blockquote>' +
      '<div class="msg">' + x.msg.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' +
      '<div class="practice"><b>오늘의 실천</b><span>' + esc(x.pr) + '</span></div>' +
    '</article>' +
    '<div class="nav">' + (prev ? '<a href="#day-' + prev.d + '">‹ ' + MN[prev.m - 1] + ' ' + prev.md + '일: ' + esc(prev.t) + '</a>' : '') +
      (next ? '<a class="next" href="#day-' + next.d + '">' + MN[next.m - 1] + ' ' + next.md + '일: ' + esc(next.t) + ' ›</a>' : '') + '</div>';
  document.getElementById('month').value = x.m; fillDays(x.m, x.d);
  document.title = MN[x.m - 1] + ' ' + x.md + '일: ' + x.t + ' | 365일 유란시아서와 함께';
  if (push && location.hash !== '#day-' + d) history.pushState(null, '', '#day-' + d);
}
function fromHash() { var m = /^#day-(\d+)$/.exec(location.hash); return m ? +m[1] : null; }
fetch('days.json').then(function (r) { return r.json(); }).then(function (data) {
  DAYS = data;
  var ms = document.getElementById('month');
  MN.forEach(function (n, i) { var o = document.createElement('option'); o.value = i + 1; o.textContent = n; ms.appendChild(o); });
  ms.onchange = function () { show(DAYS.filter(function (x) { return x.m === +ms.value; })[0].d, true); };
  document.getElementById('dayOfMonth').onchange = function (e) { show(+e.target.value, true); };
  document.getElementById('prev').onclick = function () { show(cur - 1, true); scrollTo(0, 0); };
  document.getElementById('next').onclick = function () { show(cur + 1, true); scrollTo(0, 0); };
  document.getElementById('today').onclick = function () { show(todayDay(), true); };
  window.addEventListener('hashchange', function () { var h = fromHash(); if (h) { show(h, false); scrollTo(0, 0); } });
  var toc = '';
  MN.forEach(function (n, i) {
    toc += '<h3 style="background:' + COLORS[i][0] + '">' + n + '</h3><ol>' +
      DAYS.filter(function (x) { return x.m === i + 1; }).map(function (x) {
        return '<li><a href="#day-' + x.d + '"><span style="color:' + COLORS[i][0] + '">' + x.md + '</span>' + esc(x.t) + '</a></li>';
      }).join('') + '</ol>';
  });
  document.getElementById('toc').innerHTML = toc;
  show(fromHash() || todayDay(), false);
}).catch(function () { document.getElementById('page').innerHTML = '<p style="text-align:center">날마다의 쪽을 불러오지 못했습니다. 새로 고침해 주십시오.</p>'; });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유란시아서 지도</title>
<meta property="og:title" content="유란시아서 지도">
<meta property="og:description" content="예수의 탄생부터 모론시아 출현까지, 행적을 따라 그린 지도 38장">
<style>
  :root{--bg:#f4efe6;--card:#fffdf8;--ink:#2a2622;--sub:#8a7f72;--brand:#1d2547;--gold:#c8902e;--line:#e6dccb}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all}
  header{background:var(--brand);color:#fff;padding:12px 18px 10px 160px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px}
  header .sub{font-size:12.5px;opacity:.8;margin-top:2px}
  .wrap{display:flex;gap:16px;max-width:1400px;margin:0 auto;padding:14px 14px 30px;align-items:flex-start}
  nav{flex:0 0 300px;position:sticky;top:76px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  nav input{margin:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  nav ol{list-style:none;margin:0;padding:0 6px 8px;overflow-y:auto}
  nav li a{display:flex;gap:8px;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
  nav li a b{flex:0 0 26px;color:var(--gold);font-weight:800;font-size:13px;text-align:right}
  nav li a span small{display:block;color:var(--sub);font-size:12px;margin-top:1px}
  nav li a:hover{background:#f3ead9}
  nav li a.on{background:var(--brand);color:#fff}
  nav li a.on b,nav li a.on span small{color:#f3d79a}
  main{flex:1;min-width:0}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .bar h2{flex:1;margin:0;font-size:20px;font-weight:800}
  .bar h2 small{color:var(--gold);margin-right:8px}
  .bar button,.bar a{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;text-decoration:none}
  .bar button:disabled{opacity:.4;cursor:default}
  .meta{color:var(--sub);font-size:13.5px;margin:0 0 10px}
  .img{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:300px}
  .img img{display:block;width:100%;height:auto}
  .note{color:var(--sub);font-size:12.5px;line-height:1.6;margin-top:10px}
  nav select{display:none;margin:0 10px 10px;padding:8px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff}
  @media(max-width:820px){
    header{padding:50px 14px 10px}
    .wrap{display:block;padding:10px}
    nav{position:static;max-height:none;margin-bottom:10px}
    nav ol{display:none}
    nav select{display:block}
    .bar h2{font-size:17px}
  }
  @media print{
    @page{size:A4;margin:6mm}
    body{background:#fff}
    header,nav,.bar,.note,.ur-home-btn{display:none!important}
    .wrap{display:block;padding:0;max-width:none}
    .img{border:none;border-radius:0;min-height:0}
    .img img{width:auto;max-width:100%;max-height:270mm;margin:0 auto}
  }
</style>
</head>
<body>
<header><h1>유란시아서 지도</h1><div class="sub">예수의 탄생부터 모론시아 출현까지 — 행적을 따라 그린 지도 38장</div></header>
<div class="wrap">
  <nav>
    <input id="q" type="search" placeholder="제목·지명·연도 찾기">
    <select id="sel" aria-label="지도 고르기"></select>
    <ol id="list"></ol>
  </nav>
  <main>
    <div class="bar">
      <h2 id="ttl"></h2>
      <button id="prev" aria-label="이전 지도">◀</button>
      <button id="next" aria-label="다음 지도">▶</button>
      <a id="full" target="_blank" rel="noopener">원본 크기</a>
      <button id="prt">🖨 인쇄</button>
    </div>
    <p class="meta" id="meta"></p>
    <div class="img" id="view"></div>
    <p class="note">지명·날짜·경로는 유란시아서 새번역본 본문을 기준으로 새로 그렸습니다. 본문에 나오지 않는 길은 점선으로, 예루살렘 안처럼 좁은 곳은 위치 개략도로 표시했습니다. 마을 위치는 근사치이며, 바탕 지형은 Natural Earth(현대 해안선·호수, 퍼블릭 도메인)입니다.</p>
  </main>
</div>
<script src="list.js"></script>
<script>
(function(){
  var L = window.MAPS || [], cur = 0;
  function src(n){ return 'img/m' + ('0' + n).slice(-2) + '.webp'; }
  function at(n){ for (var i = 0; i < L.length; i++) if (L[i][0] === n) return i; return 0; }
  var list = document.getElementById('list'), sel = document.getElementById('sel');
  list.innerHTML = L.map(function(x){
    return '<li><a href="#m' + x[0] + '" data-n="' + x[0] + '"><b>' + x[0] + '</b><span>' + x[1] + '<small>' + x[2] + '</small></span></a></li>';
  }).join('');
  sel.innerHTML = L.map(function(x){ return '<option value="' + x[0] + '">지도 ' + x[0] + ' · ' + x[1] + '</option>'; }).join('');
  function show(i){
    var x = L[i]; if (!x) return; cur = i;
    document.getElementById('ttl').innerHTML = '<small>지도 ' + x[0] + '</small>' + x[1];
    document.getElementById('meta').textContent = x[2] + (x[3] ? '  ·  ' + x[3] : '');
    document.getElementById('view').innerHTML = '<a href="' + src(x[0]) + '" target="_blank" rel="noopener"><img src="' + src(x[0]) + '" alt="지도 ' + x[0] + ' ' + x[1] + '"></a>';
    document.getElementById('full').href = src(x[0]);
    var as = list.querySelectorAll('a');
    for (var k = 0; k < as.length; k++) as[k].className = (+as[k].getAttribute('data-n') === x[0] ? 'on' : '');
    sel.value = x[0];
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === L.length - 1;
    var on = list.querySelector('a.on'); if (on && on.scrollIntoView && window.innerWidth > 820) on.scrollIntoView({block:'nearest'});
    document.title = '지도 ' + x[0] + ' ' + x[1] + ' · 유란시아서 지도';
  }
  function fromHash(){ var m = /^#m(\d+)$/.exec(location.hash); show(m ? at(+m[1]) : 0); }
  function go(i){ location.hash = '#m' + L[i][0]; window.scrollTo(0, 0); }
  sel.onchange = function(){ go(at(+sel.value)); };
  document.getElementById('prt').onclick = function(){ window.print(); };
  document.getElementById('prev').onclick = function(){ if (cur > 0) go(cur - 1); };
  document.getElementById('next').onclick = function(){ if (cur < L.length - 1) go(cur + 1); };
  document.getElementById('q').oninput = function(){
    var k = this.value.replace(/\s+/g, '');
    var li = list.querySelectorAll('li');
    for (var i = 0; i < li.length; i++) {
      var x = L[i], t = ('지도' + x[0] + x[1] + x[2] + x[3]).replace(/\s+/g, '');
      li[i].style.display = !k || t.indexOf(k) >= 0 ? '' : 'none';
    }
  };
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
<script src="/home-button.js" data-pos="left" defer></script>
</body>
</html>

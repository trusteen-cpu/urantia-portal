<style>
  :root{
    --ink:#0d1626;
    --ink-2:#142138;
    --paper:#f7f3ea;
    --paper-dim:rgba(247,243,234,.72);
    --paper-faint:rgba(247,243,234,.45);
    --gold:#d8b26a;
    --gold-soft:rgba(216,178,106,.28);
    --line:rgba(216,178,106,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #1d2f4e 0%, rgba(29,47,78,0) 60%),
      radial-gradient(700px 500px at 85% 110%, #1a2a44 0%, rgba(26,42,68,0) 65%),
      var(--ink);
    color:var(--paper);
    font-family:'Noto Sans KR', system-ui, -apple-system, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:48px 16px;
  }
  .stars{position:fixed;inset:0;pointer-events:none;opacity:.5}
  .card{
    position:relative;
    width:100%; max-width:560px;
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02));
    border:1px solid var(--line);
    border-radius:20px;
    padding:52px 40px 44px;
    box-shadow:0 30px 70px rgba(0,0,0,.45);
    text-align:center;
    backdrop-filter:blur(2px);
  }
  .mark{
    width:58px;height:58px;margin:0 auto 26px;
    display:block;
  }
  .eyebrow{
    font-size:12px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--gold); font-weight:500; margin-bottom:18px;
  }
  h1{
    font-family:'Nanum Myeongjo', serif;
    font-size:clamp(34px, 8vw, 46px);
    font-weight:800; line-height:1.25; letter-spacing:-.01em;
    text-wrap:balance;
  }
  h1 .q{color:var(--gold)}
  .sub{
    margin-top:16px; font-size:15px; line-height:1.85;
    color:var(--paper-dim); font-weight:400;
    text-wrap:balance;
  }
  .rule{
    width:100%; height:1px; margin:32px 0 28px;
    background:linear-gradient(90deg, transparent, var(--gold-soft) 20%, var(--gold-soft) 80%, transparent);
  }
  .facts{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px 12px;
    margin-bottom:34px;
  }
  .fact{
    font-size:12.5px; letter-spacing:.02em;
    color:var(--paper-dim);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 15px;
    font-variant-numeric:tabular-nums;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:17px 24px;
    background:linear-gradient(180deg,#e4c079,#cfa355);
    color:#20180a; text-decoration:none;
    font-size:16.5px; font-weight:700; letter-spacing:.01em;
    border-radius:12px;
    box-shadow:0 10px 26px rgba(216,178,106,.22);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 16px 34px rgba(216,178,106,.3); filter:brightness(1.04)}
  .btn:active{transform:translateY(0)}
  .btn:focus-visible{outline:2px solid var(--paper); outline-offset:3px}
  .btn svg{flex:0 0 auto}
  .hint{
    margin-top:16px; font-size:12.5px; line-height:1.8; color:var(--paper-faint);
  }
  .verse{
    margin-top:34px; padding-top:26px;
    border-top:1px solid var(--line);
    font-family:'Nanum Myeongjo', serif;
    font-size:14.5px; line-height:1.95; color:var(--paper-dim);
    text-wrap:balance;
  }
  .verse .cite{
    display:block; margin-top:10px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:11.5px; letter-spacing:.18em; color:var(--gold);
  }
  @media (max-width:420px){
    .card{padding:40px 24px 34px; border-radius:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .btn{transition:none}
  }
</style>

<body>
<canvas class="stars" id="stars" aria-hidden="true"></canvas>

<main class="card">
  <svg class="mark" viewBox="0 0 64 64" role="img" aria-label="세 개의 동심원">
    <circle cx="32" cy="32" r="27" fill="none" stroke="#d8b26a" stroke-width="1.1" opacity=".55"/>
    <circle cx="32" cy="32" r="18" fill="none" stroke="#d8b26a" stroke-width="1.3" opacity=".8"/>
    <circle cx="32" cy="32" r="9" fill="none" stroke="#d8b26a" stroke-width="1.6"/>
    <circle cx="32" cy="32" r="2.6" fill="#d8b26a"/>
  </svg>

  <p class="eyebrow">한국어 완역</p>
  <h1><span class="q">「</span>유란시아서<span class="q">」</span> 전문</h1>
  <p class="sub">머리말부터 제196편까지, 한 권을 그대로 담은 워드 문서입니다.<br>내려받아 워드·한글·구글 문서에서 바로 읽으실 수 있습니다.</p>

  <div class="rule"></div>

  <div class="facts">
    <span class="fact">워드 문서 (.docx)</span>
    <span class="fact">197편 · 14,586절</span>
    <span class="fact">약 5.3 MB</span>
  </div>

  <a class="btn" href="urantia-book-ko.docx" download>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M4 21h16"></path>
    </svg>
    워드 파일 받기
  </a>
  <p class="hint">단추를 누르면 파일이 내려받아집니다. 휴대폰에서는 내려받은 뒤 워드 앱이나 구글 문서로 열어 보세요.</p>

  <p class="verse">
    “그는 두루 다니며 선을 행했다.”
    <span class="cite">171 : 7.9</span>
  </p>
</main>

<script>
(function(){
  var c = document.getElementById('stars');
  if(!c || !c.getContext) return;
  var ctx = c.getContext('2d');
  function draw(){
    var w = c.width = window.innerWidth, h = c.height = window.innerHeight;
    ctx.clearRect(0,0,w,h);
    var n = Math.min(160, Math.round(w*h/9000));
    for(var i=0;i<n;i++){
      var x = Math.random()*w, y = Math.random()*h;
      var r = Math.random()*1.1 + .2;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle = 'rgba(232,223,205,' + (Math.random()*0.5 + 0.12) + ')';
      ctx.fill();
    }
  }
  draw();
  var t;
  window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(draw, 200); });
})();
</script>
</body>

<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한영대조 본문 — 한국 유란시아서 독자회</title>
<meta name="description" content="유란시아서 196편 전문을 영어 원문과 한글 4차 교정본으로 절마다 나란히 읽습니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="한국 유란시아서 독자회">
<meta property="og:title" content="유란시아서 한영대조 본문">
<meta property="og:description" content="영어 원문과 한글 번역을 절마다 나란히 — 머리말과 196편 전문">
<meta property="og:url" content="https://urantiareaders.com/bilingual/">
<style>
:root{
  --bg:#fdf8f0; --surface:#fffcf5; --surface2:#f5ede0; --line:#e3d6bd;
  --gold:#8b6914; --gold-soft:rgba(139,105,20,.12); --ink:#2c1f0e; --dim:#6b5536; --muted:#9a8566;
  --en:#1f3550; --fs:17px; --side:300px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15130f; --surface:#1c1a15; --surface2:#24211a; --line:#3a3428;
  --gold:#d6b35a; --gold-soft:rgba(214,179,90,.14); --ink:#e9e2d2; --dim:#bfb299; --muted:#8c806b; --en:#c9d8ec;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Serif KR","나눔명조","Nanum Myeongjo","Malgun Gothic",Georgia,serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px}
header .home{font-size:12.5px;color:var(--muted);text-decoration:none}
header h1{margin:0;font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.01em}
header .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--dim);font-size:12.5px;padding:5px 11px}
.seg button.on{background:var(--gold);color:#fff}
.tb{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px}
#tocBtn{display:none}

main{display:flex;align-items:flex-start}
#side{width:var(--side);flex:0 0 var(--side);position:sticky;top:51px;height:calc(100vh - 51px);overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);padding:10px 10px 40px}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
#sideClose{display:none;margin:0 0 8px auto}
.hint{font-size:11.5px;color:var(--muted);margin:5px 2px 4px}
.part{margin:14px 6px 4px;font-size:11.5px;letter-spacing:.08em;color:var(--gold);font-weight:700}
.pi{display:grid;grid-template-columns:34px 1fr;gap:2px 6px;padding:6px 8px;border-radius:8px;cursor:pointer}
.pi:hover{background:var(--gold-soft)}
.pi.on{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.pi b{font-size:12px;color:var(--gold);grid-row:span 2;padding-top:2px}
.pi .k{font-size:14px}
.pi .e{font-size:11.5px;color:var(--muted);font-family:Georgia,"Times New Roman",serif}

#body{flex:1;min-width:0;padding:24px 28px 90px}
.wrap{max-width:1180px;margin:0 auto}
.ph{margin:0 0 20px;padding-bottom:16px;border-bottom:2px solid var(--line)}
.ph .no{font-size:12px;letter-spacing:.16em;color:var(--gold)}
.ph .te{font-family:Georgia,"Times New Roman",serif;font-size:25px;color:var(--en);margin:6px 0 2px;text-wrap:balance}
.ph .tk{font-size:24px;font-weight:700;text-wrap:balance}
.cols{display:grid;grid-template-columns:62px 1fr 1fr;gap:0 22px}
.colh{font-size:11.5px;letter-spacing:.14em;color:var(--muted);padding:0 0 8px}
.sh{grid-column:1/-1;margin:28px 0 10px;padding:8px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:62px 1fr 1fr;gap:0 22px}
.sh .n{color:var(--gold);font-weight:700}
.sh .e{font-family:Georgia,"Times New Roman",serif;color:var(--en);font-size:18px}
.sh .k{font-size:18px;font-weight:700}
.v{display:contents}
.v .r{font-size:12px;color:var(--gold);padding-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.v .e{font-family:Georgia,"Times New Roman",serif;color:var(--en);font-size:calc(var(--fs) - .5px);line-height:1.75;margin:0 0 16px}
.v .k{font-size:var(--fs);line-height:1.9;margin:0 0 16px;word-break:keep-all}
.v.hit .e,.v.hit .k{background:var(--gold-soft);border-radius:6px}
body.en .cols,body.en .sh,body.ko .cols,body.ko .sh{grid-template-columns:62px 1fr}
body.en .k,body.ko .e{display:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:34px}
.nav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;max-width:48%;text-align:left}
.loading{color:var(--muted);padding:40px 0}

@media (max-width:860px){
  #tocBtn{display:inline-block}
  #side{position:fixed;left:0;top:0;height:100%;width:min(86vw,var(--side));z-index:40;transform:translateX(-105%);transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  #sideClose{display:block}
  body.toc #side{transform:none}
  #body{padding:16px 12px 80px}
  /* 좁은 화면에서도 영문(왼쪽) / 한글(오른쪽) 두 칸을 유지하고, 절 번호만 위로 올린다 */
  .cols,.sh{grid-template-columns:1fr 1fr;gap:0 12px}
  body.en .cols,body.ko .cols,body.en .sh,body.ko .sh{grid-template-columns:1fr}
  .colh:first-child{display:none}
  .v .r,.sh .n{grid-column:1/-1;padding-top:12px}
  .v .e{font-size:calc(var(--fs) - 2.5px);line-height:1.65;margin:2px 0 10px}
  .v .k{font-size:calc(var(--fs) - 2px);line-height:1.75;margin:2px 0 10px}
  .v .e,.v .k{padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .sh .e,.sh .k{font-size:15px}
}
/* 휴대폰: 좌우가 너무 좁으므로 영문 위, 한글 아래 */
@media (max-width:600px){
  .cols,.sh{grid-template-columns:1fr}
  .colh{display:none}
  .v .e{font-size:calc(var(--fs) - 1px);margin:2px 0 6px;padding-bottom:0;border-bottom:0}
  .v .k{font-size:var(--fs);margin:0 0 8px}
  body.en .v .e{padding-bottom:10px;border-bottom:1px dashed var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<header>
  <button class="tb" id="tocBtn" aria-label="목차 열기">☰ 목차</button>
  <div><a class="home" href="/">한국 유란시아서 독자회</a><h1>한영대조 본문</h1></div>
  <div class="sp"></div>
  <div class="seg" role="group" aria-label="보기">
    <button data-m="both" class="on">나란히</button><button data-m="en">English</button><button data-m="ko">한글</button>
  </div>
  <button class="tb" id="fsDown" aria-label="글자 작게">가−</button>
  <button class="tb" id="fsUp" aria-label="글자 크게">가+</button>
</header>
<main>
  <nav id="side" aria-label="편 목차">
    <button class="tb" id="sideClose">닫기 ✕</button>
    <input id="q" type="search" placeholder="편 이름 검색 또는 5:1.2" autocomplete="off">
    <div class="hint">번호(예: 101)·제목·English title, 또는 편:장.절</div>
    <div id="toc"></div>
  </nav>
  <section id="body"><div class="wrap" id="view"><div class="loading">불러오는 중…</div></div></section>
</main>

<script>
var PARTS=[], TOC=[], CACHE={}, CUR=null, PENDING=null;
var $=function(s){return document.querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
function UB_TOC(parts,toc){PARTS=parts;TOC=toc;renderToc('');start()}
function UB_P(n,d){CACHE[n]=d; if(PENDING===n) show(n)}
function load(src){var s=document.createElement('script');s.src=src;document.head.appendChild(s)}
function pname(n){return n?('제'+n+'편'):'머리말'}

/* 목차 */
function renderToc(q){
  q=(q||'').trim().toLowerCase(); var h='', lastPart=-1;
  TOC.forEach(function(t){
    var n=t[0], hay=(n+' '+t[1]+' '+t[2]).toLowerCase();
    if(q && hay.indexOf(q)<0 && String(n)!==q) return;
    if(t[3]!==lastPart){ lastPart=t[3]; h+='<div class="part">'+esc(PARTS[t[3]][3])+'</div>'; }
    h+='<div class="pi'+(n===CUR?' on':'')+'" data-n="'+n+'" tabindex="0"><b>'+(n||'序')+'</b><span class="k">'+esc(t[2])+'</span><span class="e">'+esc(t[1])+'</span></div>';
  });
  $('#toc').innerHTML=h||'<div class="hint">찾는 편이 없습니다.</div>';
}
$('#toc').addEventListener('click',function(e){var p=e.target.closest('.pi'); if(p) go(+p.dataset.n)});
$('#toc').addEventListener('keydown',function(e){if(e.key==='Enter'){var p=e.target.closest('.pi'); if(p) go(+p.dataset.n)}});
$('#q').addEventListener('input',function(){
  var v=this.value.trim(), m=v.match(/^(\d+):(\d+)\.(\d+)$/);
  if(m){ go(+m[1], v); return; }
  renderToc(v);
});

/* 편 보기 */
function go(n,ref){
  if(n<0||n>196) return;
  CUR=n; PENDING=n; CUR_REF=ref||null;
  document.body.classList.remove('toc');
  history.replaceState(null,'','#'+(ref||('p'+n))); store('bi.last',String(n));
  if(CACHE[n]) show(n); else { $('#view').innerHTML='<div class="loading">불러오는 중…</div>'; load('data/p'+String(n).padStart(3,'0')+'.js'); }
  renderToc($('#q').value.match(/^\d+:\d+\.\d+$/)?'':$('#q').value);
}
var CUR_REF=null;
function show(n){
  if(n!==CUR) return; var d=CACHE[n];
  var h='<div class="ph"><div class="no">'+(n?'PAPER '+n+' · 제'+n+'편':'FOREWORD · 머리말')+'</div><div class="te">'+esc(d.en)+'</div><div class="tk">'+esc(d.ko)+'</div></div>';
  h+='<div class="cols"><div class="colh"></div><div class="colh e">ENGLISH</div><div class="colh k">한글 (4차 교정본)</div>';
  d.s.forEach(function(s){
    if(s.n) h+='<div class="sh"><span class="n">'+esc(s.lab||(n===0?roman(s.n):s.n))+'.</span><span class="e">'+esc(s.en)+'</span><span class="k">'+esc(s.ko)+'</span></div>';
    s.v.forEach(function(v){
      h+='<div class="v" id="v'+v[0].replace(/[:.]/g,'_')+'"><div class="r">'+v[0]+'</div><p class="e" lang="en">'+esc(v[1])+'</p><p class="k">'+esc(v[2])+'</p></div>';
    });
  });
  h+='</div><div class="nav">'+(n>0?'<button data-go="'+(n-1)+'">← '+pname(n-1)+' '+esc(TOC[n-1][2])+'</button>':'<span></span>')+
     (n<196?'<button data-go="'+(n+1)+'">'+pname(n+1)+' '+esc(TOC[n+1][2])+' →</button>':'')+'</div>';
  $('#view').innerHTML=h;
  if(CUR_REF){ var el=document.getElementById('v'+CUR_REF.replace(/[:.]/g,'_'));
    if(el){ el.classList.add('hit'); var p=el.querySelector('.e'); (p.offsetParent?p:el.querySelector('.k')).scrollIntoView({block:'center'}); return; } }
  window.scrollTo(0,0);
}
function roman(k){return ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][k]||k}
$('#view').addEventListener('click',function(e){var b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go)});

/* 보기 방식 · 글자 크기 */
function setMode(m){document.body.classList.remove('en','ko'); if(m!=='both') document.body.classList.add(m);
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===m)}); store('bi.mode',m)}
document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){setMode(b.dataset.m)}});
var FS=+(store('bi.fs')||17);
function setFs(v){FS=Math.max(14,Math.min(24,v)); document.documentElement.style.setProperty('--fs',FS+'px'); store('bi.fs',String(FS))}
$('#fsUp').onclick=function(){setFs(FS+1)}; $('#fsDown').onclick=function(){setFs(FS-1)};
$('#tocBtn').onclick=function(){document.body.classList.toggle('toc')};
$('#sideClose').onclick=function(){document.body.classList.remove('toc')};
addEventListener('keydown',function(e){if(e.key==='Escape') document.body.classList.remove('toc')});

function start(){
  setFs(FS); setMode(store('bi.mode')||'both');
  var h=location.hash.slice(1), m=h.match(/^(\d+):\d+\.\d+$/), p=h.match(/^p(\d+)$/);
  if(m) go(+m[1],h); else if(p) go(+p[1]); else go(+(store('bi.last')||1));
}
</script>
<script src="data/toc.js"></script>
</body></html>

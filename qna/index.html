<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>유란시아서 천문천답</title>
<style>
  :root{
    --bg:#f7f5f0;
    --card:#ffffff;
    --ink:#2b2a28;
    --sub:#6b6560;
    --accent:#7a4a2b;
    --accent-soft:#efe6da;
    --border:#e6e1d8;
    --shadow:0 1px 3px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;
    line-height:1.6;
    padding-bottom:40px;
  }
  header{
    background:var(--accent);
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.2px;
    cursor:pointer;
  }
  header .sub{
    margin-top:2px;
    font-size:12.5px;
    opacity:0.85;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:14px 12px 0;
  }
  .status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--sub);
    margin:2px 4px 10px;
  }
  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 14px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .item:active{ background:var(--accent-soft); }
  .badge{
    flex:0 0 auto;
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:700;
    font-size:12.5px;
    padding:4px 8px;
    border-radius:999px;
    white-space:nowrap;
    margin-top:1px;
  }
  .badge.none{ visibility:hidden; }
  .item-main{ flex:1; min-width:0; }
  .item-title{
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    word-break:keep-all;
  }
  .item-date{
    margin-top:4px;
    font-size:12px;
    color:var(--sub);
  }
  .pager{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:18px 4px 4px;
  }
  .pager button{
    flex:1;
    padding:13px 10px;
    font-size:15px;
    font-weight:600;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .pager button:disabled{
    opacity:0.35;
    cursor:default;
  }
  .pager .page-info{
    flex:0 0 auto;
    font-size:13px;
    color:var(--sub);
    white-space:nowrap;
    padding:0 4px;
  }
  /* detail view */
  .detail{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 16px 22px;
    box-shadow:var(--shadow);
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--accent);
    font-size:15px;
    font-weight:600;
    padding:6px 2px 14px;
    cursor:pointer;
  }
  .detail .badge{ margin-bottom:8px; }
  .detail h2{
    margin:6px 0 4px;
    font-size:19px;
    line-height:1.45;
    word-break:keep-all;
  }
  .detail .item-date{ margin-bottom:16px; }
  .answer{
    word-break:keep-all;
    font-size:15.5px;
    color:#333;
  }
  .answer p{
    margin:0 0 14px;
  }
  .answer p:last-child{ margin-bottom:0; }
  .answer p.ans-heading{
    font-weight:700;
    color:var(--accent);
    margin-top:18px;
    margin-bottom:8px;
  }
  .answer strong{ color:var(--ink); font-weight:700; }
  .empty, .loading{
    text-align:center;
    color:var(--sub);
    padding:60px 20px;
    font-size:14px;
  }
  [hidden]{ display:none !important; }
</style>
<meta property="og:title" content="유란시아서 천문천답">
<meta property="og:description" content="유란시아서에 관한 질문과 답변 모음">
<meta property="og:url" content="https://urantiareaders.com/qna/">
<script src="/home-button.js" defer></script>
<script src="/kakao-notice.js" defer></script>
</head>
<body>
<header>
  <h1 id="titleLink">유란시아서 천문천답</h1>
  <div class="sub">유란시아서에 관한 질문과 답변 모음</div>
</header>

<main>
  <div id="loading" class="loading">불러오는 중...</div>

  <div id="listView" hidden>
    <div class="status-bar">
      <span id="rangeLabel"></span>
      <span id="totalLabel"></span>
    </div>
    <div class="list" id="list"></div>
    <div class="pager">
      <button id="prevBtn">← 이전 30개</button>
      <span class="page-info" id="pageInfo"></span>
      <button id="nextBtn">다음 30개 →</button>
    </div>
  </div>

  <div id="detailView" hidden>
    <button class="back-btn" id="backBtn">← 목록으로</button>
    <div class="detail">
      <span class="badge" id="detailBadge"></span>
      <h2 id="detailTitle"></h2>
      <div class="item-date" id="detailDate"></div>
      <div class="answer" id="detailAnswer"></div>
    </div>
  </div>

  <div id="emptyView" class="empty" hidden>아직 등록된 질문이 없습니다.</div>
</main>

<script>
const PAGE_SIZE = 30;
let DATA = [];

function qs(name){
  const params = new URLSearchParams(location.search);
  return params.get(name);
}

function setQuery(params){
  const url = new URL(location.href);
  url.search = '';
  Object.entries(params).forEach(([k,v]) => {
    if (v !== null && v !== undefined) url.searchParams.set(k, v);
  });
  history.pushState({}, '', url);
}

function fmtDate(d){
  if(!d) return '';
  return d.replace(/-/g,'.');
}

function renderList(){
  document.getElementById('detailView').hidden = true;
  document.getElementById('listView').hidden = false;

  const page = Math.max(1, parseInt(qs('page') || '1', 10));
  const total = DATA.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const curPage = Math.min(page, totalPages);

  const start = (curPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, total);
  const pageItems = DATA.slice(start, end);

  document.getElementById('rangeLabel').textContent =
    total === 0 ? '' : `${start + 1}~${end} / 전체 ${total}개`;
  document.getElementById('totalLabel').textContent = '';

  const listEl = document.getElementById('list');
  listEl.innerHTML = '';
  pageItems.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    el.onclick = () => openDetail(item.id);
    const badgeText = item.number ? `문 ${item.number}` : '';
    el.innerHTML = `
      <span class="badge ${badgeText ? '' : 'none'}">${badgeText || '·'}</span>
      <div class="item-main">
        <div class="item-title">${escapeHtml(item.question)}</div>
        <div class="item-date">${fmtDate(item.date)}</div>
      </div>`;
    listEl.appendChild(el);
  });

  document.getElementById('pageInfo').textContent = `${curPage} / ${totalPages}`;
  document.getElementById('prevBtn').disabled = curPage <= 1;
  document.getElementById('nextBtn').disabled = curPage >= totalPages;

  document.getElementById('prevBtn').onclick = () => {
    setQuery({page: curPage - 1});
    renderList();
    window.scrollTo(0,0);
  };
  document.getElementById('nextBtn').onclick = () => {
    setQuery({page: curPage + 1});
    renderList();
    window.scrollTo(0,0);
  };

  document.getElementById('emptyView').hidden = total > 0;
  document.getElementById('listView').hidden = total === 0;
}

function openDetail(id){
  const item = DATA.find(d => d.id === id);
  if(!item) return;
  setQuery({page: qs('page') || '1', q: id});
  document.getElementById('listView').hidden = true;
  document.getElementById('detailView').hidden = false;

  const badgeText = item.number ? `문 ${item.number}` : '';
  const badgeEl = document.getElementById('detailBadge');
  badgeEl.textContent = badgeText || '';
  badgeEl.style.visibility = badgeText ? 'visible' : 'hidden';
  document.getElementById('detailTitle').textContent = item.question;
  document.getElementById('detailDate').textContent = fmtDate(item.date);
  document.getElementById('detailAnswer').innerHTML = renderAnswer(item.answer);
  window.scrollTo(0,0);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderInline(s){
  // escape then convert **bold** to <strong>
  let out = escapeHtml(s);
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return out;
}

function renderAnswer(text){
  const paragraphs = text.split(/\n\n+/);
  return paragraphs.map(p => {
    const isHeading = /^\d+\.\s/.test(p.trim()) && p.trim().length < 60;
    const html = renderInline(p.trim());
    return isHeading ? `<p class="ans-heading">${html}</p>` : `<p>${html}</p>`;
  }).join('');
}

document.getElementById('backBtn').onclick = () => {
  setQuery({page: qs('page') || '1'});
  renderList();
};
document.getElementById('titleLink').onclick = () => {
  setQuery({page: '1'});
  renderList();
  window.scrollTo(0,0);
};

window.addEventListener('popstate', init);

function init(){
  const q = qs('q');
  if(q){
    openDetail(parseInt(q,10));
  } else {
    renderList();
  }
}

fetch('data.json?t=' + Date.now(), {cache: 'no-store'})
  .then(r => r.json())
  .then(data => {
    DATA = data;
    document.getElementById('loading').hidden = true;
    init();
  })
  .catch(err => {
    document.getElementById('loading').textContent = '데이터를 불러오지 못했습니다.';
    console.error(err);
  });
</script>
</body>
</html>

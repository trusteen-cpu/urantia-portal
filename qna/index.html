<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유란시아서 천문천답</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2a28; --sub:#6b6560;
    --accent:#7a4a2b; --accent-soft:#efe6da; --border:#e6e1d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    font-size:16px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden;
  }
  header{background:var(--accent);color:#fff;padding:12px 16px;flex:none;display:flex;align-items:baseline;gap:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:2}
  header h1{margin:0;font-size:18px;font-weight:700;cursor:pointer;white-space:nowrap}
  header .sub{font-size:12.5px;opacity:.85}
  main{flex:1;display:flex;min-height:0}

  /* 왼쪽: 질문 목록 */
  .side{width:360px;flex:none;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .srch{padding:10px;border-bottom:1px solid var(--border);flex:none}
  #q{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:18px;font-size:14px;outline:none;background:#fbfaf7}
  #q:focus{border-color:var(--accent)}
  .cnt{font-size:12px;color:var(--sub);margin:6px 4px 0}
  .list{overflow-y:auto;flex:1;padding:4px 0 30px}
  .item{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid #f1ede6;cursor:pointer}
  .item:hover{background:#faf6f0}
  .item.on{background:var(--accent-soft)}
  .item.on .item-title{color:var(--accent);font-weight:700}
  .badge{flex:none;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px;white-space:nowrap;margin-top:1px}
  .item.on .badge{background:var(--accent);color:#fff}
  .badge.none{visibility:hidden}
  .item-main{flex:1;min-width:0}
  .item-title{font-size:14.5px;font-weight:600;word-break:keep-all;line-height:1.5}
  .item-date{margin-top:2px;font-size:11.5px;color:var(--sub)}

  /* 오른쪽: 답변 */
  .view{flex:1;min-width:0;overflow-y:auto}
  .detail{max-width:820px;margin:0 auto;padding:30px 30px 70px}
  .back-btn{display:none;align-items:center;gap:4px;background:none;border:none;color:var(--accent);font-size:15px;font-weight:600;padding:4px 2px 12px;cursor:pointer}
  .detail h2{margin:8px 0 4px;font-size:23px;line-height:1.45;word-break:keep-all}
  .detail .item-date{margin-bottom:6px;font-size:12.5px}
  .rule{height:2px;margin:12px 0 22px;background:linear-gradient(90deg,var(--accent),rgba(122,74,43,0))}
  .answer{word-break:keep-all;font-size:16.5px;line-height:1.9;color:#333}
  .answer p{margin:0 0 15px}
  .answer p:last-child{margin-bottom:0}
  .answer p.ans-heading{font-weight:700;color:var(--accent);font-size:17.5px;margin:26px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
  .answer strong{color:var(--ink);font-weight:700}
  .pn{display:flex;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--border)}
  .pn button{flex:1;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 14px;font:inherit;font-size:12.5px;color:var(--sub);line-height:1.45;cursor:pointer}
  .pn button b{display:block;color:var(--ink);font-size:14px;margin-top:2px;word-break:keep-all}
  .pn button.nx{text-align:right}
  .pn button:hover{border-color:var(--accent)}
  .pn .gap{flex:1}
  .empty,.loading{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px}
  [hidden]{display:none!important}

  /* 휴대폰: 목록과 답변을 한 번에 하나씩 */
  @media (max-width:760px){
    header .sub{display:none}
    .side{width:100%;border-right:0}
    body.reading .side{display:none}
    body:not(.reading) .view{display:none}
    .back-btn{display:inline-flex}
    .detail{padding:16px 16px 60px}
    .detail h2{font-size:20px}
    .answer{font-size:16px;line-height:1.85}
  }
</style>
<meta property="og:title" content="유란시아서 천문천답">
<meta property="og:description" content="유란시아서에 관한 질문과 답변 모음">
<meta property="og:url" content="https://urantiareaders.com/qna/">
<script src="/home-button.js" data-top="54" defer></script>
<script src="/kakao-notice.js" defer></script>
</head>
<body>
<header>
  <h1 id="titleLink">유란시아서 천문천답</h1>
  <div class="sub">유란시아서에 관한 질문과 답변 모음 — 왼쪽에서 질문을 누르십시오</div>
</header>

<main>
  <aside class="side">
    <div class="srch">
      <input id="q" type="search" placeholder="질문 찾기 (번호나 낱말)" autocomplete="off">
      <div class="cnt" id="cnt"></div>
    </div>
    <div class="list" id="list"><div id="loading" class="loading">불러오는 중...</div></div>
  </aside>

  <section class="view" id="view">
    <div class="detail" id="detail" hidden>
      <button class="back-btn" id="backBtn">← 질문 목록</button>
      <div><span class="badge" id="detailBadge"></span></div>
      <h2 id="detailTitle"></h2>
      <div class="item-date" id="detailDate"></div>
      <div class="rule"></div>
      <div class="answer" id="detailAnswer"></div>
      <div class="pn" id="pn"></div>
    </div>
    <div id="emptyView" class="empty" hidden>아직 등록된 질문이 없습니다.</div>
  </section>
</main>

<script>
// 왼쪽에 질문 전체, 오른쪽에 답변. 휴대폰에서는 질문을 누르면 목록이 사라지고 답변만 보인다.
// 주소 ?q=번호 로 한 질문을 바로 열 수 있다(카톡으로 보낸 링크와 같은 형식).
let DATA = [];
const $ = id => document.getElementById(id);
const mobile = () => window.matchMedia('(max-width:760px)').matches;

function qs(name){ return new URLSearchParams(location.search).get(name); }
function fmtDate(d){ return d ? d.replace(/-/g,'.') : ''; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderInline(s){ return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function renderAnswer(text){
  return text.split(/\n\n+/).map(p => {
    const isHeading = /^\d+\.\s/.test(p.trim()) && p.trim().length < 60;
    const html = renderInline(p.trim());
    return isHeading ? `<p class="ans-heading">${html}</p>` : `<p>${html}</p>`;
  }).join('');
}
const badgeOf = item => item.number ? `문 ${item.number}` : '';

function buildList(){
  const listEl = $('list');
  listEl.innerHTML = DATA.map(item => `
    <div class="item" data-id="${escapeHtml(item.id)}">
      <span class="badge ${badgeOf(item) ? '' : 'none'}">${badgeOf(item) || '·'}</span>
      <div class="item-main">
        <div class="item-title">${escapeHtml(item.question)}</div>
        <div class="item-date">${fmtDate(item.date)}</div>
      </div>
    </div>`).join('');
  $('cnt').textContent = `전체 ${DATA.length}개`;
}

function markOn(id){
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('on', el.dataset.id === String(id)));
}

function openDetail(id, push){
  const k = DATA.findIndex(d => String(d.id) === String(id));
  if (k < 0) return false;
  const item = DATA[k];
  if (push) history.pushState({}, '', '?q=' + encodeURIComponent(item.id));
  $('detail').hidden = false;
  const b = badgeOf(item);
  $('detailBadge').textContent = b;
  $('detailBadge').style.visibility = b ? 'visible' : 'hidden';
  $('detailTitle').textContent = item.question;
  $('detailDate').textContent = fmtDate(item.date);
  $('detailAnswer').innerHTML = renderAnswer(item.answer);
  // 목록 순서(새 질문이 위)에서 위 = 다음 질문, 아래 = 이전 질문
  const newer = DATA[k - 1], older = DATA[k + 1];
  $('pn').innerHTML =
    (older ? `<button data-id="${escapeHtml(older.id)}">← 이전 질문 ${badgeOf(older)}<b>${escapeHtml(older.question)}</b></button>` : '<span class="gap"></span>') +
    (newer ? `<button class="nx" data-id="${escapeHtml(newer.id)}">다음 질문 ${badgeOf(newer)} →<b>${escapeHtml(newer.question)}</b></button>` : '<span class="gap"></span>');
  markOn(item.id);
  document.body.classList.add('reading');
  $('view').scrollTop = 0;
  if (mobile()) window.scrollTo(0, 0);
  else { const on = document.querySelector('.item.on'); if (on) on.scrollIntoView({block:'nearest'}); }
  return true;
}

function showList(push){
  if (push) history.pushState({}, '', location.pathname);
  document.body.classList.remove('reading');
  const on = document.querySelector('.item.on');
  if (on) on.scrollIntoView({block:'center'});
}

function init(){
  const q = qs('q');
  if (q && openDetail(q, false)) return;
  showList(false);
  // 넓은 화면에서는 오른쪽이 비지 않도록 맨 위(가장 새) 질문을 보여 준다
  if (!mobile() && DATA.length) { openDetail(DATA[0].id, false); }
}

$('list').addEventListener('click', e => { const el = e.target.closest('.item'); if (el) openDetail(el.dataset.id, true); });
$('pn').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) openDetail(b.dataset.id, true); });
$('backBtn').onclick = () => { if (history.state && qs('q')) history.back(); else showList(true); };
$('titleLink').onclick = () => { $('q').value = ''; filter(); showList(true); if (!mobile() && DATA.length) openDetail(DATA[0].id, false); };

function filter(){
  const v = $('q').value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('.item').forEach(el => {
    const item = DATA.find(d => String(d.id) === el.dataset.id);
    const hit = !v || String(item.number) === v.replace(/^문\s*/, '') ||
      (item.question + ' ' + item.answer).toLowerCase().includes(v);
    el.hidden = !hit; if (hit) n++;
  });
  $('cnt').textContent = v ? `찾은 질문 ${n}개` : `전체 ${DATA.length}개`;
}
$('q').addEventListener('input', filter);
window.addEventListener('popstate', init);

fetch('data.json?t=' + Date.now(), {cache: 'no-store'})
  .then(r => r.json())
  .then(data => {
    DATA = data;
    if (!DATA.length) { $('list').innerHTML = ''; $('emptyView').hidden = false; return; }
    buildList();
    init();
  })
  .catch(err => {
    $('list').innerHTML = '<div class="loading">데이터를 불러오지 못했습니다.</div>';
    console.error(err);
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정회원 가입 — 한국 유란시아서 독자회</title>
<meta name="description" content="한국 유란시아서 독자회 정회원 가입 원서">
<script src="/home-button.js" defer></script>
<style>
:root{--navy:#17365D;--teal:#1F6D73;--gold:#B7791F;--crimson:#9E3D35;--ink:#20242e;--dim:#6b6f7d;--line:#e2ddd0;--cream:#faf8f3;--paper:#fffdf8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.6}
header{background:linear-gradient(160deg,#0d1730 0%,#17365D 46%,#2b4a78 100%);color:#f4f1e8;text-align:center;padding:46px 16px 30px}
header .rib{display:inline-block;border:1px solid rgba(232,196,121,.55);color:#e8c479;font-size:11px;letter-spacing:.24em;padding:4px 14px;border-radius:3px}
header h1{margin:12px 0 4px;font-size:28px}
header p{margin:0;color:#c9d3e8;font-size:14px}
main{max-width:560px;margin:-14px auto 40px;padding:0 16px}
form,.done{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 22px;box-shadow:0 1px 2px rgba(20,24,40,.05),0 6px 18px rgba(20,24,40,.06)}
label{display:block;font-weight:700;margin:16px 0 6px;font-size:14px}
label:first-of-type{margin-top:0}
label small{font-weight:400;color:var(--dim)}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;background:var(--paper);color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(183,121,31,.14)}
.years{display:flex;align-items:center;gap:8px}.years input{width:110px}
.agree{margin-top:20px;padding:12px 14px;background:var(--cream);border:1px solid var(--line);border-radius:8px;font-size:13px;color:#3b3f4a}
.agree label{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer}
.agree input{margin-top:4px;width:17px;height:17px;flex:0 0 auto}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:9px;background:var(--teal);color:#fff;font:700 16px/1 inherit;font-family:inherit;cursor:pointer}
button:hover{background:#185a5f}button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:12px;font-size:14px;color:var(--crimson);min-height:1em}
.done{text-align:center;display:none}.done h2{color:var(--teal);margin:6px 0 8px}
.done a{display:inline-block;margin-top:14px;color:var(--navy);text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="rib">URANTIA BOOK KOREA</div>
  <h1>정회원 가입 원서</h1>
  <p>한국 유란시아서 독자회의 정회원이 되어 주셔서 고맙습니다.</p>
</header>
<main>
  <form id="f" novalidate>
    <label for="name">이름</label>
    <input type="text" id="name" name="name" maxlength="40" autocomplete="name" required>

    <label for="phone">전화번호 <small>(예: 010-1234-5678)</small></label>
    <input type="tel" id="phone" name="phone" maxlength="20" autocomplete="tel" inputmode="tel" required>

    <label for="address">주소</label>
    <textarea id="address" name="address" maxlength="200" autocomplete="street-address" required></textarea>

    <label for="years">유란시아서를 읽은 햇수</label>
    <div class="years"><input type="number" id="years" name="years" min="0" max="100" step="1" inputmode="numeric" required> 년</div>

    <div class="hp" aria-hidden="true"><label for="website">웹사이트</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>

    <div class="agree">
      적어 주신 이름·전화번호·주소·읽은 햇수는 정회원 관리와 연락에만 쓰며, 관리자만 볼 수 있고 바깥에 공개하거나 남에게 넘기지 않습니다. 지우기를 원하시면 언제든 trusteen@gmail.com 으로 알려 주세요.
      <label><input type="checkbox" id="agree"> 위 내용에 동의합니다.</label>
    </div>

    <button type="submit" id="go">가입 원서 보내기</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>

  <div class="done" id="done">
    <h2>원서를 받았습니다</h2>
    <p>정회원 가입을 신청해 주셔서 고맙습니다.<br>확인한 뒤 연락드리겠습니다.</p>
    <a href="/">홈페이지로 돌아가기</a>
  </div>
</main>
<script>
// 집 컴퓨터에서 미리 볼 때는 같은 주소의 /api 를, 홈페이지에서는 원서 저장소(워커)를 쓴다.
var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '' : 'https://urantia-members.trusteen.workers.dev';
var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
f.addEventListener('submit', function (e) {
  e.preventDefault();
  var v = function (id) { return document.getElementById(id).value.trim(); };
  var d = { name: v('name'), phone: v('phone'), address: v('address'), years: v('years'),
            website: v('website'), agree: document.getElementById('agree').checked };
  if (!d.name) return say('이름을 적어 주세요.', 'name');
  if (d.phone.replace(/\D/g, '').length < 9) return say('전화번호를 확인해 주세요.', 'phone');
  if (!d.address) return say('주소를 적어 주세요.', 'address');
  if (d.years === '' || isNaN(+d.years) || +d.years < 0 || +d.years > 100) return say('읽은 햇수를 숫자로 적어 주세요.', 'years');
  if (!d.agree) return say('개인 정보 수집에 동의해 주세요.', 'agree');
  d.years = +d.years;
  go.disabled = true; go.textContent = '보내는 중…'; msg.textContent = '';
  fetch(API + '/api/join', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(d) })
    .then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
    .then(function (x) {
      if (!x[0]) throw new Error(x[1].error || '보내지 못했습니다.');
      f.style.display = 'none'; document.getElementById('done').style.display = 'block';
      window.scrollTo(0, 0);
    })
    .catch(function (err) { say(err.message === 'Failed to fetch' ? '연결이 되지 않습니다. 잠시 뒤에 다시 보내 주세요.' : err.message); })
    .then(function () { go.disabled = false; go.textContent = '가입 원서 보내기'; });
});
function say(t, id) { msg.textContent = t; if (id) document.getElementById(id).focus(); }
</script>
</body>
</html>

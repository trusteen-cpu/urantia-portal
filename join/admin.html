<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>정회원 명단 — 관리자</title>
<style>
:root{--navy:#17365D;--teal:#1F6D73;--gold:#B7791F;--crimson:#9E3D35;--ink:#20242e;--dim:#6b6f7d;--line:#e2ddd0;--cream:#faf8f3;--paper:#fffdf8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header a{color:#e8c479;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.login{max-width:380px;margin:40px auto}
.login p{margin:0 0 10px;color:var(--dim)}
input,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);color:var(--ink)}
.login input{width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:7px;padding:8px 14px;background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.del{background:#fff;color:var(--crimson);border:1px solid #e6c9c5;padding:5px 9px;font-weight:400}
.login button{width:100%;margin-top:10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .count{flex:1;color:var(--dim)}
.bar input{min-width:200px}
.err{color:var(--crimson);margin-top:8px;min-height:1em}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f3efe4;font-size:13px;white-space:nowrap;position:sticky;top:0}
td.n{text-align:right;white-space:nowrap}td.at{white-space:nowrap;color:var(--dim);font-size:13px}
td.addr{max-width:320px}
tr:last-child td{border-bottom:0}
select.st{padding:4px 6px}select.st.ok{color:var(--teal);font-weight:700}
.empty{padding:30px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<header><h1>정회원 가입 원서 명단</h1><a href="/join/">가입 원서 보기</a><a href="/">홈페이지</a></header>
<main>
  <div class="box login" id="login">
    <p>관리자 열쇠를 넣어 주세요. 이 창을 닫으면 다시 넣어야 합니다.</p>
    <form id="lf"><input type="password" id="key" autocomplete="current-password" placeholder="관리자 열쇠"><button>명단 열기</button></form>
    <div class="err" id="lerr"></div>
  </div>

  <div id="list" hidden>
    <div class="bar">
      <span class="count" id="count"></span>
      <input type="search" id="q" placeholder="이름·전화·주소로 찾기">
      <button class="ghost" id="reload">새로 읽기</button>
      <button id="csv">엑셀(CSV) 내려받기</button>
      <button class="ghost" id="out">닫기</button>
    </div>
    <div class="tw"><table>
      <thead><tr><th>#</th><th>신청일</th><th>이름</th><th>전화번호</th><th>주소</th><th>읽은 햇수</th><th>상태</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
    <div class="err" id="err"></div>
  </div>
</main>
<script>
var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '' : 'https://urantia-members.trusteen.workers.dev';
var KEY = '', rows = [];
try { KEY = sessionStorage.getItem('memberKey') || ''; } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function day(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function call(method, path, body) {
  return fetch(API + path, { method: method, headers: { 'content-type': 'application/json', 'X-Admin-Key': KEY }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || '실패'); e.status = r.status; throw e; } return j; }); });
}
function load() {
  $('err').textContent = '';
  return call('GET', '/api/members').then(function (j) {
    rows = j.rows; $('login').hidden = true; $('list').hidden = false; draw();
  }).catch(function (e) {
    if (e.status === 401) { KEY = ''; try { sessionStorage.removeItem('memberKey'); } catch (x) {} $('login').hidden = false; $('list').hidden = true; $('lerr').textContent = e.message; }
    else $('err').textContent = e.message === 'Failed to fetch' ? '연결이 되지 않습니다.' : e.message;
  });
}
function draw() {
  var q = $('q').value.trim().toLowerCase();
  var show = rows.filter(function (r) { return !q || (r.name + ' ' + r.phone + ' ' + r.address).toLowerCase().indexOf(q) >= 0; });
  var wait = rows.filter(function (r) { return r.status !== '승인'; }).length;
  $('count').textContent = '모두 ' + rows.length + '명 · 대기 ' + wait + '명' + (q ? ' · 찾은 ' + show.length + '명' : '');
  $('tb').innerHTML = show.length ? show.map(function (r, i) {
    return '<tr data-id="' + esc(r.id) + '"><td class="n">' + (rows.length - rows.indexOf(r)) + '</td><td class="at">' + day(r.at) + '</td><td>' + esc(r.name) +
      '</td><td class="n"><a href="tel:' + esc(r.phone.replace(/[^0-9+]/g, '')) + '">' + esc(r.phone) + '</a></td><td class="addr">' + esc(r.address) +
      '</td><td class="n">' + esc(r.years) + '년</td><td><select class="st' + (r.status === '승인' ? ' ok' : '') + '">' +
      ['대기', '승인', '보류'].map(function (s) { return '<option' + (s === r.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
      '</select></td><td><button class="del">지우기</button></td></tr>';
  }).join('') : '<tr><td colspan="8" class="empty">' + (rows.length ? '찾는 이름이 없습니다.' : '아직 받은 원서가 없습니다.') + '</td></tr>';
}
$('lf').addEventListener('submit', function (e) {
  e.preventDefault(); KEY = $('key').value.trim(); if (!KEY) return;
  try { sessionStorage.setItem('memberKey', KEY); } catch (x) {}
  $('lerr').textContent = ''; load();
});
$('q').addEventListener('input', draw);
$('reload').addEventListener('click', load);
$('out').addEventListener('click', function () { KEY = ''; rows = []; try { sessionStorage.removeItem('memberKey'); } catch (x) {} $('key').value = ''; $('list').hidden = true; $('login').hidden = false; $('tb').innerHTML = ''; });
$('tb').addEventListener('change', function (e) {
  if (!e.target.classList.contains('st')) return;
  var id = e.target.closest('tr').dataset.id, s = e.target.value;
  call('POST', '/api/members/' + encodeURIComponent(id), { status: s }).then(function () {
    rows.forEach(function (r) { if (r.id === id) r.status = s; }); draw();
  }).catch(function (x) { $('err').textContent = x.message; load(); });
});
$('tb').addEventListener('click', function (e) {
  if (!e.target.classList.contains('del')) return;
  var tr = e.target.closest('tr'), id = tr.dataset.id, r = rows.filter(function (x) { return x.id === id; })[0];
  if (!confirm((r ? r.name : '') + ' 님의 원서를 지울까요? 되살릴 수 없습니다.')) return;
  call('DELETE', '/api/members/' + encodeURIComponent(id)).then(function () {
    rows = rows.filter(function (x) { return x.id !== id; }); draw();
  }).catch(function (x) { $('err').textContent = x.message; });
});
$('csv').addEventListener('click', function () {
  var q = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
  var lines = [['신청일', '이름', '전화번호', '주소', '읽은 햇수', '상태'].map(q).join(',')].concat(rows.map(function (r) {
    return [day(r.at), r.name, r.phone, r.address, r.years, r.status].map(q).join(',');
  }));
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = '정회원명단-' + day(new Date().toISOString()).slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
});
if (KEY) load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>회원 관리 — 관리자</title>
<style>
:root{--navy:#17365D;--teal:#1F6D73;--gold:#B7791F;--crimson:#9E3D35;--ink:#20242e;--dim:#6b6f7d;--line:#e2ddd0;--cream:#faf8f3;--paper:#fffdf8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header a{color:#e8c479;font-size:13px}
main{max-width:1280px;margin:0 auto;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.login{max-width:380px;margin:40px auto}
.login p{margin:0 0 10px;color:var(--dim)}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);color:var(--ink)}
.login input{width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:7px;padding:8px 14px;background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.sm{padding:4px 8px;font-weight:400;font-size:12.5px;background:#fff;color:var(--navy);border:1px solid var(--line);white-space:nowrap}
button.sm.red{color:var(--crimson);border-color:#e6c9c5}
.login button{width:100%;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#fff;color:var(--navy);border:1px solid var(--line)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .count{flex:1;color:var(--dim);min-width:200px}
.bar input[type=search]{min-width:200px}
.mail{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px}
.mail b{color:var(--navy)}
.mail input{flex:1;min-width:200px}
.err{color:var(--crimson);margin-top:8px;min-height:1em}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f3efe4;font-size:13px;white-space:nowrap;position:sticky;top:0}
td.n{text-align:right;white-space:nowrap}td.at{white-space:nowrap;color:var(--dim);font-size:13px}
td.addr{max-width:280px}
td.acts{white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.out td{background:#fbf0ef;color:#8a6a66}
.st{font-weight:700;color:var(--teal);white-space:nowrap}.st.x{color:var(--crimson)}
.empty{padding:30px;text-align:center;color:var(--dim)}
.oldnote{margin:0 0 10px;padding:10px 12px;background:#fdf6ea;border-radius:8px;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>회원 관리</h1><a href="/join/">가입 화면</a><a href="/">홈페이지</a></header>
<main>
  <div class="box login" id="login">
    <p>관리자 열쇠를 넣어 주세요. 이 창을 닫으면 다시 넣어야 합니다.</p>
    <form id="lf"><input type="password" id="key" autocomplete="current-password" placeholder="관리자 열쇠"><button>열기</button></form>
    <div class="err" id="lerr"></div>
  </div>
  <div id="app" hidden>
    <div class="tabs"><button class="on" data-t="users">정회원</button><button data-t="old">예전 가입 원서 (11월 13일 이전)</button>
      <span style="flex:1"></span><button class="ghost" id="reload">새로 읽기</button><button class="ghost" id="out">닫기</button></div>

    <section id="users">
      <div class="bar">
        <span class="count" id="count"></span>
        <select id="fst"><option value="">모두</option><option>회원</option><option>축출</option></select>
        <input type="search" id="q" placeholder="이름·전화·이메일·주소로 찾기">
        <button class="ghost" id="csv">엑셀(CSV)</button>
      </div>
      <div class="mail">
        <b>메일 보내기</b> <span id="selCount">선택 0명</span>
        <input type="text" id="subj" placeholder="메일 제목 (선택)">
        <button id="gmail">Gmail로 쓰기</button>
        <button class="ghost" id="mailto">메일 프로그램으로</button>
        <button class="ghost" id="copy">주소 복사</button>
      </div>
      <div class="tw"><table>
        <thead><tr><th><input type="checkbox" id="all" title="보이는 회원 모두 선택"></th><th>가입일</th><th>이름</th><th>이메일</th><th>전화번호</th><th>주소</th><th>햇수</th><th>상태</th><th>메모</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table></div>
    </section>

    <section id="old" hidden>
      <p class="oldnote">2026년 11월 13일 이전에 받은 가입 원서입니다. 그때는 로그인 기능이 없어 이분들은 로그인 화면(urantiareaders.com/login/)의 「11월 13일 이전에 가입 원서를 내신 분」 칸에 원서의 이름과 전화번호를 넣고 이메일·비밀번호만 정하면 바로 회원이 됩니다. 그렇게 안내해 주세요.</p>
      <div class="tw"><table>
        <thead><tr><th>신청일</th><th>이름</th><th>전화번호</th><th>이메일</th><th>주소</th><th>햇수</th><th>그때 상태</th><th>다시 가입</th><th></th></tr></thead>
        <tbody id="otb"></tbody>
      </table></div>
    </section>
    <div class="err" id="err"></div>
  </div>
</main>
<script>
var API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '' : 'https://urantia-members.trusteen.workers.dev';
var KEY = '', users = [], olds = [], sel = {};
try { KEY = sessionStorage.getItem('memberKey') || ''; } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function day(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function call(method, path, body) {
  return fetch(API + path, { method: method, headers: { 'content-type': 'application/json', 'X-Admin-Key': KEY }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || '실패'); e.status = r.status; throw e; } return j; }); });
}
function fail(e) {
  if (e.status === 401 || e.status === 429) { KEY = ''; try { sessionStorage.removeItem('memberKey'); } catch (x) {} $('login').hidden = false; $('app').hidden = true; $('lerr').textContent = e.message; }
  else $('err').textContent = e.message === 'Failed to fetch' ? '연결이 되지 않습니다.' : e.message;
}
function load() {
  $('err').textContent = '';
  return Promise.all([call('GET', '/api/users'), call('GET', '/api/members')]).then(function (x) {
    users = x[0].rows; olds = x[1].rows; $('login').hidden = true; $('app').hidden = false; draw(); drawOld();
  }).catch(fail);
}
function shown() {
  var q = $('q').value.trim().toLowerCase(), f = $('fst').value;
  return users.filter(function (r) { return (!f || r.status === f) && (!q || (r.name + ' ' + r.phone + ' ' + r.email + ' ' + r.address + ' ' + (r.memo || '')).toLowerCase().indexOf(q) >= 0); });
}
function draw() {
  var show = shown(), out = users.filter(function (r) { return r.status !== '회원'; }).length;
  $('count').textContent = '정회원 ' + (users.length - out) + '명' + (out ? ' · 축출 ' + out + '명' : '') + (show.length !== users.length ? ' · 보이는 ' + show.length + '명' : '');
  $('tb').innerHTML = show.length ? show.map(function (r) {
    var x = r.status !== '회원';
    return '<tr data-id="' + esc(r.id) + '"' + (x ? ' class="out"' : '') + '><td><input type="checkbox" class="pick"' + (sel[r.id] ? ' checked' : '') + '></td><td class="at">' + day(r.at) + '</td><td><b>' + esc(r.name) + '</b></td>' +
      '<td><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></td><td class="n"><a href="tel:' + esc(String(r.phone).replace(/[^0-9+]/g, '')) + '">' + esc(r.phone) + '</a></td>' +
      '<td class="addr">' + esc(r.address) + '</td><td class="n">' + esc(r.years) + '년</td><td><span class="st' + (x ? ' x' : '') + '">' + esc(r.status) + '</span>' + (r.mustChange ? '<br><small>임시 비밀번호</small>' : '') + '</td>' +
      '<td><button class="sm memo" title="메모 고치기">' + (r.memo ? esc(r.memo) : '메모') + '</button></td>' +
      '<td class="acts">' + (x ? '<button class="sm back">복귀</button>' : '<button class="sm red kick">축출</button>') +
      ' <button class="sm temp">임시 비밀번호</button> <button class="sm red del">삭제</button></td></tr>';
  }).join('') : '<tr><td colspan="10" class="empty">' + (users.length ? '찾는 회원이 없습니다.' : '아직 가입한 회원이 없습니다.') + '</td></tr>';
  pickCount();
}
function drawOld() {
  var emails = {}, phones = {};
  users.forEach(function (u) { emails[u.email] = 1; phones[String(u.phone).replace(/\D/g, '')] = 1; });
  $('otb').innerHTML = olds.length ? olds.map(function (r) {
    var again = r.claimed || (r.email && emails[String(r.email).toLowerCase()]) || phones[String(r.phone).replace(/\D/g, '')];
    return '<tr data-id="' + esc(r.id) + '"><td class="at">' + day(r.at) + '</td><td>' + esc(r.name) + '</td><td class="n"><a href="tel:' + esc(String(r.phone).replace(/[^0-9+]/g, '')) + '">' + esc(r.phone) + '</a></td>' +
      '<td>' + (r.email ? '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' : '') + '</td><td class="addr">' + esc(r.address) + '</td><td class="n">' + esc(r.years) + '년</td>' +
      '<td>' + esc(r.status) + '</td><td>' + (again ? '<span class="st">✔ 다시 가입함</span>' : '아직') + '</td><td><button class="sm red odel">지우기</button></td></tr>';
  }).join('') : '<tr><td colspan="9" class="empty">예전 원서가 없습니다.</td></tr>';
}
function picked() { return users.filter(function (r) { return sel[r.id] && r.status === '회원'; }); }
function pickCount() { var p = picked(); $('selCount').textContent = '선택 ' + p.length + '명' + (p.length ? '' : ' (표 왼쪽 네모를 눌러 고르세요)'); }
function needPick() { var p = picked(); if (!p.length) { alert('메일 받을 회원을 먼저 고르세요. 맨 위 네모를 누르면 보이는 회원이 모두 골라집니다.'); return null; } var m = p.map(function (r) { return r.email; }).filter(Boolean); if (m.length < p.length) alert((p.length - m.length) + '명은 이메일이 없어 빠집니다. 그분들께는 전화로 연락해 주세요.'); return m.length ? m : null; }

$('lf').addEventListener('submit', function (e) {
  e.preventDefault(); KEY = $('key').value.trim(); if (!KEY) return;
  try { sessionStorage.setItem('memberKey', KEY); } catch (x) {}
  $('lerr').textContent = ''; load();
});
document.querySelectorAll('.tabs [data-t]').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.tabs [data-t]').forEach(function (x) { x.classList.toggle('on', x === b); });
    $('users').hidden = b.dataset.t !== 'users'; $('old').hidden = b.dataset.t !== 'old';
  });
});
$('q').addEventListener('input', draw); $('fst').addEventListener('change', draw);
$('reload').addEventListener('click', load);
$('out').addEventListener('click', function () { KEY = ''; users = []; olds = []; try { sessionStorage.removeItem('memberKey'); } catch (x) {} $('key').value = ''; $('app').hidden = true; $('login').hidden = false; $('tb').innerHTML = $('otb').innerHTML = ''; });
$('all').addEventListener('change', function () { var on = this.checked; shown().forEach(function (r) { if (r.status === '회원') sel[r.id] = on; }); draw(); });
$('tb').addEventListener('change', function (e) { if (!e.target.classList.contains('pick')) return; sel[e.target.closest('tr').dataset.id] = e.target.checked; pickCount(); });
function act(id, body) {
  return call('POST', '/api/users/' + id, body).then(function (j) { return load().then(function () { return j; }); }).catch(fail);
}
$('tb').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var id = b.closest('tr').dataset.id, r = users.filter(function (x) { return x.id === id; })[0]; if (!r) return;
  if (b.classList.contains('kick')) { if (confirm(r.name + ' 님을 축출할까요?\n로그인이 막히고 회원 화면을 볼 수 없게 됩니다(나중에 복귀 가능).')) act(id, { status: '축출' }); }
  else if (b.classList.contains('back')) { if (confirm(r.name + ' 님을 다시 회원으로 되돌릴까요?')) act(id, { status: '회원' }); }
  else if (b.classList.contains('memo')) { var m = prompt(r.name + ' 님 메모', r.memo || ''); if (m !== null) act(id, { memo: m }); }
  else if (b.classList.contains('temp')) {
    if (!confirm(r.name + ' 님의 비밀번호를 임시 비밀번호로 바꿀까요?\n지금 비밀번호는 더 이상 쓸 수 없게 됩니다.')) return;
    act(id, { tempPw: true }).then(function (j) {
      if (!j || !j.temp) return;
      var body = r.name + ' 님, 한국 유란시아서 독자회입니다.\n\n임시 비밀번호: ' + j.temp + '\n\nhttps://urantiareaders.com/login/ 에서 이메일(' + r.email + ')과 위 임시 비밀번호로 로그인하신 뒤, 새 비밀번호로 바꿔 주세요.';
      prompt('임시 비밀번호입니다. 회원에게 알려 주세요. (확인을 누르면 Gmail 쓰기 창이 열립니다)', j.temp);
      window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(r.email) + '&su=' + encodeURIComponent('[유란시아서 독자회] 임시 비밀번호 안내') + '&body=' + encodeURIComponent(body), '_blank');
    });
  }
  else if (b.classList.contains('del')) {
    if (!confirm(r.name + ' 님의 회원 정보를 완전히 지울까요? 되살릴 수 없습니다.\n(삭제하면 같은 이메일로 다시 가입할 수 있습니다. 가입을 막으려면 삭제 대신 축출하세요.)')) return;
    call('DELETE', '/api/users/' + id).then(load).catch(fail);
  }
});
$('otb').addEventListener('click', function (e) {
  if (!e.target.classList.contains('odel')) return;
  var id = e.target.closest('tr').dataset.id, r = olds.filter(function (x) { return x.id === id; })[0];
  if (!confirm((r ? r.name : '') + ' 님의 예전 원서를 지울까요? 되살릴 수 없습니다.')) return;
  call('DELETE', '/api/members/' + encodeURIComponent(id)).then(load).catch(fail);
});
$('gmail').addEventListener('click', function () {
  var to = needPick(); if (!to) return;
  window.open('https://mail.google.com/mail/?view=cm&fs=1&bcc=' + encodeURIComponent(to.join(',')) + '&su=' + encodeURIComponent($('subj').value), '_blank');
});
$('mailto').addEventListener('click', function () {
  var to = needPick(); if (!to) return;
  location.href = 'mailto:?bcc=' + to.map(encodeURIComponent).join(',') + '&subject=' + encodeURIComponent($('subj').value);
});
$('copy').addEventListener('click', function () {
  var to = needPick(); if (!to) return;
  var t = to.join(', ');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { alert(to.length + '명의 주소를 복사했습니다. 메일의 숨은 참조(BCC) 칸에 붙여 넣으세요.'); })
    .catch(function () { prompt('아래 주소를 복사하세요.', t); });
});
$('csv').addEventListener('click', function () {
  var q = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
  var lines = [['가입일', '이름', '이메일', '전화번호', '주소', '읽은 햇수', '상태', '메모'].map(q).join(',')].concat(users.map(function (r) {
    return [day(r.at), r.name, r.email, r.phone, r.address, r.years, r.status, r.memo || ''].map(q).join(',');
  }));
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = '정회원명단-' + day(new Date().toISOString()) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
});
if (KEY) load();
</script>
</body>
</html>

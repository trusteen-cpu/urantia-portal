<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유란시아서 주제별 연구</title>
<meta property="og:title" content="유란시아서 주제별 연구">
<meta property="og:description" content="주제마다 유란시아서 본문의 가르침을 정리하고 원문을 인용합니다">
<style>
  :root{--bg:#f6f3ec;--card:#fffdf8;--ink:#2a2622;--sub:#857a6d;--brand:#1f3a5f;--gold:#b8862b;--line:#e4dccd;--q:#f3ecdc}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;line-height:1.65}
  header{background:var(--brand);color:#fff;padding:12px 18px 10px 160px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:19px;font-weight:800}
  header .sub{font-size:12.5px;opacity:.8;margin-top:2px}
  .wrap{display:flex;gap:18px;max-width:1280px;margin:0 auto;padding:14px 14px 40px;align-items:flex-start}
  nav{flex:0 0 260px;position:sticky;top:76px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  nav input{margin:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  nav .cnt{font-size:12px;color:var(--sub);margin:-4px 12px 6px}
  nav ol{list-style:none;margin:0;padding:0 6px 8px;overflow-y:auto}
  nav li a{display:block;padding:6px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
  nav li a small{display:block;font-size:11px;color:var(--sub)}
  nav li a:hover{background:#efe6d4}
  nav li a.on{background:var(--brand);color:#fff}
  nav li a.on small{color:#cdd8e6}
  nav select{display:none;margin:0 10px 10px;padding:8px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff}
  main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 28px 26px}
  .bar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:4px}
  .bar button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:5px 12px;font-size:13.5px;cursor:pointer}
  .bar button:disabled{opacity:.4;cursor:default}
  h2{margin:0;font-size:28px;color:var(--brand)}
  .en{color:var(--gold);font-size:14px;letter-spacing:.5px;margin-top:2px}
  .sum{margin:14px 0 18px;padding:14px 18px;background:#eef2f7;border-left:5px solid var(--brand);border-radius:8px;font-size:15.5px}
  h3{font-size:18px;margin:24px 0 8px;color:var(--brand);padding-bottom:4px;border-bottom:2px solid var(--line)}
  h3 b{color:var(--gold);margin-right:6px}
  ul.items{list-style:none;margin:0;padding:0}
  ul.items li{position:relative;padding:6px 0 6px 18px;font-size:15px}
  ul.items li:before{content:"";position:absolute;left:3px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
  ul.items li.q{background:var(--q);border-radius:8px;padding:9px 14px 9px 30px;margin:6px 0;font-size:15.5px;color:#3d342a}
  ul.items li.q:before{content:"“";background:none;width:auto;height:auto;top:2px;left:10px;font-size:26px;color:var(--gold);font-family:Georgia,serif}
  .r{color:var(--sub);font-size:12.5px;white-space:nowrap;margin-left:4px;font-family:-apple-system,"Malgun Gothic",sans-serif}
  a.rl{color:var(--sub);text-decoration:none;border-bottom:1px dotted #b9ab95}
  a.rl:hover{color:var(--brand);border-bottom-color:var(--brand)}
  @media print{a.rl{border:none;color:var(--sub)}}
  .see{margin-top:26px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px}
  .see b{color:var(--sub);margin-right:6px}
  .see a{display:inline-block;margin:3px 4px 3px 0;padding:3px 10px;border-radius:14px;background:#eef2f7;color:var(--brand);text-decoration:none}
  .see a:hover{background:#dce5f0}
  .note{margin-top:22px;font-size:12px;color:var(--sub)}
  @media(max-width:820px){
    header{padding:50px 14px 10px}
    .wrap{display:block;padding:10px}
    nav{position:static;max-height:none;margin-bottom:10px}
    nav ol,nav .cnt{display:none}
    nav select{display:block}
    main{padding:16px 16px 20px}
    h2{font-size:23px}
  }
  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff}
    header,nav,.bar,.ur-home-btn{display:none!important}
    .wrap{display:block;padding:0;max-width:none}
    main{border:none;padding:0}
    h3{break-after:avoid} ul.items li{break-inside:avoid}
  }
</style>
</head>
<body>
<header><h1>유란시아서 주제별 연구</h1><div class="sub">주제마다 본문의 가르침을 정리하고 원문을 인용합니다</div></header>
<div class="wrap">
  <nav>
    <input id="q" type="search" placeholder="주제 찾기 (한글·영문)">
    <div class="cnt" id="cnt"></div>
    <select id="sel" aria-label="주제 고르기"></select>
    <ol id="list"></ol>
  </nav>
  <main>
    <div class="bar">
      <button id="prev" aria-label="이전 주제">◀</button>
      <button id="next" aria-label="다음 주제">▶</button>
      <button id="prt">🖨 인쇄</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<script src="data.js"></script>
<script>
(function(){
  var L = window.TOPICS || [], cur = 0;
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function lk(r){ return '<a class="rl" href="/textapp/index.html#' + esc(r) + '" target="_blank" rel="noopener" title="본문에서 ' + esc(r) + ' 보기">' + esc(r) + '</a>'; }
  function idx(name){ for (var i = 0; i < L.length; i++) if (L[i].t === name) return i; return -1; }
  var list = document.getElementById('list'), sel = document.getElementById('sel');
  list.innerHTML = L.map(function(x, i){ return '<li><a href="#' + encodeURIComponent(x.t) + '" data-i="' + i + '">' + esc(x.t) + '<small>' + esc(x.en) + '</small></a></li>'; }).join('');
  sel.innerHTML = L.map(function(x, i){ return '<option value="' + i + '">' + esc(x.t) + '</option>'; }).join('');
  document.getElementById('cnt').textContent = '주제 ' + L.length + '개 · 가나다순';
  function show(i){
    var x = L[i]; if (!x) return; cur = i;
    var h = '<h2>' + esc(x.t) + '</h2><div class="en">' + esc(x.en) + '</div><div class="sum">' + esc(x.sum) + '</div>';
    x.sections.forEach(function(s, k){
      h += '<h3><b>' + (k + 1) + '</b>' + esc(s.h) + '</h3><ul class="items">';
      s.items.forEach(function(it){
        if (it.q) h += '<li class="q">' + esc(it.q) + ' <span class="r">(' + lk(it.r) + ')</span></li>';
        else h += '<li>' + esc(it.x) + (it.r && it.r.length ? ' <span class="r">(' + it.r.map(lk).join(', ') + ')</span>' : '') + '</li>';
      });
      h += '</ul>';
    });
    if (x.see && x.see.length) h += '<div class="see"><b>관련 주제</b>' + x.see.map(function(n){ return idx(n) >= 0 ? '<a href="#' + encodeURIComponent(n) + '">' + esc(n) + '</a>' : ''; }).join('') + '</div>';
    h += '<div class="note">괄호 안은 유란시아서 편:장.절입니다. 누르면 새 창에서 그 절의 본문이 열립니다.</div>';
    document.getElementById('view').innerHTML = h;
    var as = list.querySelectorAll('a');
    for (var j = 0; j < as.length; j++) as[j].className = (+as[j].getAttribute('data-i') === i ? 'on' : '');
    sel.value = i;
    document.getElementById('prev').disabled = i === 0;
    document.getElementById('next').disabled = i === L.length - 1;
    var on = list.querySelector('a.on'); if (on && on.scrollIntoView && window.innerWidth > 820) on.scrollIntoView({block:'nearest'});
    document.title = x.t + ' · 유란시아서 주제별 연구';
  }
  function fromHash(){ var n = decodeURIComponent(location.hash.slice(1)); var i = idx(n); show(i >= 0 ? i : 0); }
  function go(i){ location.hash = '#' + encodeURIComponent(L[i].t); window.scrollTo(0, 0); }
  sel.onchange = function(){ go(+sel.value); };
  document.getElementById('prev').onclick = function(){ if (cur > 0) go(cur - 1); };
  document.getElementById('next').onclick = function(){ if (cur < L.length - 1) go(cur + 1); };
  document.getElementById('prt').onclick = function(){ window.print(); };
  document.getElementById('q').oninput = function(){
    var k = this.value.replace(/\s+/g, '').toLowerCase(), lis = list.querySelectorAll('li');
    for (var i = 0; i < lis.length; i++) {
      var t = (L[i].t + L[i].en).replace(/\s+/g, '').toLowerCase();
      lis[i].style.display = !k || t.indexOf(k) >= 0 ? '' : 'none';
    }
  };
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
<script src="/home-button.js" data-pos="left" defer></script>
</body>
</html>

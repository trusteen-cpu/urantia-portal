<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 강론 — 한국 유란시아서 독자 모임</title>
<meta property="og:title" content="오늘의 강론 — 한국 유란시아서 독자 모임">
<meta property="og:description" content="유란시아서 한 구절로 여는 하루 — 영상과 강론 원고">
<style>
:root{--navy:#12203f;--navy2:#1b2c52;--gold:#b7791f;--gold2:#d6a84a;--ink:#22262e;--dim:#6b7280;--line:#e4e7ec;--bg:#f6f7f9;--card:#fff;--quote:#fbf7ee}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e6e8ec;--dim:#9aa3b2;--line:#2c3446;--bg:#10141c;--card:#171c27;--quote:#1f2330}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Malgun Gothic","맑은 고딕",system-ui,sans-serif}
a{color:inherit}
.top{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#eef2f8;border-bottom:3px solid var(--gold)}
.top .in{max-width:1180px;margin:0 auto;padding:15px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px}
.crumb{font-size:13px;color:#aebbd2}.crumb a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25)}
.grow{flex:1}
.tbtn{display:inline-block;padding:7px 13px;border-radius:999px;font-size:13.5px;text-decoration:none;color:#f6e3b8;border:1px solid rgba(214,168,74,.55);background:rgba(255,255,255,.06);white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
.player{background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(18,32,63,.18)}
.player .ratio{position:relative;padding-top:56.25%}
.player #stage{position:absolute;inset:0;width:100%;height:100%;border:0}
.now{display:flex;align-items:center;gap:10px;margin:12px 4px 4px;font-size:14px;color:var(--dim);flex-wrap:wrap}
.now b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:10px}
.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card.on{outline:2px solid var(--gold2)}
.thumb{position:relative;padding-top:56.25%;background:#dfe3ea}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{padding:9px 11px;font-size:14px;line-height:1.45;min-height:52px}
.msg{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--dim);font-size:14px}
.tabs{display:flex;gap:6px;margin:28px 0 14px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;font-size:15.5px;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--gold)}
.pane{display:none}.pane.on{display:block}
.list{list-style:none;margin:0;padding:0}
.list li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.list li:hover{border-color:var(--gold2)}
.list .d{font-size:13px;color:var(--gold);white-space:nowrap;font-weight:700}
.list .t{flex:1;font-weight:700}
.list .r{font-size:13px;color:var(--dim);white-space:nowrap}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 22px 26px}
.doc h2{margin:4px 0 2px;font-size:24px;line-height:1.35}
.doc .meta{color:var(--dim);font-size:14px;margin-bottom:14px}
.verses{background:var(--quote);border-left:4px solid var(--gold);border-radius:6px;padding:12px 16px;margin:0 0 20px;font-size:15.5px}
.verses p{margin:6px 0}.verses b{color:var(--gold);font-size:13px;margin-right:6px}
.body p{margin:0 0 1em;font-size:17.5px;line-height:1.9}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.btn{border:1px solid var(--gold2);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff}
.find{display:flex;gap:8px;flex-wrap:wrap}
.find input{flex:1;min-width:200px;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.hint{font-size:13.5px;color:var(--dim);margin:8px 2px 14px}
.plan{columns:2 320px;column-gap:18px}
.plan div{break-inside:avoid;padding:6px 8px;border-bottom:1px dotted var(--line);font-size:14.5px}
.plan div b{color:var(--gold);display:inline-block;min-width:54px;font-size:13px}
.plan div.done{opacity:.55}
.plan div span{color:var(--dim);font-size:12.5px;margin-left:6px}
.plan h4{column-span:all;margin:16px 0 4px;color:var(--gold)}
@media (max-width:600px){.doc{padding:16px}.body p{font-size:17px}.list li{flex-wrap:wrap}}
</style>
<script src="/home-button.js" data-pos="left" defer></script>
<script src="/kakao-notice.js" defer></script>
</head>
<body>
<header class="top"><div class="in">
  <div><h1>오늘의 강론</h1><div class="crumb"><a href="/">홈</a> › 참여 게시판 › 오늘의 강론</div></div>
  <div class="grow"></div>
  <a class="tbtn" id="ytlink" target="_blank" rel="noopener">유튜브에서 보기</a>
</div></header>

<main>
  <div class="player"><div class="ratio"><div id="stage"></div></div></div>
  <div class="now"><span id="now">재생목록을 불러오는 중…</span><span class="grow"></span><span id="cnt"></span></div>
  <div id="grid" class="grid"></div>

  <div class="tabs" role="tablist">
    <button data-p="scripts" class="on">강론 원고</button>
    <button data-p="find">본문 찾기</button>
    <button data-p="plan">365일 제목</button>
  </div>

  <section class="pane on" id="p-scripts"><div id="scripts"></div></section>

  <section class="pane" id="p-find">
    <div class="find"><input id="q" placeholder="예) 120:2.3  ·  123:2.3~5  ·  196:0" inputmode="text"><button class="btn pri" id="go">본문 보기</button></div>
    <div class="hint">편:장.절 · 범위(123:2.3~5, 123:2.3~3.2) · 장 전체(196:0) — 한글 4차 교정판</div>
    <div id="found"></div>
  </section>

  <section class="pane" id="p-plan"><div class="hint">날마다 한 편씩 이어 가는 강론 제목과 중심 본문입니다. 흐린 것은 이미 올라온 강론입니다.</div><div id="plan" class="plan"></div></section>
</main>

<script>
/* 재생목록: 영상을 이 재생목록에 넣기만 하면 페이지에 자동으로 나타난다 */
var LIST = "PL_uGHPc5SUrAYPz_sbSomPJd8jw4ndrl-";
var PLAYLIST_IS_NEWEST_FIRST = false;     // 새 영상이 목록 끝에 붙는 재생목록 → 뒤집어 최신을 앞으로
document.getElementById('ytlink').href = 'https://www.youtube.com/playlist?list=' + LIST;

var $ = function(s){ return document.querySelector(s) };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

/* ── 유튜브 재생목록 ── */
var player, probe, ids = [], titles = {}, order = [], curIdx = -1;
var grid = $('#grid'), now = $('#now'), cnt = $('#cnt');
var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){
  player = new YT.Player('stage', { playerVars: { listType: 'playlist', list: LIST, rel: 0, modestbranding: 1 },
    events: { onReady: onReady, onStateChange: onState } });
}
function onReady(){ var n = 0; (function poll(){ var pl = player.getPlaylist();
  if (pl && pl.length){ ids = pl.slice(); start(); } else if (++n < 40) setTimeout(poll, 250); else fail(); })(); }
function fail(){ grid.innerHTML = '<div class="msg">아직 재생목록에 영상이 없거나 읽지 못했습니다. 영상이 올라오면 여기에 자동으로 나타납니다.</div>'; now.textContent = ''; }
function start(){
  cnt.textContent = ids.length + '편';
  order = ids.map(function(_, i){ return i });
  if (!PLAYLIST_IS_NEWEST_FIRST){ order.reverse(); try { player.cuePlaylist({ listType: 'playlist', list: LIST, index: order[0] }) } catch (e) {} }
  render(); mark(order[0]); startProbe();
}
function clean(t){ var o = String(t || ''), s = o.replace(/#\s?[^\s#]+/g, '').replace(/\s+/g, ' ').trim();
  return s || o.replace(/#/g, '').replace(/\s+/g, ' ').trim() }   // 해시태그를 떼고, 해시태그뿐이면 # 기호만 뗀다
function setTitle(i, t){ titles[i] = clean(t); var el = document.getElementById('cap-' + i); if (el) el.textContent = titles[i]; if (i === curIdx) showNow(i) }
function startProbe(){ var h = document.createElement('div'); h.id = 'probe'; h.style.cssText = 'position:absolute;left:-9999px;top:0;width:200px;height:120px'; document.body.appendChild(h);
  try { probe = new YT.Player('probe', { height: '120', width: '200', playerVars: { controls: 0 }, events: { onReady: function(){ probeNext(0) } } }) } catch (e) {} }
function probeNext(i){
  if (i >= ids.length){ var h = document.getElementById('probe'); if (h) h.remove(); return }
  if (titles[i]){ probeNext(i + 1); return }
  var id = ids[i], n = 0; try { probe.cueVideoById(id) } catch (e) { probeNext(i + 1); return }
  (function poll(){ var d = null; try { d = probe.getVideoData() } catch (e) {}
    if (d && d.title && d.video_id === id){ setTitle(i, d.title); setTimeout(function(){ probeNext(i + 1) }, 20); return }
    if (++n < 40) setTimeout(poll, 100); else probeNext(i + 1) })();
}
function render(){
  grid.innerHTML = '';
  order.forEach(function(i){ var c = document.createElement('figure'); c.className = 'card'; c.dataset.idx = i;
    c.innerHTML = '<div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + ids[i] + '/mqdefault.jpg"></div><figcaption class="cap" id="cap-' + i + '"></figcaption>';
    c.onclick = function(){ player.playVideoAt(i); $('.player').scrollIntoView({ behavior: 'smooth', block: 'start' }) };
    grid.appendChild(c) });
}
function showNow(i){ now.innerHTML = '지금 강론 · <b>' + esc(titles[i] || '') + '</b>' }
function mark(i){ if (i == null || i < 0) return; curIdx = i;
  try { var d = player.getVideoData(); if (d && d.title && !titles[i]) setTitle(i, d.title) } catch (e) {}
  [].forEach.call(grid.children, function(c){ c.className = 'card' + (+c.dataset.idx === i ? ' on' : '') }); showNow(i) }
function onState(e){ if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.CUED) mark(player.getPlaylistIndex()) }

/* ── 탭 ── */
function tab(p){ [].forEach.call(document.querySelectorAll('.tabs button'), function(b){ b.classList.toggle('on', b.dataset.p === p) });
  [].forEach.call(document.querySelectorAll('.pane'), function(s){ s.classList.toggle('on', s.id === 'p-' + p) }) }
[].forEach.call(document.querySelectorAll('.tabs button'), function(b){ b.onclick = function(){ tab(b.dataset.p); if (b.dataset.p === 'scripts') showList() } });

/* ── 강론 원고 ── */
var DATA = [], PLAN = [];
function load(u){ return fetch(u + '?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : [] }).catch(function(){ return [] }) }
Promise.all([load('data.json'), load('titles.json')]).then(function(x){
  DATA = x[0]; PLAN = x[1];
  var s = new URLSearchParams(location.search).get('s');
  if (s && DATA.some(function(d){ return String(d.no) === s })) showDoc(s); else showList();
  drawPlan();
});
function showList(){
  history.replaceState(null, '', location.pathname);
  if (!DATA.length){ $('#scripts').innerHTML = '<div class="msg">아직 올라온 강론 원고가 없습니다.</div>'; return }
  $('#scripts').innerHTML = '<ul class="list">' + DATA.map(function(d){
    return '<li data-s="' + d.no + '"><span class="d">' + esc(d.date) + '</span><span class="t">' + esc(d.title) + '</span><span class="r">' + esc(d.label) + '</span></li>' }).join('') + '</ul>';
  [].forEach.call(document.querySelectorAll('#scripts li'), function(li){ li.onclick = function(){ showDoc(li.dataset.s) } });
}
function paras(t){ return t.split(/\n\s*\n/).map(function(p){ return '<p>' + esc(p.trim()) + '</p>' }).join('') }
function showDoc(no){
  var d = DATA.filter(function(x){ return String(x.no) === String(no) })[0]; if (!d) return;
  history.replaceState(null, '', '?s=' + d.no); tab('scripts');
  $('#scripts').innerHTML = '<div class="bar"><button class="btn" id="back">← 목록</button><button class="btn pri" id="copy">원고 복사 (텔레프롬프터)</button><a class="btn" id="dl">txt 내려받기</a></div>'
    + '<article class="doc"><div class="meta">제' + d.no + '강 · ' + esc(d.date) + '</div><h2>' + esc(d.title) + '</h2><div class="meta">본문 ' + esc(d.label) + '</div>'
    + '<div class="verses">' + d.verses.map(function(v){ return '<p><b>' + v[0] + '</b>' + esc(v[1]) + '</p>' }).join('') + '</div>'
    + '<div class="body">' + paras(d.body) + '</div></article>';
  $('#back').onclick = showList;
  var txt = d.title + '\n\n' + d.body;
  $('#copy').onclick = function(){ navigator.clipboard.writeText(txt).then(function(){ $('#copy').textContent = '복사했습니다' }) };
  var a = $('#dl'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' })); a.download = '강론' + d.no + ' ' + d.title + '.txt';
  $('#scripts').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ── 본문 찾기 (편마다 나눈 파일을 읽는다) ── */
var PAPERS = {};
function paper(p){ return PAPERS[p] ? Promise.resolve(PAPERS[p]) : fetch('text/p' + p + '.json').then(function(r){ if (!r.ok) throw 0; return r.json() }).then(function(j){ return PAPERS[p] = j }) }
function lookup(ref){
  ref = ref.replace(/\s/g, '').replace(/[–-]/g, '~');
  var m = ref.match(/^(\d+):(\d+)(?:\.(\d+))?(?:~(?:(\d+)\.)?(\d+))?$/);
  if (!m) return Promise.reject('형식을 확인해 주세요 (예: 120:2.3, 123:2.3~5)');
  return paper(m[1]).then(function(P){
    var keys = Object.keys(P), out;
    if (!m[3]) out = keys.filter(function(k){ return k.indexOf(m[1] + ':' + m[2] + '.') === 0 });
    else { var a = m[1] + ':' + m[2] + '.' + m[3], b = m[5] ? m[1] + ':' + (m[4] || m[2]) + '.' + m[5] : a;
      var i = keys.indexOf(a), j = keys.indexOf(b); if (i < 0 || j < 0) throw '없는 절입니다'; out = keys.slice(i, j + 1) }
    if (!out.length) throw '없는 장입니다';
    return out.map(function(k){ return [k, P[k]] });
  }, function(){ throw '없는 편입니다' });
}
function find(){ var r = $('#q').value.trim(); if (!r) return;
  lookup(r).then(function(v){ $('#found').innerHTML = '<div class="verses">' + v.map(function(x){ return '<p><b>' + x[0] + '</b>' + esc(x[1]) + '</p>' }).join('') + '</div>' },
    function(e){ $('#found').innerHTML = '<div class="msg">' + esc(e) + '</div>' }) }
$('#go').onclick = find; $('#q').onkeydown = function(e){ if (e.key === 'Enter') find() };

/* ── 365일 제목 ── */
var MON = ['', '1월 새로운 시작', '2월 아버지의 사랑', '3월 믿음의 용기', '4월 죽음 너머', '5월 가정과 형제애', '6월 내 안에 계신 아버지', '7월 인간 예수', '8월 기도와 예배', '9월 시련과 성장', '10월 진리·아름다움·선함', '11월 봉사와 감사', '12월 영원한 상승'];
function drawPlan(){
  if (!PLAN.length){ $('#plan').innerHTML = '<div class="msg">준비 중입니다.</div>'; return }
  var done = {}; DATA.forEach(function(d){ if (d.day) done[d.day] = d.no });
  var h = '', m = 0;
  PLAN.forEach(function(p){ if (p.month !== m){ m = p.month; h += '<h4>' + MON[m] + '</h4>' }
    h += '<div' + (done[p.day] ? ' class="done"' : '') + '><b>' + p.day + '일째</b>' + esc(p.title) + '<span>' + esc(p.ref) + '</span></div>' });
  $('#plan').innerHTML = h;
}
</script>
</body>
</html>

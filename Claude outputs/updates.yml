# 푸시할 때마다 updates.json 을 다시 만들어 커밋합니다.
# 홈페이지의 빨간 N 딱지가 저절로 최신 상태가 됩니다.
name: updates.json 다시 만들기

on:
  push:
    branches: [main]
    paths-ignore:
      - 'updates.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: updates-json
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: updates.json 만들기
        run: python make_updates.py

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- updates.json; then
            echo "바뀐 것 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "updates.json 자동 갱신 [skip ci]"
          git push

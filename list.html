<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>목록</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero sub" id="hero">
  <canvas id="stars"></canvas>
  <div class="glow"></div>
  <div class="inner">
    <nav class="crumb" id="crumb"></nav>
    <div class="bigico" id="bigico"></div>
    <h1 id="hTitle"></h1>
    <div class="sub" id="hSub"></div>
    <div class="rule"></div>
  </div>
</header>

<div class="searchbar">
  <div class="wrap row">
    <input id="q" type="search" placeholder="이 안에서 찾기" autocomplete="off">
    <a class="home" href="index.html">← 첫 화면</a>
  </div>
</div>

<main class="wrap">
  <div class="tiles" id="tiles"></div>
  <div class="backrow" id="backrow"></div>
</main>

<footer><a href="index.html">첫 화면으로 돌아가기</a></footer>
<a href="#" class="totop" id="totop" title="맨 위로">▲</a>

<script src="app.js"></script>
<script>
(function(){
  const c=document.getElementById('stars'), x=c.getContext('2d');
  function draw(){const w=c.width=c.offsetWidth,h=c.height=c.offsetHeight;x.clearRect(0,0,w,h);
    for(let i=0;i<80;i++){const px=Math.random()*w,py=Math.random()*h*.95,r=Math.random()*1.2+.25,
      a=(1-py/h)*(Math.random()*.6+.15);x.fillStyle='rgba(255,253,244,'+a.toFixed(2)+')';
      x.beginPath();x.arc(px,py,r,0,6.284);x.fill();}}
  draw();window.addEventListener('resize',draw);
})();

const P=new URLSearchParams(location.search);
const GID=P.get('g')||'', I=P.get('i'), K=P.get('k');
let D=null, G=null, ITEM=null, KID=null, LIST=[], COLOR='#17365D', CAFE='#';

loadData().then(d=>{
  D=d; CAFE=(d.site||{}).cafeUrl||'#';
  G=(d.groups||[]).find(g=>g.id===GID);
  if(!G){ tiles.innerHTML='<div class="empty">목록을 찾을 수 없습니다.</div>'; return; }
  COLOR=colorOf(G);
  document.getElementById('hero').style.setProperty('--gc',COLOR);

  let title=G.title, sub='', crumbs='<a href="index.html">홈</a>';
  if(I!==null && G.items[+I]){
    ITEM=G.items[+I];
    crumbs+=' › <a href="'+href(G.id)+'">'+esc(G.title)+'</a>';
    if(K!==null && (ITEM.children||[])[+K]){
      KID=ITEM.children[+K];
      crumbs+=' › <a href="'+href(G.id,+I)+'">'+esc(ITEM.name)+'</a> › <b>'+esc(KID.name)+'</b>';
      title=KID.name; sub=G.title+' › '+ITEM.name;
      LIST=(KID.children||[]).map((o,ji)=>{
        const has=hasPage(o);
        return {o:o, to: has? page(G.id,+I,+K,ji) : (o.url||CAFE), ext:!has, kind: has?'text':'url'};
      });
    }else{
      crumbs+=' › <b>'+esc(ITEM.name)+'</b>';
      title=ITEM.name; sub=G.title;
      LIST=(ITEM.children||[]).map((o,ki)=>{
        const t=targetOf(o,CAFE,G.id,+I,ki);
        return {o:o, to:t.href, ext:t.ext, kids:(o.children||[]).length, kind:t.kind};
      });
    }
  }else{
    crumbs+=' › <b>'+esc(G.title)+'</b>';
    sub=(G.items||[]).length+'개';
    LIST=(G.items||[]).map((o,ii)=>{
      const t=targetOf(o,CAFE,G.id,ii);
      return {o:o, to:t.href, ext:t.ext, kids:(o.children||[]).length, kind:t.kind};
    });
  }
  document.title=title;
  crumb.innerHTML=crumbs;
  bigico.textContent=G.icon||'';
  hTitle.textContent=title;
  hSub.textContent=sub;
  paint('');
  backrow.innerHTML = (I!==null)
    ? '<a class="back" href="'+ (K!==null? href(G.id,+I) : href(G.id)) +'">← '
      + esc(K!==null? ITEM.name : G.title) +' 목록으로</a>'
      + '<a class="back" href="index.html">← 첫 화면</a>'
    : '<a class="back" href="index.html">← 첫 화면</a>';
}).catch(()=>{ tiles.innerHTML='<div class="empty">links.json 을 읽지 못했습니다.</div>'; });

function paint(f){
  f=(f||'').trim().toLowerCase();
  const qs=(D.site||{}).quotes||[];
  const hit=LIST.filter(x=>!f||x.o.name.toLowerCase().includes(f));
  if(!hit.length){ tiles.innerHTML='<div class="empty">결과가 없습니다.</div>'; return; }
  let html='', on=0;
  hit.forEach((x,n)=>{
    /* 여섯 칸마다 그림 판을 끼워 넣는다 */
    if(!f && n && n%6===0 && hit.length>8){
      html+=ornamentTile(on, COLOR, qs[on%Math.max(qs.length,1)]); on++;
    }
    const o=x.o;
    const tag = x.kids          ? '<span class="tag sub">'+x.kids+'</span>'
              : x.kind==='text' ? '<span class="tag doc">글</span>'
              : o.member        ? '<span class="tag mem">회원</span>'
              : (o.url?'':'<span class="tag todo">주소</span>');
    html+='<a class="tile'+(x.kids?' has':'')+'" href="'+esc(x.to)+'"'
        + (x.ext?' target="_blank" rel="noopener"':'')+' style="--tc:'+COLOR+'">'
        + '<span class="no">'+String(n+1).padStart(2,'0')+'</span>'
        + '<span class="tn">'+esc(o.name)+'</span>'
        + tag + ((x.kids||x.kind==='text')?'<span class="go">›</span>':'')
        + '</a>';
  });
  tiles.innerHTML=html;
}
q.addEventListener('input',()=>paint(q.value));
window.addEventListener('scroll',()=>{
  document.getElementById('totop').classList.toggle('on', window.scrollY>500);
});
</script>
</body>
</html>

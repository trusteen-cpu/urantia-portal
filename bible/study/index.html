<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bible Study — 유란시아서와 함께하는 성경 공부</title>
<meta name="description" content="성경의 역사 31과와 성경 각 권 58과 — 유란시아서의 빛으로 읽는 성경 공부 과정 (새들러 박사의 Bible Study 워크북을 바탕으로)">
<style>
:root{--navy:#0f2244;--gold:#c9a227;--teal:#0f6e6a;--bg:#f7f5f0;--card:#fff;--ink:#20242c;--dim:#6b7280;--line:#e3ded3;--tint:#eef5f4;--fs:17px}
html[data-dark="1"]{--bg:#12141a;--card:#181b22;--ink:#dfe3ea;--dim:#98a0ae;--line:#2b3040;--tint:#16262a;--teal:#6cc5bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,"맑은 고딕",serif}
header{background:linear-gradient(180deg,#132a55,#0d1c3a);border-bottom:3px solid var(--gold);color:#fff;padding:9px 15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
header h1{font-size:15.5px;margin:0;font-weight:600}
header .by{font-size:12px;opacity:.72}
header .sp{flex:1}
.btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.2)}
#burger{display:none}
main{display:flex;align-items:flex-start}
#side{width:310px;flex:0 0 310px;height:calc(100vh - 51px);position:sticky;top:51px;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:10px}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13.5px;font-family:inherit}
.grp{margin:14px 0 5px;padding:0 8px;font-size:11.5px;letter-spacing:.06em;color:var(--gold);font-weight:700}
.c{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.c:hover{background:rgba(15,34,68,.06)}
.c.on{background:rgba(201,162,39,.18)}
.c b{color:var(--teal);font-size:11.5px;min-width:26px;font-weight:700;font-family:"맑은 고딕",sans-serif}
#body{flex:1;min-width:0;padding:26px 30px 80px}
.wrap{max-width:900px;margin:0 auto}
.kick{font-family:"맑은 고딕",sans-serif;font-size:12.5px;color:var(--teal);font-weight:700;letter-spacing:.06em}
h2.ut{font-size:28px;margin:6px 0 4px;color:var(--navy)}
html[data-dark="1"] h2.ut{color:#e9d99a}
.sub{font-size:16px;color:var(--dim);margin-bottom:4px}
.en{font-family:Georgia,serif;font-style:italic;font-size:13px;color:var(--dim)}
.sum{margin:18px 0;padding:16px 20px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;font-size:var(--fs);line-height:1.9;word-break:keep-all}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px}
.fact{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:14.5px;line-height:1.7}
.fact b{display:block;font-family:"맑은 고딕",sans-serif;font-size:12px;color:var(--teal);margin-bottom:2px}
h3{font-size:19px;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--navy)}
html[data-dark="1"] h3{color:#cfe0ff}
table.ol{width:100%;border-collapse:collapse;font-size:15px;background:var(--card);border-radius:10px;overflow:hidden}
table.ol td{padding:7px 12px;border-bottom:1px solid var(--line)}
table.ol td:first-child{width:36px;color:var(--dim);font-family:"맑은 고딕",sans-serif;font-size:12.5px}
table.ol td:last-child{text-align:right;white-space:nowrap;color:var(--teal);font-family:"맑은 고딕",sans-serif;font-size:13.5px}
p.t{font-size:var(--fs);line-height:1.95;text-align:justify;word-break:keep-all;margin:0 0 14px}
.ub{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 22px 16px}
.ub h3{border-bottom-color:var(--gold);color:#7a5a1e}
html[data-dark="1"] .ub h3{color:#e9d99a}
.qt{margin:0 0 12px;padding:10px 14px;background:rgba(201,162,39,.09);border-left:3px solid var(--gold);border-radius:0 9px 9px 0;font-size:calc(var(--fs) - 1.5px);line-height:1.85;word-break:keep-all;text-align:justify}
.qt .r{font-family:"맑은 고딕",sans-serif;font-size:12.5px;font-weight:700;color:#9a743a;white-space:nowrap}
.qs{counter-reset:q}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
.qa button{all:unset;display:block;width:100%;box-sizing:border-box;padding:12px 16px;cursor:pointer;font-size:15.5px;line-height:1.7}
.qa button:before{counter-increment:q;content:counter(q) ". ";color:var(--teal);font-weight:700;font-family:"맑은 고딕",sans-serif}
.qa button:after{content:" ▸ 모범 답안";font-size:12px;color:var(--dim);font-family:"맑은 고딕",sans-serif}
.qa.open button:after{content:" ▾ 접기"}
.qa .a{display:none;padding:0 16px 14px 34px;font-size:15px;line-height:1.85;color:var(--ink);word-break:keep-all;border-top:1px dashed var(--line);padding-top:10px}
.qa.open .a{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px}
.copy{margin-top:26px;font-size:12px;color:var(--dim);text-align:center;line-height:1.8}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.card:hover{border-color:var(--gold)}
.card b{display:block;color:var(--navy);font-size:16px;margin-bottom:4px}
html[data-dark="1"] .card b{color:#e9d99a}
.card span{font-size:13px;color:var(--dim)}
@media (max-width:900px){
 #burger{display:inline-block}
 #side{position:fixed;left:0;top:51px;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.2)}
 #side.open{transform:none}
 #body{padding:16px 16px 70px}
 header .by{display:none}
 h2.ut{font-size:23px}
 p.t,.qt{text-align:left}
}
@media print{header,#side,.nav{display:none}#body{padding:0}.qa .a{display:block}.qa button:after{content:""}}
</style></head><body>
<header>
 <button class="btn" id="burger">☰ 목차</button>
 <h1>Bible Study</h1><span class="by">유란시아서와 함께하는 성경 공부</span>
 <span class="sp"></span>
 <button class="btn" id="pr" title="이 과 인쇄">🖨</button>
 <button class="btn" id="fs">가</button>
 <button class="btn" id="dark">◐</button>
 <button class="btn" id="home">⌂</button>
</header>
<main>
 <aside id="side"><input id="q" placeholder="과 제목·책 이름 찾기"><div id="toc"></div></aside>
 <section id="body"><div class="wrap" id="wrap"><p style="color:var(--dim)">불러오는 중…</p></div></section>
</main>
<script>
var $=function(s){return document.querySelector(s)};
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
var T=[],CUR='intro',PEND=null;
function bring(src,cb){PEND=cb;var s=document.createElement('script');s.src=src;
  s.onerror=function(){$('#wrap').innerHTML='<p style="color:var(--dim)">자료를 불러오지 못했습니다. 연결을 확인하고 다시 열어 주세요.</p>'};document.head.appendChild(s)}
function TOC(d){T=d;var f=PEND;PEND=null;f&&f()}
function UNIT(d){var f=PEND;PEND=null;f&&f(d)}
function num(id){return id==='intro'?'·':(id.charAt(0)==='h'?'':id.charAt(0)==='o'?'구':'신')+(+id.slice(1))}
function renderTOC(){
  var f=($('#q').value||'').trim().toLowerCase(),h='',last=null;
  if(!f)h+='<div class="c'+(CUR==='intro'?' on':'')+'" data-id="intro"><b>·</b><span>이 공부 과정에 대하여</span></div>';
  T.forEach(function(t){
    if(f&&(t[2]+' '+t[3]+' '+t[4]).toLowerCase().indexOf(f)<0)return;
    if(t[1]!==last){h+='<div class="grp">'+esc(t[1])+'</div>';last=t[1]}
    h+='<div class="c'+(t[0]===CUR?' on':'')+'" data-id="'+t[0]+'"><b>'+num(t[0])+'</b><span>'+esc(t[2])+'</span></div>'});
  $('#toc').innerHTML=h||'<div style="color:var(--dim);font-size:12.5px;padding:6px">찾은 것이 없습니다.</div>';
  var on=$('#toc .c.on');if(on&&!f)on.scrollIntoView({block:'nearest'});
}
function idx(id){for(var i=0;i<T.length;i++)if(T[i][0]===id)return i;return -1}
function navHtml(){var i=idx(CUR),p=i>0?T[i-1]:(i===0?['intro','','처음']:null),n=i+1<T.length?T[i+1]:null;
  return '<div class="nav">'+(p?'<button data-go="'+p[0]+'">← '+esc(p[2])+'</button>':'<span></span>')
   +(n?'<button data-go="'+n[0]+'">'+esc(n[2])+' →</button>':'<span></span>')+'</div>'
   +'<div class="copy">유란시아서와 함께하는 성경 공부 · 한종인 엮음 · 2026<br>뼈대: William S. Sadler, <i>The Urantia Book Workbooks, Vol. VI — Bible Study</i> · 인용: 유란시아서 새번역본(4차 교정본)</div>'}
function intro(){
  var g={},order=[];T.forEach(function(t){if(!g[t[1]]){g[t[1]]=[];order.push(t[1])}g[t[1]].push(t)});
  var h='<div class="kick">BIBLE STUDY</div><h2 class="ut">유란시아서와 함께하는 성경 공부</h2><div class="sub">성경의 역사 31과 · 성경 각 권 58과</div>'
   +'<div class="sum">이 과정은 유란시아서를 처음 받아 읽던 시카고 독자 모임에서 윌리엄 새들러(William S. Sadler) 박사가 미래의 교사들을 위해 정리한 성경 공부 노트, '
   +'<i>The Urantia Book Workbooks</i> 제6권 「Bible Study」를 뼈대로 삼아 한국어로 새로 엮은 것이다. 앞부분 「성경의 역사」는 성경이 어떻게 기록되고 모이고 전해졌는지, '
   +'이스라엘과 초대 교회의 역사가 어떻게 흘러왔는지를 살핀다. 뒷부분 「성경 각 권 공부」는 창세기부터 요한계시록까지 각 권의 개요와 배경, 형성 과정을 정리하고, '
   +'유란시아서가 그 책과 그 시대에 대해 밝히는 내용을 본문 인용과 함께 붙였다. 과마다 끝에 토론 질문과 모범 답안이 있어 소그룹 공부에 쓸 수 있다.</div>';
  order.forEach(function(k){h+='<h3>'+esc(k)+'</h3><div class="cards">';
    g[k].forEach(function(t){h+='<div class="card" data-go="'+t[0]+'"><b>'+esc(t[2])+'</b><span>'+esc(t[4])+'</span></div>'});h+='</div>'});
  return h}
function render(d){
  var h='<div class="kick">'+esc(d.group)+'</div><h2 class="ut">'+esc(d.title)+'</h2>'
   +(d.subtitle?'<div class="sub">'+esc(d.subtitle)+'</div>':'')
   +'<div class="en">Sadler Workbook: '+esc(d.en)+' (pp. '+d.wb[0]+'–'+d.wb[1]+')</div>'
   +'<div class="sum">'+esc(d.summary)+'</div>';
  if(d.facts&&d.facts.length){h+='<div class="facts">';d.facts.forEach(function(f){h+='<div class="fact"><b>'+esc(f[0])+'</b>'+esc(f[1])+'</div>'});h+='</div>'}
  if(d.outline&&d.outline.length){h+='<h3>간추린 개요</h3><table class="ol">';
    d.outline.forEach(function(o,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(o[0])+'</td><td>'+esc(o[1])+'</td></tr>'});h+='</table>'}
  d.sections.forEach(function(s){h+='<h3>'+esc(s.h)+'</h3>';s.paras.forEach(function(p){h+='<p class="t">'+esc(p)+'</p>'})});
  h+='<div class="ub"><h3>유란시아서의 빛으로</h3>';
  d.ub.paras.forEach(function(p){h+='<p class="t">'+esc(p)+'</p>'});
  d.ub.quotes.forEach(function(q){h+='<div class="qt">'+esc(q[1])+' <span class="r">('+esc(q[0])+')</span></div>'});
  h+='</div><h3>함께 생각해 볼 질문</h3><div class="qs">';
  d.questions.forEach(function(q){h+='<div class="qa"><button>'+esc(q.q)+'</button><div class="a">'+esc(q.a)+'</div></div>'});
  h+='</div>';return h}
function show(h){$('#wrap').innerHTML=h+navHtml();window.scrollTo(0,0)}
function go(id){CUR=id;save('bs_u',id);history.replaceState(null,'','?u='+id);renderTOC();
  if(window.innerWidth<=900)$('#side').classList.remove('open');
  if(id==='intro'){show(intro());document.title='Bible Study — 유란시아서와 함께하는 성경 공부';return}
  $('#wrap').innerHTML='<p style="color:var(--dim)">불러오는 중…</p>';
  bring('data/'+id+'.js',function(d){show(render(d));document.title=d.title+' — Bible Study'})}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  var c=e.target.closest('#toc .c[data-id]');if(c){go(c.dataset.id);return}
  var b=e.target.closest('.qa button');if(b)b.parentNode.classList.toggle('open')});
$('#q').oninput=renderTOC;
$('#burger').onclick=function(){$('#side').classList.toggle('open')};
$('#home').onclick=function(){location.href='/'};
$('#pr').onclick=function(){window.print()};
var F=['15.5px','17px','19px','21.5px'],fi=+load('bs_fs','1');
function af(){document.documentElement.style.setProperty('--fs',F[fi]);save('bs_fs',fi)}
$('#fs').onclick=function(){fi=(fi+1)%F.length;af()};af();
function ad(){document.documentElement.setAttribute('data-dark',load('bs_dark','0'))}
$('#dark').onclick=function(){save('bs_dark',load('bs_dark','0')==='1'?'0':'1');ad()};ad();
bring('data/toc.js',function(){var u=new URLSearchParams(location.search).get('u')||load('bs_u','intro');go(u==='intro'||idx(u)>=0?u:'intro')});
</script>
</body></html>

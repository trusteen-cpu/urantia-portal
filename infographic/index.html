<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유란시아서 인포그래픽</title>
<meta property="og:title" content="유란시아서 인포그래픽">
<meta property="og:description" content="머리말과 196편을 한 장의 그림으로">
<style>
  :root{--bg:#f4efe6;--card:#fffdf8;--ink:#2a2622;--sub:#8a7f72;--brand:#1d2547;--gold:#c8902e;--line:#e6dccb}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all}
  header{background:var(--brand);color:#fff;padding:12px 18px 10px 160px;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px}
  header .sub{font-size:12.5px;opacity:.8;margin-top:2px}
  .wrap{display:flex;gap:16px;max-width:1400px;margin:0 auto;padding:14px 14px 30px;align-items:flex-start}
  nav{flex:0 0 280px;position:sticky;top:76px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  nav input{margin:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  nav ol{list-style:none;margin:0;padding:0 6px 8px;overflow-y:auto}
  nav li a{display:flex;gap:8px;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
  nav li a b{flex:0 0 38px;color:var(--gold);font-weight:800;font-size:13px;text-align:right}
  nav li a:hover{background:#f3ead9}
  nav li a.on{background:var(--brand);color:#fff}
  nav li a.on b{color:#f3d79a}
  nav li a.off{color:#b5aa9b}
  nav li a.off b{color:#d7c9b0}
  main{flex:1;min-width:0}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .bar h2{flex:1;margin:0;font-size:20px;font-weight:800}
  .bar h2 small{color:var(--gold);margin-right:8px}
  .bar button,.bar a{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;text-decoration:none}
  .bar button:disabled{opacity:.4;cursor:default}
  .img{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:300px}
  .img img{display:block;width:100%;height:auto}
  .soon{padding:80px 20px;text-align:center;color:var(--sub);font-size:16px;line-height:1.8}
  nav select{display:none;margin:0 10px 10px;padding:8px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:#fff}
  @media(max-width:820px){
    header{padding:50px 14px 10px}
    .wrap{display:block;padding:10px}
    nav{position:static;max-height:none;margin-bottom:10px}
    nav ol{display:none}
    nav select{display:block}
    .bar h2{font-size:17px}
  }
  @media print{
    @page{size:A4;margin:6mm}
    body{background:#fff}
    header,nav,.bar,.ur-home-btn{display:none!important}
    .wrap{display:block;padding:0;max-width:none}
    .img{border:none;border-radius:0;min-height:0}
    .img img{width:auto;max-width:100%;max-height:283mm;margin:0 auto}
  }
</style>
</head>
<body>
<header><h1>유란시아서 인포그래픽</h1><div class="sub">머리말과 196편을 한 장의 그림으로</div></header>
<div class="wrap">
  <nav>
    <input id="q" type="search" placeholder="편 번호나 제목 찾기">
    <select id="sel" aria-label="편 고르기"></select>
    <ol id="list"></ol>
  </nav>
  <main>
    <div class="bar">
      <h2 id="ttl"></h2>
      <button id="prev" aria-label="이전 편">◀</button>
      <button id="next" aria-label="다음 편">▶</button>
      <a id="full" target="_blank" rel="noopener">원본 크기</a>
      <button id="prt">🖨 인쇄</button>
    </div>
    <div class="img" id="view"></div>
  </main>
</div>
<script src="list.js"></script>
<script>
(function(){
  var L = window.IG || [], cur = 0;
  function label(n){ return n === 0 ? '머리말' : '제' + n + '편'; }
  function src(n){ return 'img/p' + ('00' + n).slice(-3) + '.webp'; }
  var list = document.getElementById('list'), sel = document.getElementById('sel');
  list.innerHTML = L.map(function(x){
    return '<li><a href="#p' + x[0] + '" data-n="' + x[0] + '"' + (x[2] ? '' : ' class="off"') + '><b>' + (x[0] === 0 ? '머리말' : x[0]) + '</b><span>' + (x[0] === 0 ? '' : x[1]) + '</span></a></li>';
  }).join('');
  sel.innerHTML = L.map(function(x){
    return '<option value="' + x[0] + '">' + label(x[0]) + (x[0] ? ' ' + x[1] : '') + (x[2] ? '' : ' (준비 중)') + '</option>';
  }).join('');
  function show(n){
    var x = L[n]; if (!x) return; cur = n;
    document.getElementById('ttl').innerHTML = '<small>' + label(n) + '</small>' + (n ? x[1] : '');
    var v = document.getElementById('view'), full = document.getElementById('full');
    if (x[2]) {
      v.innerHTML = '<a href="' + src(n) + '" target="_blank" rel="noopener"><img src="' + src(n) + '" alt="' + label(n) + ' ' + x[1] + ' 인포그래픽"></a>';
      full.href = src(n); full.style.visibility = 'visible'; document.getElementById('prt').style.visibility = 'visible';
    } else {
      v.innerHTML = '<div class="soon">' + label(n) + ' 인포그래픽은 준비 중입니다.<br>머리말부터 차례로 올리고 있습니다.</div>';
      full.style.visibility = 'hidden'; document.getElementById('prt').style.visibility = 'hidden';
    }
    var as = list.querySelectorAll('a');
    for (var i = 0; i < as.length; i++) as[i].className = (+as[i].getAttribute('data-n') === n ? 'on' : (L[+as[i].getAttribute('data-n')][2] ? '' : 'off'));
    sel.value = n;
    document.getElementById('prev').disabled = n === 0;
    document.getElementById('next').disabled = n === L.length - 1;
    var on = list.querySelector('a.on'); if (on && on.scrollIntoView && window.innerWidth > 820) on.scrollIntoView({block:'nearest'});
    document.title = label(n) + (n ? ' ' + x[1] : '') + ' · 유란시아서 인포그래픽';
  }
  function fromHash(){ var m = /^#p(\d+)$/.exec(location.hash); show(m ? Math.min(+m[1], L.length - 1) : 0); }
  function go(n){ location.hash = '#p' + n; window.scrollTo(0, 0); }
  sel.onchange = function(){ go(+sel.value); };
  document.getElementById('prt').onclick = function(){ window.print(); };
  document.getElementById('prev').onclick = function(){ if (cur > 0) go(cur - 1); };
  document.getElementById('next').onclick = function(){ if (cur < L.length - 1) go(cur + 1); };
  document.getElementById('q').oninput = function(){
    var k = this.value.replace(/\s+/g, '');
    var as = list.querySelectorAll('li');
    for (var i = 0; i < as.length; i++) {
      var x = L[i], t = (label(x[0]) + x[0] + x[1]).replace(/\s+/g, '');
      as[i].style.display = !k || t.indexOf(k) >= 0 ? '' : 'none';
    }
  };
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
<script src="/home-button.js" data-pos="left" defer></script>
</body>
</html>
